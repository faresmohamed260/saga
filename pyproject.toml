[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-story-system"
version = "0.2.0rc11"
description = "S.A.G.A. - Story Analysis, Generation, and Archives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "alembic",
  "beautifulsoup4",
  "ebooklib",
  "fastapi",
  "google-genai",
  "langgraph",
  "mistralai",
  "pypdf",
  "Pillow",
  "psycopg[binary]",
  "requests",
  "sqlalchemy",
  "trafilatura",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
nlp = [
  "spacy",
  "spacy-transformers",
  "spacy-experimental",
]
graph = [
  "neo4j",
]
[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = [
  "apps",
  "apps.*",
  "packages",
  "packages.*",
  "integrations",
  "integrations.*",
]

[project.scripts]
saga-deploy = "packages.deployment_runtime.cli:main"
saga-runtime-api = "apps.dashboard_api.app:main"
saga-process = "packages.deployment_runtime.processes:main"
saga-execution = "scripts.run_execution_worker:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
