[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "saga-story-system"
version = "0.1.0"
description = "S.A.G.A. — Story Analysis, Generation, and Archives."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4",
  "ebooklib",
  "fastapi",
  "ftfy",
  "google-genai",
  "mistralai",
  "openai",
  "Pillow",
  "python-multipart",
  "pypdf",
  "PyMuPDF",
  "requests",
  "scikit-learn",
  "sqlalchemy",
  "trafilatura",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
]
nlp = [
  "spacy",
  "spacy-transformers",
  "spacy-experimental",
]
graph = [
  "neo4j",
]
[tool.setuptools.packages.find]
where = ["."]
namespaces = true
include = [
  "apps",
  "apps.*",
  "saga",
  "saga.*",
  "integrations",
  "integrations.*",
  "apps.dashboard_api",
  "tests",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
