name: Saturn Worker Probe V2

on:
  push:
    branches:
      - experiment/saturn-worker
    paths:
      - .github/saturn-worker-probe-v2-trigger
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SATURN_BASE_URL: https://app.community.saturnenterprise.io
      SATURN_TOKEN: ${{ secrets.SATURN_TOKEN }}
      SATURN_PROBE_OUTPUT: /tmp/saturn-worker-probe-v2.json
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/saturn-worker

      - name: Require Saturn API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SATURN_TOKEN:-}" || { echo "::error::SATURN_TOKEN is missing"; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current Saturn client
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            'git+https://github.com/saturncloud/saturn-client.git@main'

      - name: Probe community A10G deployment
        id: saturn_probe
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          python - <<'PY'
          import json
          import scripts.saturn_worker_probe as probe

          def choose_community_a10g(sizes):
              eligible = []
              for size in sizes:
                  clusters = size.get('clusters') or []
                  availability = size.get('availability') or []
                  try:
                      gpu_count = float(size.get('gpu') or 0)
                  except (TypeError, ValueError):
                      gpu_count = 0
                  if (
                      'saturn-cluster-community' in clusters
                      and 'ai_studio' in availability
                      and not size.get('disabled')
                      and gpu_count > 0
                  ):
                      eligible.append(size)

              compact = [
                  {
                      'name': item.get('name'),
                      'display_name': item.get('display_name'),
                      'gpu': item.get('gpu'),
                      'gpu_type': item.get('gpu_type'),
                      'price_per_hour': item.get('price_per_hour'),
                      'clusters': item.get('clusters'),
                  }
                  for item in eligible
              ]
              print('community GPU candidates:', json.dumps(compact, indent=2))

              for exact in ('g5xlarge', 'g52xlarge'):
                  for item in eligible:
                      if str(item.get('name')) == exact:
                          print('selected community A10G:', json.dumps(item, indent=2, default=str))
                          return item
              for item in eligible:
                  label = f"{item.get('name','')} {item.get('display_name','')}".lower()
                  if 'a10g' in label or 'a10' in label:
                      print('selected community A10G fallback:', json.dumps(item, indent=2, default=str))
                      return item
              return None

          probe.choose_gpu = choose_community_a10g
          raise SystemExit(probe.main())
          PY
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish probe evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saturn-worker-probe-v2-${{ github.run_id }}
          path: /tmp/saturn-worker-probe-v2.json
          retention-days: 3
          if-no-files-found: warn

      - name: Summarize and enforce
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/saturn-worker-probe-v2.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/saturn-worker-probe-v2.json').read_text())
          selected = data.get('selected_gpu') or {}
          dep = data.get('deployment') or {}
          ws = data.get('workspace_fallback') or {}
          print('### Saturn community GPU probe')
          print(f"- Outcome: `{data.get('outcome', 'unknown')}`")
          print(f"- Selected instance: `{selected.get('name', 'none')}`")
          print(f"- Selected display: `{selected.get('display_name', 'unknown')}`")
          print(f"- Price/hour: `${selected.get('price_per_hour', 'unknown')}`")
          print(f"- Deployment success: `{dep.get('success')}`")
          if dep.get('startup_seconds') is not None:
              print(f"- Deployment startup: `{dep.get('startup_seconds')}s`")
          if dep.get('error'):
              print(f"- Deployment error: `{dep.get('error')}`")
          if ws:
              print(f"- Workspace fallback success: `{ws.get('success')}`")
              if ws.get('error'):
                  print(f"- Workspace error: `{ws.get('error')}`")
          PY
          fi

          code='${{ steps.saturn_probe.outputs.exit_code }}'
          if [ -z "$code" ]; then
            echo "::error::Saturn probe did not produce an exit code"
            exit 1
          fi
          if [ "$code" != "0" ]; then
            echo "::error::Saturn probe completed with diagnostic exit code $code; inspect artifact"
            exit "$code"
          fi
