name: V3 Ettin Compact Context Probe

on:
  push:
    branches:
      - v3/qualification-ettin-ranking-compact

permissions:
  contents: read

jobs:
  rank:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/v3-ettin-qualification.txt
      - name: Install CPU Torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install Ettin qualification environment
        run: python -m pip install -r requirements/v3-ettin-qualification.txt
      - name: Run compact recent-context Ettin probe
        run: >-
          python -m scripts.run_v3_litbank_identity_ranking
          --root external/litbank
          --out evaluation-artifacts/v3-ranking-hybrid-ettin-compact-2.json
          --candidate-mode hybrid
          --scorer ettin
          --limit 2
          --top-k 4
          --lexical-k 2
          --recent-k 2
          --ettin-context-chars 128
          --ettin-entity-contexts 1
          --ettin-batch-size 8
          --device cpu
          --model-cache .cache/huggingface
      - name: Publish result
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("evaluation-artifacts/v3-ranking-hybrid-ettin-compact-2.json").read_text())
          o = report["aggregate"]["overall"]
          m = o["metrics"]
          c = o["counts"]
          print("## Compact Ettin identity-ranking probe")
          print(f"- Eligible mentions: {c['eligible_mentions']}")
          print(f"- Candidate retrieval: {m['candidate_retrieval_rate']:.4f}")
          print(f"- Candidate top-1: {m['candidate_recall_at_1']:.4f}")
          print(f"- Candidate MRR: {m['candidate_mrr']:.4f}")
          print(f"- Ettin top-1 end-to-end: {m['scorer_top1_end_to_end']:.4f}")
          print(f"- Ettin MRR end-to-end: {m['scorer_mrr_end_to_end']:.4f}")
          print(f"- Ettin top-1 conditional: {m['scorer_top1_conditional']:.4f}")
          print(f"- Ettin MRR conditional: {m['scorer_mrr_conditional']:.4f}")
          print(f"- Scored pairs: {c['scored_candidate_pairs']}")
          print(f"- Wall time: {report['resources']['wall_seconds']:.2f}s")
          if report['resources']['peak_process_tree_rss_bytes'] is not None:
              print(f"- Peak RSS: {report['resources']['peak_process_tree_rss_bytes'] / 1024**2:.2f} MiB")
          print(f"- Scorer config: `{report['scorerConfig']}`")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: saga-v3-ettin-compact-${{ github.sha }}
          path: evaluation-artifacts/*.json
          if-no-files-found: error
          retention-days: 90
