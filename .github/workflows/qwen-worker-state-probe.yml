name: Qwen Worker State Probe

on:
  push:
    branches:
      - studio/qwen-image-edit-2511
    paths:
      - ".github/workflows/qwen-worker-state-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - role: primary
            gateway: https://voidtrek--saga-qwen-image-edit-2511-gateway-web.modal.run
          - role: standby
            gateway: https://nyxprotocol--saga-qwen-image-edit-2511-gateway-web.modal.run
    steps:
      - name: Read Qwen gateway and worker metadata
        shell: bash
        env:
          ROLE: ${{ matrix.role }}
          GATEWAY: ${{ matrix.gateway }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          with urllib.request.urlopen(os.environ['GATEWAY'].rstrip('/') + '/health', timeout=60) as response:
              payload = json.load(response)
          print(json.dumps({
              'role': os.environ['ROLE'],
              'model': payload.get('model'),
              'precision': payload.get('precision'),
              'checkpoint': payload.get('checkpoint'),
              'acceleration': payload.get('acceleration'),
              'worker': payload.get('worker'),
          }, indent=2, sort_keys=True))
          PY
