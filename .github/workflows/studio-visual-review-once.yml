name: Studio Visual Review Once

on:
  push:
    branches:
      - studio/mobile-gallery-create-followup

permissions:
  contents: read

jobs:
  review:
    if: ${{ !contains(github.event.head_commit.message, '[visual-review-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/mobile-gallery-create-followup
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Studio dependencies
        working-directory: apps/studio
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium
      - name: Build Studio
        working-directory: apps/studio
        run: npm run build
      - name: Start preview
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1
      - name: Capture browser review surfaces
        working-directory: apps/studio
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-mobile-followup-visual-review
          path: |
            apps/studio/visual-preview/*.png
            apps/studio/visual-preview/*.json
          if-no-files-found: error
          retention-days: 7
