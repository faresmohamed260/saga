name: Recover REDGraft LTX Worker Pair

on:
  push:
    branches: [ops/redgraft-recovery-20260907]
    paths:
      - ".github/workflows/modal-worker-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: redgraft-ltx-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
      MODAL_LTX25_GPU: A10
      MODAL_LTX25_MAX_CONTAINERS: "2"
      MODAL_LTX25_LOWVRAM: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/redgraft-recovery-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Select healthy zero-task primary and standby workspaces
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from scripts.modal_worker_fleet import inventory_account, json_command, load_accounts

          reserved = {'modal-44', 'modal-45', 'modal-46', 'modal-47'}
          required_ltx_apps = {'saga-ltx25-video', 'saga-ltx25-gateway'}

          def task_count(value):
              if value is None:
                  return 0
              if isinstance(value, bool):
                  return int(value)
              if isinstance(value, (int, float)):
                  return max(0, int(value))
              if isinstance(value, (list, tuple, set, dict)):
                  return len(value)
              match = re.search(r'\d+', str(value))
              return int(match.group(0)) if match else 0

          idle = []
          cached_ltx = []
          by_label = {}
          for account in load_accounts():
              by_label[account.label] = account
              if account.label in reserved:
                  continue
              apps, _ = json_command(account, ['modal', 'app', 'list', '--json'], timeout=45)
              if apps is None or not isinstance(apps, list):
                  continue
              deployed_descriptions = set()
              active_tasks = 0
              for row in apps:
                  if not isinstance(row, dict):
                      continue
                  state = str(row.get('State') or '').strip().lower()
                  description = str(row.get('Description') or '').strip()
                  if state == 'deployed':
                      if description:
                          deployed_descriptions.add(description)
                      active_tasks += task_count(row.get('Tasks'))
              if active_tasks == 0:
                  idle.append(account.label)
                  if required_ltx_apps.issubset(deployed_descriptions):
                      cached_ltx.append(account.label)

          primary = None
          verification = []
          for label in cached_ltx:
              row = inventory_account(by_label[label])
              verification.append({'account': label, 'role': 'primary-candidate', 'state': row.get('state')})
              if row.get('state') == 'available':
                  primary = label
                  break
          if not primary:
              raise SystemExit('No healthy zero-task workspace with existing LTX state is available for primary recovery')

          standby = None
          for label in idle:
              if label == primary:
                  continue
              row = inventory_account(by_label[label])
              verification.append({'account': label, 'role': 'standby-candidate', 'state': row.get('state')})
              if row.get('state') == 'available':
                  standby = label
                  break
          if not standby:
              raise SystemExit('No second healthy zero-task workspace is available for LTX standby recovery')

          selected = {'primary': primary, 'standby': standby}
          print(json.dumps({'cachedLtxIdle': cached_ltx, 'idleCount': len(idle), 'verification': verification, 'selected': selected}, sort_keys=True))
          Path('redgraft-selected.json').write_text(json.dumps(selected), encoding='utf-8')
          PY
      - name: Apply LTX 2.5 credit-workspace compatibility
        shell: bash
        run: sed -i 's#HF_REPO = "Lightricks/LTX-2.5"#HF_REPO = "comfyicu/LTX-2.5"#' integrations/comfyui/ltx23_app.py
      - name: Recover cached primary without reset or prefetch
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          selected = json.loads(Path('redgraft-selected.json').read_text(encoding='utf-8'))
          result = subprocess.run(
              ['python', 'scripts/modal_worker_maintenance.py', selected['primary'], 'ltx25-redgraft', 'ltx-primary-01'],
              text=True,
              capture_output=True,
              check=True,
          )
          payload = json.loads(result.stdout.strip().splitlines()[-1])
          Path('redgraft-primary.json').write_text(json.dumps(payload), encoding='utf-8')
          print(json.dumps({'account': selected['primary'], 'workerId': 'ltx-primary-01', 'gatewayUrl': payload['gatewayUrl'], 'cache': payload.get('cache'), 'prefetch': payload.get('prefetch')}))
          PY
      - name: Initialize independent standby cache and deploy
        shell: bash
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          selected = json.loads(Path('redgraft-selected.json').read_text(encoding='utf-8'))
          result = subprocess.run(
              ['python', 'scripts/modal_worker_fleet.py', 'deploy', selected['standby'], 'ltx25-redgraft', 'ltx-standby-01'],
              text=True,
              capture_output=True,
              check=True,
          )
          payload = json.loads(result.stdout.strip().splitlines()[-1])
          Path('redgraft-standby.json').write_text(json.dumps(payload), encoding='utf-8')
          print(json.dumps({'account': selected['standby'], 'workerId': 'ltx-standby-01', 'gatewayUrl': payload['gatewayUrl'], 'prefetch': 'completed'}))
          PY
      - name: Verify both REDGraft gateways and identities
        shell: bash
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from pathlib import Path

          rows = [
              json.loads(Path('redgraft-primary.json').read_text(encoding='utf-8')),
              json.loads(Path('redgraft-standby.json').read_text(encoding='utf-8')),
          ]
          verified = []
          for row in rows:
              url = row['gatewayUrl'].rstrip('/') + '/health'
              last_error = None
              for attempt in range(12):
                  try:
                      with urllib.request.urlopen(url, timeout=90) as response:
                          payload = json.loads(response.read().decode('utf-8'))
                      live = payload.get('worker') or {}
                      if payload.get('ready') is True and live.get('worker_id') == row['workerId'] and live.get('ecosystem') == 'ltx25-redgraft':
                          verified.append({'account': row['account'], 'workerId': row['workerId'], 'gatewayUrl': row['gatewayUrl'], 'ready': True, 'state': live.get('state')})
                          break
                      last_error = f'not ready or wrong identity: {payload}'
                  except Exception as exc:
                      last_error = f'{type(exc).__name__}: {exc}'
                  if attempt < 11:
                      time.sleep(10)
              else:
                  raise SystemExit(f"Gateway verification failed for {row['workerId']} on {row['account']}: {last_error}")
          print(json.dumps({'verifiedWorkers': verified}, sort_keys=True))
          PY
