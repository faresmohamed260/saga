name: Modal Worker Inventory

on:
  pull_request:
    paths:
      - ".github/workflows/modal-worker-inventory.yml"
      - "scripts/modal_worker_fleet.py"
      - "config/modal-worker-ecosystems.json"
  push:
    branches: [studio/video-gallery-ux, studio/qwen-image-edit-2511]
    paths:
      - ".github/workflows/modal-worker-inventory.yml"
      - "scripts/modal_worker_fleet.py"
      - "config/modal-worker-ecosystems.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modal-worker-inventory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      EXPECTED_MODAL_ACCOUNTS: "47"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Inventory every configured Modal account
        run: python scripts/modal_worker_fleet.py inventory --out modal-worker-inventory.json
      - name: Validate roster coverage and publish summary
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('modal-worker-inventory.json').read_text(encoding='utf-8'))
          rows = payload.get('accounts') or []
          expected = int(os.environ.get('EXPECTED_MODAL_ACCOUNTS') or 0)
          if len(rows) != expected:
              raise SystemExit(f'Expected {expected} Modal accounts, inventoried {len(rows)}')
          counts = {}
          for row in rows:
              state = str(row.get('state') or 'unknown')
              counts[state] = counts.get(state, 0) + 1
          lines = [
              '## Modal worker account inventory',
              '',
              f'- Accounts inventoried: **{len(rows)}**',
              f"- Available: **{counts.get('available', 0)}**",
              f"- Credit exhausted: **{counts.get('credit_exhausted', 0)}**",
              f"- Disabled: **{counts.get('disabled', 0)}**",
              f"- Other/error: **{len(rows) - counts.get('available', 0) - counts.get('credit_exhausted', 0) - counts.get('disabled', 0)}**",
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(json.dumps({'count': len(rows), 'states': counts}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: modal-worker-inventory
          path: modal-worker-inventory.json
          if-no-files-found: error
          retention-days: 7
