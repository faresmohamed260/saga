name: Audit REDGraft Standby Workspace

on:
  push:
    branches: [ops/redgraft-recovery-20260907]
    paths:
      - ".github/workflows/modal-worker-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/redgraft-recovery-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Audit modal-47 only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from scripts.modal_worker_fleet import inventory_account, load_accounts
          accounts = {account.label: account for account in load_accounts()}
          account = accounts.get('modal-47')
          if account is None:
              raise SystemExit('modal-47 is missing from the configured roster')
          row = inventory_account(account)
          print(json.dumps(row, sort_keys=True))
          if row.get('state') != 'available':
              raise SystemExit(f"modal-47 is not available: {row.get('state')}")
          PY
