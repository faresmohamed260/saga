name: Inventory Spare Modal Capacity

on:
  push:
    branches: [ops/redgraft-recovery-20260907]
    paths:
      - ".github/workflows/modal-worker-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/redgraft-recovery-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Inventory configured Modal roster
        shell: bash
        run: python scripts/modal_worker_fleet.py inventory --workers 8 --out modal-worker-inventory.json
      - name: Report unused healthy recovery candidates
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('modal-worker-inventory.json').read_text(encoding='utf-8'))
          reserved = {'modal-4', 'modal-5', 'modal-46', 'modal-47'}
          candidates = [
              row for row in payload.get('accounts', [])
              if row.get('state') == 'available'
              and row.get('account') not in reserved
              and row.get('apps') == 0
              and row.get('volumes') == 0
              and row.get('dicts') == 0
          ]
          print(json.dumps({
              'states': {
                  state: sum(1 for row in payload.get('accounts', []) if row.get('state') == state)
                  for state in sorted({str(row.get('state')) for row in payload.get('accounts', [])})
              },
              'unusedHealthyCandidates': [row.get('account') for row in candidates],
          }, sort_keys=True))
          if not candidates:
              raise SystemExit('No unused healthy Modal account is available for REDGraft recovery')
          PY
