name: Select REDGraft Recovery Workspace

on:
  push:
    branches: [ops/redgraft-recovery-20260907]
    paths:
      - ".github/workflows/modal-worker-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/redgraft-recovery-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Select and verify app-free recovery workspace
        shell: bash
        run: |
          python - <<'PY'
          import json
          from scripts.modal_worker_fleet import inventory_account, json_command, load_accounts

          reserved = {'modal-4', 'modal-5', 'modal-46', 'modal-47'}
          candidates = []
          for account in load_accounts():
              if account.label in reserved:
                  continue
              apps, detail = json_command(account, ['modal', 'app', 'list', '--json'], timeout=45)
              if apps is None:
                  continue
              if isinstance(apps, list) and len(apps) == 0:
                  candidates.append(account)

          if not candidates:
              raise SystemExit('No app-free configured Modal workspace is accessible')

          verified = None
          attempts = []
          for account in candidates:
              row = inventory_account(account)
              attempts.append({'account': account.label, 'state': row.get('state')})
              if row.get('state') == 'available':
                  verified = row
                  break

          print(json.dumps({
              'appFreeCandidates': [account.label for account in candidates],
              'verificationAttempts': attempts,
              'selected': verified,
          }, sort_keys=True))
          if not verified:
              raise SystemExit('No app-free candidate passed the compute availability probe')
          PY
