name: Select REDGraft Recovery Workspace

on:
  push:
    branches: [ops/redgraft-recovery-20260907]
    paths:
      - ".github/workflows/modal-worker-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/redgraft-recovery-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Select and verify idle recovery workspace
        shell: bash
        run: |
          python - <<'PY'
          import json
          from scripts.modal_worker_fleet import inventory_account, json_command, load_accounts

          reserved = {'modal-04', 'modal-05', 'modal-46', 'modal-47'}
          disposable = {'saga-worker-account-probe'}
          candidates = []
          for account in load_accounts():
              if account.label in reserved:
                  continue
              apps, detail = json_command(account, ['modal', 'app', 'list', '--json'], timeout=45)
              if apps is None or not isinstance(apps, list):
                  continue
              deployed = []
              for row in apps:
                  if not isinstance(row, dict):
                      continue
                  description = str(row.get('Description') or '').strip()
                  state = str(row.get('State') or '').strip().lower()
                  if state == 'deployed' and description not in disposable:
                      deployed.append(description or '<unnamed>')
              if not deployed:
                  candidates.append(account)

          if not candidates:
              raise SystemExit('No configured Modal workspace is idle enough for REDGraft recovery')

          verified = None
          attempts = []
          for account in candidates:
              row = inventory_account(account)
              attempts.append({'account': account.label, 'state': row.get('state')})
              if row.get('state') == 'available':
                  verified = row
                  break

          print(json.dumps({
              'idleCandidates': [account.label for account in candidates],
              'verificationAttempts': attempts,
              'selected': verified,
          }, sort_keys=True))
          if not verified:
              raise SystemExit('No idle candidate passed the compute availability probe')
          PY
