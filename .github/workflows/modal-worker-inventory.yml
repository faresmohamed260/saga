name: Inspect REDGraft Recovery Candidate

on:
  push:
    branches: [ops/redgraft-recovery-20260907]
    paths:
      - ".github/workflows/modal-worker-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/redgraft-recovery-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Inspect modal-01 app metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from scripts.modal_worker_fleet import json_command, load_accounts
          accounts = {account.label: account for account in load_accounts()}
          account = accounts.get('modal-01')
          if account is None:
              raise SystemExit('modal-01 is missing from configured roster')
          apps, detail = json_command(account, ['modal', 'app', 'list', '--json'], timeout=45)
          if apps is None:
              raise SystemExit('modal-01 app list failed')
          rows = []
          keyset = set()
          for row in apps if isinstance(apps, list) else []:
              if not isinstance(row, dict):
                  continue
              keyset.update(str(key) for key in row.keys())
              summary = {}
              for key, value in row.items():
                  lower = str(key).lower()
                  if any(term in lower for term in ('name', 'description', 'state', 'status', 'created', 'stopped')):
                      if value is None or isinstance(value, (str, int, float, bool)):
                          summary[str(key)] = value
              rows.append(summary)
          print(json.dumps({'account': 'modal-01', 'appCount': len(apps) if isinstance(apps, list) else None, 'keys': sorted(keyset), 'apps': rows}, sort_keys=True))
          PY
