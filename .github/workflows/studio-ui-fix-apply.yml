name: Studio UI fix applicator

on:
  push:
    branches:
      - studio/ui-fixes-advanced-sidebar-jobs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/ui-fixes-advanced-sidebar-jobs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply requested Studio UI changes
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[ui-fix-applied\]'; then
            echo "Patch already applied."
            exit 0
          fi
          python .github/scripts/apply_studio_ui_fixes.py
      - name: Commit patched UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio
          git commit -m "fix(studio): tighten jobs and unify create controls [ui-fix-applied]"
          git push origin HEAD:studio/ui-fixes-advanced-sidebar-jobs
