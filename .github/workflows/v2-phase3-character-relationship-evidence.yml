name: Phase 3 character relationship coverage diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - v2/phase-3a-character-relationship-state-evidence
    paths:
      - ".github/workflows/v2-phase3-character-relationship-evidence.yml"
      - "services/analysis-worker/package.json"
      - "services/analysis-worker/src/evaluation/character-relationship-evidence.ts"
      - "services/analysis-worker/src/evaluation/character-relationship-litbank-cli.ts"
      - "services/analysis-worker/tests/character-relationship-evidence.test.ts"

permissions:
  contents: read
  actions: read

concurrency:
  group: saga-phase3-character-relationship-evidence
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/analysis-worker

    steps:
      - name: Checkout exact S.A.G.A. source
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank corpus
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Reuse preserved pinned BookNLP syntax outputs
        uses: actions/download-artifact@v4
        with:
          name: saga-phase3-booknlp-native-output-f77af8bcab488fd1069e9c6e8ed4970842c78692
          path: services/analysis-worker/evaluation-artifacts/booknlp-output
          github-token: ${{ github.token }}
          repository: faresmohamed260/saga
          run-id: 34727310506

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/analysis-worker/package.json

      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck relationship evaluator
        run: npm run typecheck

      - name: Run deterministic and model-light tests
        run: npm test

      - name: Measure source-grounded character relationship coverage
        run: >-
          npm run benchmark:character-relationships --
          --litbank-root ../../external/litbank
          --booknlp-root evaluation-artifacts/booknlp-output
          --out evaluation-artifacts/character-relationship-litbank.json

      - name: Verify complete diagnostic and accounting
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/character-relationship-litbank.json", "utf8"));
          const d = report.dataset;
          const a = report.audit;
          if (d.attemptedDocumentCount !== 100 || d.completedDocumentCount !== 100 || d.failedDocumentCount !== 0) {
            throw new Error(`incomplete diagnostic: ${d.attemptedDocumentCount}/${d.completedDocumentCount}/${d.failedDocumentCount}`);
          }
          if (a.candidatePredicateTokenCount <= 0) throw new Error("no relationship predicate candidates found");
          if (a.candidatePredicateTokenCount !== a.supportedBinarySyntaxCandidateCount + a.unsupportedOrMixedSyntaxCandidateCount) {
            throw new Error("candidate accounting mismatch");
          }
          if (a.relationshipObservationCount > a.supportedBinarySyntaxCandidateCount) {
            throw new Error("relationship observations exceed supported binary syntax candidates");
          }
          if (a.uniqueDirectedPairPredicateCount > a.relationshipObservationCount) {
            throw new Error("relationship ledger exceeds observations");
          }
          if (a.qualifiedObservationCount + a.unqualifiedObservationCount !== a.relationshipObservationCount) {
            throw new Error("qualifier accounting mismatch");
          }
          if (report.scope.newModelInference !== false) throw new Error("diagnostic unexpectedly reran model inference");
          if (report.scope.correctnessScored !== false || report.scope.relationshipAccuracyClaimed !== false) {
            throw new Error("diagnostic incorrectly claims relationship correctness");
          }
          if (report.scope.productionAdoptionClaimed !== false) throw new Error("diagnostic incorrectly claims production adoption");
          if (report.scope.rawSourceTextEmitted !== false) throw new Error("diagnostic claims raw source emission");
          if (report.policy.persistenceClaimed !== false || report.policy.storyTimeInferred !== false) {
            throw new Error("diagnostic incorrectly claims relationship state or story time");
          }
          EOF

      - name: Publish relationship coverage summary
        shell: bash
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/character-relationship-litbank.json", "utf8"));
          const a = report.audit;
          const pct = (value) => (value * 100).toFixed(2);
          console.log("## Phase 3 character relationship coverage diagnostic");
          console.log("");
          console.log(`- LitBank attempted/completed/failed: ${report.dataset.attemptedDocumentCount}/${report.dataset.completedDocumentCount}/${report.dataset.failedDocumentCount}`);
          console.log(`- Reused BookNLP inference from run: ${report.sourceEvidence.sourceRunId}`);
          console.log(`- pinned predicate-token hits: ${a.candidatePredicateTokenCount}`);
          console.log(`- supported direct binary syntax candidates: ${a.supportedBinarySyntaxCandidateCount} (${pct(a.supportedBinarySyntaxRate)}%)`);
          console.log(`- two-character grounded observations: ${a.relationshipObservationCount} (${pct(a.twoCharacterGroundingYield)}% of supported binary syntax candidates)`);
          console.log(`- unique directed character pairs: ${a.uniqueDirectedPairCount}`);
          console.log(`- unique directed pair + predicate groups: ${a.uniqueDirectedPairPredicateCount}`);
          console.log(`- repeated-support pair + predicate groups: ${a.repeatedPairPredicateGroupCount} (${pct(a.repeatedPairPredicateGroupRate)}%)`);
          console.log(`- qualified observations: ${a.qualifiedObservationCount} (${pct(a.qualifiedObservationRate)}%)`);
          console.log(`- negated/modalized/conditional observations: ${a.negatedObservationCount}/${a.modalizedObservationCount}/${a.conditionalObservationCount}`);
          console.log("");
          console.log("### Candidate predicate counts");
          for (const [predicate, count] of Object.entries(a.candidatePredicateCounts).sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0]))) {
            console.log(`- ${predicate}: ${count}`);
          }
          console.log("");
          console.log("### Observed predicate counts");
          for (const [predicate, count] of Object.entries(a.observationPredicateCounts).sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0]))) {
            console.log(`- ${predicate}: ${count}`);
          }
          console.log("");
          console.log("### Source-order support histogram");
          for (const [support, groups] of Object.entries(a.supportCountHistogram).sort((left, right) => Number(left[0]) - Number(right[0]))) {
            console.log(`- ${support} observation(s): ${groups} pair+predicate group(s)`);
          }
          console.log("");
          console.log(`- report fingerprint: \`${report.reportFingerprint}\``);
          console.log("");
          console.log("> Coverage diagnostic only. LitBank does not provide S.A.G.A.-style interpersonal relationship/state gold; no relationship accuracy, persistence, reciprocity, or narrative-time claim is made.");
          EOF

      - name: Upload aggregate relationship diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: saga-phase3-character-relationship-evidence-${{ github.sha }}
          path: services/analysis-worker/evaluation-artifacts/character-relationship-litbank.json
          if-no-files-found: error
          retention-days: 90
