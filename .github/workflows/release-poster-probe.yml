name: Studio LTX Live Deploy and Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - .github/ltx-performance-fix

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
      MODAL_LTX25_GPU: "A10"
      MODAL_LTX25_MAX_CONTAINERS: "2"
      MODAL_LTX25_LOWVRAM: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deploy and media tooling
        run: |
          python -m pip install --upgrade "modal==1.4.2"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
      - name: Apply production fixes
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ltx_acceptance_patch.py
          python -m py_compile integrations/comfyui/ltx23_app.py integrations/comfyui/ltx23_gateway.py
          git diff --check
      - name: Deploy patched LTX primary and standby
        shell: bash
        run: |
          set -euo pipefail
          python scripts/modal_worker_maintenance.py modal-46 ltx25-redgraft ltx-primary-01 | tee /tmp/primary-deploy.json
          python scripts/modal_worker_maintenance.py modal-47 ltx25-redgraft ltx-standby-01 | tee /tmp/standby-deploy.json
      - name: Verify exact deployed build
        shell: bash
        run: |
          set -euo pipefail
          base=$(jq -r '.gatewayUrl' /tmp/primary-deploy.json)
          expected="$LTX_ACCEPTANCE_BUILD"
          gateway_ready=0
          for attempt in $(seq 1 60); do
            code=$(curl --max-time 20 -sS -o /tmp/gateway-health.json -w '%{http_code}' "$base/health" || true)
            build=$(jq -r '.build // empty' /tmp/gateway-health.json 2>/dev/null || true)
            echo "gateway_build_attempt=$attempt http=$code build=${build:-missing} expected=$expected"
            if [ "$code" = "200" ] && [ "$build" = "$expected" ]; then
              gateway_ready=1
              break
            fi
            sleep 2
          done
          test "$gateway_ready" = "1"
          cp /tmp/gateway-health.json /tmp/health-before.json

          runtime_ready=0
          for attempt in $(seq 1 20); do
            code=$(curl --max-time 240 -sS -o /tmp/runtime-health.json -w '%{http_code}' "$base/runtime-health" || true)
            build=$(jq -r '.runtime_build // empty' /tmp/runtime-health.json 2>/dev/null || true)
            gpu=$(jq -r '.gpu_name // .gpu // empty' /tmp/runtime-health.json 2>/dev/null || true)
            echo "runtime_build_attempt=$attempt http=$code build=${build:-missing} gpu=${gpu:-missing} expected=$expected"
            if [ "$code" = "200" ] && [ "$build" = "$expected" ] && [ -n "$gpu" ]; then
              runtime_ready=1
              break
            fi
            cat /tmp/runtime-health.json || true
            sleep 3
          done
          test "$runtime_ready" = "1"
          cat /tmp/health-before.json
          cat /tmp/runtime-health.json
      - name: Generate and validate production 1080p video
        shell: bash
        run: |
          set -euo pipefail
          base=$(jq -r '.gatewayUrl' /tmp/primary-deploy.json)
          expected="$LTX_ACCEPTANCE_BUILD"
          started=$(date +%s)
          submit=$(curl -fsS -X POST "$base/jobs/video" \
            -F 'prompt=Production latency acceptance: calm ocean horizon at sunrise, subtle natural motion, locked camera' \
            -F 'negative_prompt=' \
            -F 'seed=260825' \
            -F 'resolution=1080p' \
            -F 'duration_seconds=5' \
            -F 'audio_enabled=false' \
            -F 'aspect_ratio=16:9' \
            -F 'frame_rate=25')
          echo "submit=$submit"
          call_id=$(printf '%s' "$submit" | jq -r '.call_id // empty')
          test -n "$call_id"

          completed=0
          for attempt in $(seq 1 240); do
            code=$(curl -sS -o /tmp/video-or-status -w '%{http_code}' "$base/jobs/$call_id")
            elapsed=$(( $(date +%s) - started ))
            echo "poll=$attempt http=$code elapsed_seconds=$elapsed"
            if [ "$code" = "200" ]; then
              mv /tmp/video-or-status /tmp/ltx-benchmark.mp4
              completed=1
              break
            fi
            if [ "$code" != "202" ]; then
              cat /tmp/video-or-status || true
              exit 1
            fi
            sleep 3
          done
          test "$completed" = "1"
          generation_seconds=$(( $(date +%s) - started ))

          poster_started=$(date +%s)
          code=$(curl -sS -o /tmp/ltx-benchmark.jpg -w '%{http_code}' "$base/jobs/$call_id/poster")
          echo "poster_http=$code"
          if [ "$code" != "200" ]; then cat /tmp/ltx-benchmark.jpg || true; exit 1; fi
          poster_seconds=$(( $(date +%s) - poster_started ))

          ffprobe -v error -show_entries 'format=duration,format_name:stream=codec_type,codec_name,width,height,avg_frame_rate' -of json /tmp/ltx-benchmark.mp4 > /tmp/ffprobe.json
          curl -fsS "$base/health" > /tmp/health-after.json
          cat /tmp/ffprobe.json
          cat /tmp/health-after.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = json.loads(Path('/tmp/ffprobe.json').read_text())
          gateway = json.loads(Path('/tmp/health-after.json').read_text())
          runtime = json.loads(Path('/tmp/runtime-health.json').read_text())
          video = next(s for s in p['streams'] if s.get('codec_type') == 'video')
          audio = [s for s in p['streams'] if s.get('codec_type') == 'audio']
          duration = float(p['format']['duration'])
          poster = Path('/tmp/ltx-benchmark.jpg').read_bytes()
          expected = os.environ['LTX_ACCEPTANCE_BUILD']
          assert gateway.get('build') == expected, gateway
          assert runtime.get('runtime_build') == expected, runtime
          assert runtime.get('gpu_name') == 'NVIDIA A10', runtime
          assert (video['width'], video['height']) == (1920, 1080), video
          assert video['avg_frame_rate'] == '25/1', video
          assert abs(duration - 5.0) <= 0.05, duration
          assert not audio, audio
          assert poster[:2] == b'\xff\xd8' and len(poster) > 1000, len(poster)
          print(json.dumps({'validated': True, 'gateway_build': gateway.get('build'), 'runtime_build': runtime.get('runtime_build'), 'gpu_name': runtime.get('gpu_name'), 'poster_bytes': len(poster)}))
          PY

          total=$(( $(date +%s) - started ))
          jq -n \
            --arg call_id "$call_id" \
            --arg build "$expected" \
            --arg gpu_name "$(jq -r '.gpu_name // .gpu' /tmp/runtime-health.json)" \
            --argjson generation_seconds "$generation_seconds" \
            --argjson poster_seconds "$poster_seconds" \
            --argjson total_seconds "$total" \
            '{call_id:$call_id,build:$build,gpu_name:$gpu_name,generation_seconds:$generation_seconds,poster_seconds:$poster_seconds,total_seconds:$total_seconds,request:{resolution:"1080p",aspect_ratio:"16:9",frame_rate:25,duration_seconds:5,audio_enabled:false}}' \
            > /tmp/benchmark-summary.json
          cat /tmp/benchmark-summary.json
      - name: Commit validated production fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/comfyui/ltx23_app.py integrations/comfyui/ltx23_gateway.py
          if git diff --cached --quiet; then
            echo "Product files already current"
            exit 0
          fi
          git commit -m "fix(video): optimize A10 runtime and harden poster delivery"
          git push origin HEAD:studio/video-gallery-ux
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ltx-live-deploy-benchmark
          path: |
            /tmp/primary-deploy.json
            /tmp/standby-deploy.json
            /tmp/benchmark-summary.json
            /tmp/ffprobe.json
            /tmp/health-before.json
            /tmp/runtime-health.json
            /tmp/health-after.json
            /tmp/ltx-benchmark.mp4
            /tmp/ltx-benchmark.jpg
          if-no-files-found: warn
          retention-days: 1
