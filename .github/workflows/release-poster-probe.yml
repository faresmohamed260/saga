name: Studio LTX Performance Benchmark

on:
  pull_request:
    branches: [main]
    paths:
      - .github/ltx-performance-fix
      - integrations/comfyui/ltx23_app.py
      - scripts/modal_worker_maintenance.py

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install media probe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg jq
      - name: Allow runtime redeploy to settle
        run: sleep 90
      - name: Generate and validate 1080p video
        shell: bash
        run: |
          set -euo pipefail
          base='https://dreadcipher67--saga-ltx25-gateway-web.modal.run'
          started=$(date +%s)
          submit=$(curl -fsS -X POST "$base/jobs/video" \
            -F 'prompt=Production latency benchmark: calm ocean horizon, subtle natural motion, locked camera' \
            -F 'negative_prompt=' \
            -F 'seed=260825' \
            -F 'resolution=1080p' \
            -F 'duration_seconds=5' \
            -F 'audio_enabled=false' \
            -F 'aspect_ratio=16:9' \
            -F 'frame_rate=25')
          echo "submit=$submit"
          call_id=$(printf '%s' "$submit" | jq -r '.call_id // empty')
          test -n "$call_id"

          done=0
          for attempt in $(seq 1 240); do
            code=$(curl -sS -o /tmp/video-or-status -w '%{http_code}' "$base/jobs/$call_id")
            elapsed=$(( $(date +%s) - started ))
            echo "poll=$attempt http=$code elapsed_seconds=$elapsed"
            if [ "$code" = "200" ]; then
              mv /tmp/video-or-status /tmp/ltx-benchmark.mp4
              done=1
              break
            fi
            if [ "$code" != "202" ]; then
              cat /tmp/video-or-status || true
              exit 1
            fi
            cat /tmp/video-or-status || true
            sleep 5
          done
          test "$done" = "1"

          poster_done=0
          for attempt in $(seq 1 10); do
            code=$(curl -sS -o /tmp/ltx-benchmark.jpg -w '%{http_code}' "$base/jobs/$call_id/poster")
            echo "poster_attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then poster_done=1; break; fi
            sleep 2
          done
          test "$poster_done" = "1"

          ffprobe -v error -show_entries 'format=duration,format_name:stream=codec_type,codec_name,width,height,avg_frame_rate' -of json /tmp/ltx-benchmark.mp4 > /tmp/ffprobe.json
          cat /tmp/ffprobe.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/ffprobe.json').read_text())
          video = next(s for s in p['streams'] if s.get('codec_type') == 'video')
          audio = [s for s in p['streams'] if s.get('codec_type') == 'audio']
          duration = float(p['format']['duration'])
          assert (video['width'], video['height']) == (1920, 1080), video
          assert video['avg_frame_rate'] == '25/1', video
          assert abs(duration - 5.0) <= 0.05, duration
          assert not audio, audio
          print(json.dumps({'validated': True, 'width': video['width'], 'height': video['height'], 'fps': video['avg_frame_rate'], 'duration': duration, 'audio_streams': 0}))
          PY
          total=$(( $(date +%s) - started ))
          echo "BENCHMARK_TOTAL_SECONDS=$total"
