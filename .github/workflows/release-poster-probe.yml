name: Studio LTX Performance Patch

on:
  pull_request:
    branches: [main]
    paths:
      - .github/ltx-performance-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0
      - name: Patch LTX runtime and gateway
        shell: bash
        run: |
          set -euo pipefail
          python scripts/ltx_performance_patch.py
          python -m py_compile integrations/comfyui/ltx23_app.py integrations/comfyui/ltx23_gateway.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/comfyui/ltx23_app.py integrations/comfyui/ltx23_gateway.py
          git commit -m "perf(video): accelerate LTX and return poster with result"
          git push origin HEAD:studio/video-gallery-ux
