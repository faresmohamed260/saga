name: Studio Gallery Redesign Patch PR123

on:
  push:
    branches:
      - studio/automatic-refresh-video-recovery
    paths:
      - .github/workflows/studio-gallery-redesign-patch-pr123.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/automatic-refresh-video-recovery
      - name: Wire Gallery props
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/studio/src/app/App.jsx')
          text = path.read_text()
          old = 'gallerySearch, setGallerySearch, gallerySort, setGallerySort, galleryModels, galleryPage'
          new = 'gallerySearch, setGallerySearch, gallerySort, setGallerySort, galleryDate, setGalleryDate, galleryFavoritesOnly, setGalleryFavoritesOnly, galleryModels, galleryPage'
          if old not in text:
              raise SystemExit('Gallery controller destructure anchor not found')
          text = text.replace(old, new, 1)
          old = 'sort={gallerySort} page={galleryPage}'
          new = 'sort={gallerySort} date={galleryDate} favoritesOnly={galleryFavoritesOnly} collections={collections} page={galleryPage}'
          if old not in text:
              raise SystemExit('Gallery props anchor not found')
          text = text.replace(old, new, 1)
          old = 'onSearchChange={setGallerySearch} onSortChange={setGallerySort} onRefresh={() => loadGallery({ append: false })}'
          new = "onSearchChange={setGallerySearch} onSortChange={setGallerySort} onDateChange={setGalleryDate} onFavoritesOnlyChange={setGalleryFavoritesOnly} onOpenCollection={async (collection) => { await loadCollectionItems(collection); setSection('Collections'); }} onOpenCollections={() => setSection('Collections')} onRefresh={() => loadGallery({ append: false })}"
          if old not in text:
              raise SystemExit('Gallery handler anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit app wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/app/App.jsx
          git diff --cached --quiet && exit 0
          git commit -m "feat(studio): connect Gallery asset manager controls"
          git push origin HEAD:studio/automatic-refresh-video-recovery
