name: Studio Iteration 8 Finalize

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Finalize checklist and durable handoff
        run: python apps/studio/scripts/iteration8_finalize.py

      - name: Commit documentation and remove temporary iteration machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-ui-polish-checklist.md docs/studio-ui-polish-iteration-brief.md
          git rm -f \
            apps/studio/scripts/iteration8_shared_aspect_patch.py \
            apps/studio/scripts/iteration8_shared_aspect_refine.py \
            apps/studio/scripts/iteration8_finalize.py \
            .github/workflows/studio-iteration8-shared-aspect-refine.yml \
            .github/workflows/studio-iteration8-finalize.yml
          git commit -m "docs(studio): complete iteration 8 shared aspect picker"
          git push origin HEAD:${{ github.head_ref }}
