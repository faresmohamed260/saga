name: Studio browser contract aligner

on:
  push:
    branches:
      - studio/ui-fixes-advanced-sidebar-jobs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/ui-fixes-advanced-sidebar-jobs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align browser contracts
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[browser-contracts-aligned\]'; then
            echo "Already aligned."
            exit 0
          fi
          python .github/scripts/align_studio_browser_contracts.py
      - name: Commit alignment
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/scripts
          git commit -m "test(studio): align browser contracts with unified controls [browser-contracts-aligned]"
          git push origin HEAD:studio/ui-fixes-advanced-sidebar-jobs
