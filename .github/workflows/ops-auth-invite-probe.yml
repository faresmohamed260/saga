name: Probe Supabase invite verification

on:
  push:
    branches:
      - "ops/first-owner-bootstrap-2026-09-11"
    paths:
      - ".github/workflows/ops-auth-invite-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://scmeqnpmhomzcwecjdtu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_znDKjfEiIhk296hIL1ussA_a7lCpxIo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Verify invite OTP semantics with disposable Auth user
        working-directory: apps/web
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${SUPABASE_SECRET_KEY:-}" ]] || { echo "::error title=Missing Supabase secret::SUPABASE_SECRET_KEY is unavailable."; exit 1; }
          echo "::add-mask::${SUPABASE_SECRET_KEY}"
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js';

          const url = process.env.SUPABASE_URL;
          const publishable = process.env.SUPABASE_PUBLISHABLE_KEY;
          const secret = process.env.SUPABASE_SECRET_KEY;
          const email = `saga-auth-probe-${Date.now()}@example.com`;

          const admin = createClient(url, secret, {
            auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false },
          });
          const publicClient = createClient(url, publishable, {
            auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false },
          });

          let probeUserId;
          try {
            const generated = await admin.auth.admin.generateLink({ type: 'invite', email });
            if (generated.error) throw generated.error;
            probeUserId = generated.data.user?.id;
            const tokenHash = generated.data.properties?.hashed_token;
            if (!probeUserId || !tokenHash) throw new Error('probe_generate_link_missing_fields');

            const verified = await publicClient.auth.verifyOtp({ type: 'invite', token_hash: tokenHash });
            if (verified.error) {
              console.error(JSON.stringify({
                verify_error_name: verified.error.name,
                verify_error_status: verified.error.status,
                verify_error_code: verified.error.code ?? null,
                verify_error_message: verified.error.message,
              }));
              throw verified.error;
            }
            if (!verified.data.session || verified.data.user?.id !== probeUserId) {
              throw new Error('probe_verify_missing_session');
            }
            console.log('Disposable invite verifyOtp probe succeeded with a valid authenticated session.');
          } finally {
            if (probeUserId) {
              const deleted = await admin.auth.admin.deleteUser(probeUserId);
              if (deleted.error) {
                console.error('Disposable probe user cleanup failed:', deleted.error.message);
                process.exitCode = 1;
              } else {
                console.log('Disposable Auth probe user deleted.');
              }
            }
          }
          NODE
