name: Phase 3 typed entity event participant audit

on:
  workflow_dispatch:
  push:
    branches:
      - v2/phase-3a-event-typed-entity-participants
    paths:
      - ".github/workflows/v2-phase3-event-typed-entity-participant-audit.yml"
      - "services/analysis-worker/src/evaluation/event-typed-entity-participants.ts"
      - "services/analysis-worker/src/evaluation/event-typed-entity-participant-litbank-cli.ts"
      - "services/analysis-worker/tests/event-typed-entity-participants.test.ts"

permissions:
  contents: read
  actions: read

concurrency:
  group: saga-phase3-event-typed-entity-participant-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/analysis-worker

    steps:
      - name: Checkout exact S.A.G.A. source
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank corpus
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Reuse preserved pinned BookNLP native outputs
        uses: actions/download-artifact@v4
        with:
          name: saga-phase3-booknlp-native-output-f77af8bcab488fd1069e9c6e8ed4970842c78692
          path: services/analysis-worker/evaluation-artifacts/booknlp-output
          github-token: ${{ github.token }}
          repository: faresmohamed260/saga
          run-id: 34727310506

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/analysis-worker/package.json

      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck typed entity participant audit
        run: npm run typecheck

      - name: Run deterministic and model-light tests
        run: npm test

      - name: Score typed non-character participant evidence without rerunning BookNLP
        run: >-
          npx tsx src/evaluation/event-typed-entity-participant-litbank-cli.ts
          --litbank-root ../../external/litbank
          --booknlp-root evaluation-artifacts/booknlp-output
          --out evaluation-artifacts/event-typed-entity-participant-litbank.json

      - name: Verify complete diagnostic and unchanged trigger floor
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/event-typed-entity-participant-litbank.json", "utf8"));
          if (report.dataset.attemptedDocumentCount !== 100 || report.dataset.completedDocumentCount !== 100 || report.dataset.failedDocumentCount !== 0) {
            throw new Error(`incomplete diagnostic: ${report.dataset.attemptedDocumentCount}/${report.dataset.completedDocumentCount}/${report.dataset.failedDocumentCount}`);
          }
          const f1 = report.triggerEvaluation.triggerDetection.f1;
          if (f1.toFixed(4) !== "0.7791") throw new Error(`event trigger F1 regressed: ${f1}`);
          EOF

      - name: Publish typed entity participant summary
        shell: bash
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/event-typed-entity-participant-litbank.json", "utf8"));
          const a = report.audit;
          console.log("## Phase 3 typed non-character event participant audit");
          console.log("");
          console.log(`- LitBank attempted/completed/failed: ${report.dataset.attemptedDocumentCount}/${report.dataset.completedDocumentCount}/${report.dataset.failedDocumentCount}`);
          console.log(`- Reused BookNLP inference from run: ${report.sourceEvidence.sourceRunId}`);
          console.log(`- direct actor/patient candidate tokens: ${a.candidateTokenCount}`);
          console.log(`- candidate events: ${a.candidateEventCount}`);
          console.log(`- actor candidate tokens/events: ${a.actorCandidateTokenCount}/${a.actorCandidateEventCount}`);
          console.log(`- patient candidate tokens/events: ${a.patientCandidateTokenCount}/${a.patientCandidateEventCount}`);
          console.log(`- clean typed non-person evidence items: ${a.typedNonPersonEvidenceCount} (${(a.typedNonPersonCandidateRate * 100).toFixed(2)}% of candidate tokens)`);
          console.log(`- events gaining typed non-person evidence: ${a.eventWithTypedNonPersonCount} (${(a.eventGainRate * 100).toFixed(2)}% of candidate events)`);
          console.log("");
          console.log("### Candidate statuses");
          for (const [status, count] of Object.entries(a.byStatus)) {
            console.log(`- ${status}: ${count} (${(a.statusRates[status] * 100).toFixed(2)}%)`);
          }
          console.log("");
          console.log("### Typed non-person evidence by category");
          for (const [category, count] of Object.entries(a.typedByCategory).sort((left, right) => right[1] - left[1])) {
            console.log(`- ${category}: ${count}`);
          }
          console.log("");
          console.log("### Typed evidence by role/category");
          for (const [key, count] of Object.entries(a.typedByRoleAndCategory).sort((left, right) => right[1] - left[1])) {
            console.log(`- ${key}: ${count}`);
          }
          console.log("");
          console.log("### Typed evidence by dependency/category");
          for (const [key, count] of Object.entries(a.typedByDependencyAndCategory).sort((left, right) => right[1] - left[1])) {
            console.log(`- ${key}: ${count}`);
          }
          console.log("");
          console.log(`- trigger P/R/F1: ${report.triggerEvaluation.triggerDetection.precision.toFixed(4)} / ${report.triggerEvaluation.triggerDetection.recall.toFixed(4)} / ${report.triggerEvaluation.triggerDetection.f1.toFixed(4)}`);
          console.log(`- report fingerprint: \`${report.reportFingerprint}\``);
          console.log("");
          console.log("> Coverage/evidence diagnostic only. LitBank has no S.A.G.A.-style non-character participant gold, so these are not participant precision/recall/accuracy metrics.");
          EOF

      - name: Upload typed entity participant evidence
        uses: actions/upload-artifact@v4
        with:
          name: saga-phase3-event-typed-entity-participant-audit
          path: services/analysis-worker/evaluation-artifacts/event-typed-entity-participant-litbank.json
          if-no-files-found: error
          retention-days: 90
