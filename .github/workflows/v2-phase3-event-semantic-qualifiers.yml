name: Phase 3 event semantic qualifier diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - v2/phase-3a-event-semantic-qualifiers
    paths:
      - ".github/workflows/v2-phase3-event-semantic-qualifiers.yml"
      - "services/analysis-worker/package.json"
      - "services/analysis-worker/src/evaluation/event-semantic-qualifiers.ts"
      - "services/analysis-worker/src/evaluation/event-semantic-qualifier-litbank-cli.ts"
      - "services/analysis-worker/tests/event-semantic-qualifiers.test.ts"

permissions:
  contents: read
  actions: read

concurrency:
  group: saga-phase3-event-semantic-qualifiers
  cancel-in-progress: true

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/analysis-worker

    steps:
      - name: Checkout exact S.A.G.A. source
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank corpus
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Reuse preserved pinned BookNLP syntax and event outputs
        uses: actions/download-artifact@v4
        with:
          name: saga-phase3-booknlp-native-output-f77af8bcab488fd1069e9c6e8ed4970842c78692
          path: services/analysis-worker/evaluation-artifacts/booknlp-output
          github-token: ${{ github.token }}
          repository: faresmohamed260/saga
          run-id: 34727310506

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/analysis-worker/package.json

      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck qualifier evaluator
        run: npm run typecheck

      - name: Run deterministic and model-light tests
        run: npm test

      - name: Score source-grounded event semantic qualifier cues
        run: >-
          npm run benchmark:event-semantic-qualifiers --
          --litbank-root ../../external/litbank
          --booknlp-root evaluation-artifacts/booknlp-output
          --out evaluation-artifacts/event-semantic-qualifiers-litbank.json

      - name: Verify complete diagnostic and unchanged trigger floor
        shell: bash
        run: |
          node <<'EOF'
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/event-semantic-qualifiers-litbank.json", "utf8"));
          const d = report.dataset;
          if (d.attemptedDocumentCount !== 100 || d.completedDocumentCount !== 100 || d.failedDocumentCount !== 0) {
            throw new Error(`incomplete diagnostic: ${d.attemptedDocumentCount}/${d.completedDocumentCount}/${d.failedDocumentCount}`);
          }
          const f1 = report.triggerEvaluation.triggerDetection.f1;
          if (f1.toFixed(4) !== "0.7791") throw new Error(`event trigger F1 regressed: ${f1}`);
          if (report.audit.triggerCount !== 7445) throw new Error(`event trigger denominator drifted: ${report.audit.triggerCount}`);
          if (report.triggerRegressionCheck.triggerCountDelta !== 0) throw new Error(`trigger count delta: ${report.triggerRegressionCheck.triggerCountDelta}`);
          if (report.scope.newModelInference !== false) throw new Error("diagnostic unexpectedly reran model inference");
          if (report.scope.correctnessScored !== false) throw new Error("diagnostic incorrectly claims correctness scoring");
          EOF

      - name: Publish semantic qualifier summary
        shell: bash
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/event-semantic-qualifiers-litbank.json", "utf8"));
          const a = report.audit;
          console.log("## Phase 3 event semantic qualifier diagnostic");
          console.log("");
          console.log(`- LitBank attempted/completed/failed: ${report.dataset.attemptedDocumentCount}/${report.dataset.completedDocumentCount}/${report.dataset.failedDocumentCount}`);
          console.log(`- Reused BookNLP inference from run: ${report.sourceEvidence.sourceRunId}`);
          console.log(`- trigger count: ${a.triggerCount}`);
          console.log(`- event trigger P/R/F1: ${report.triggerEvaluation.triggerDetection.precision.toFixed(4)} / ${report.triggerEvaluation.triggerDetection.recall.toFixed(4)} / ${report.triggerEvaluation.triggerDetection.f1.toFixed(4)}`);
          console.log(`- events with any explicit qualifier cue: ${a.eventWithAnyCueCount} (${(a.eventWithAnyCueRate * 100).toFixed(2)}%)`);
          console.log(`- explicit negation: ${a.negatedEventCount} (${(a.negatedEventRate * 100).toFixed(2)}%)`);
          console.log(`- modalized: ${a.modalizedEventCount} (${(a.modalizedEventRate * 100).toFixed(2)}%)`);
          console.log(`- explicit conditional cue: ${a.conditionalCueEventCount} (${(a.conditionalCueEventRate * 100).toFixed(2)}%)`);
          console.log(`- irrealis-cued: ${a.irrealisCuedEventCount} (${(a.irrealisCuedEventRate * 100).toFixed(2)}%)`);
          console.log(`- unmarked/undetermined: ${a.unmarkedEventCount} (${(a.unmarkedEventRate * 100).toFixed(2)}%)`);
          console.log("");
          console.log("### Modal lemma counts");
          for (const [lemma, count] of Object.entries(a.modalLemmaCounts).sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0]))) {
            console.log(`- ${lemma}: ${count}`);
          }
          console.log("");
          console.log("### Conditional marker counts");
          for (const [lemma, count] of Object.entries(a.conditionalLemmaCounts).sort((left, right) => right[1] - left[1] || left[0].localeCompare(right[0]))) {
            console.log(`- ${lemma}: ${count}`);
          }
          console.log("");
          console.log(`- report fingerprint: \`${report.reportFingerprint}\``);
          console.log("");
          console.log("> Prevalence/coverage diagnostic only. LitBank does not provide S.A.G.A.-style polarity/modality/realis gold, so these counts are not correctness or factuality metrics.");
          EOF

      - name: Upload aggregate qualifier diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: saga-phase3-event-semantic-qualifiers-${{ github.sha }}
          path: services/analysis-worker/evaluation-artifacts/event-semantic-qualifiers-litbank.json
          if-no-files-found: error
          retention-days: 90
