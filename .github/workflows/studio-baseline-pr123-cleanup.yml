name: Studio Baseline PR123 Cleanup

on:
  push:
    branches:
      - studio/automatic-refresh-video-recovery
    paths:
      - .github/workflows/studio-baseline-pr123-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/automatic-refresh-video-recovery
          fetch-depth: 0

      - name: Restore unrelated baselines and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- \
            apps/studio/visual-baselines/01-create-image-centered.png \
            apps/studio/visual-baselines/05b-video-output-controls.png \
            apps/studio/visual-baselines/05f-video-picker-keyboard-focus.png \
            apps/studio/visual-baselines/05i-video-audio-on.png \
            apps/studio/visual-baselines/09-mobile-create.png
          git rm .github/workflows/studio-baseline-pr123-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/visual-baselines
          git commit -m "test(studio): keep only intentional library baselines"
          git push origin HEAD:studio/automatic-refresh-video-recovery
