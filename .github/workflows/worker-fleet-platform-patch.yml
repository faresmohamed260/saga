name: Worker Fleet Platform Patch

# Triggered after the workflow exists on the branch so the platform patch can run remotely.
on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/worker_fleet_platform_patch.py"
      - ".github/workflows/worker-fleet-platform-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-fleet-platform-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply worker fleet platform patch
        run: python scripts/worker_fleet_platform_patch.py
      - name: Commit patched platform
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-ui-polish-checklist.md config/modal-worker-ecosystems.json apps/studio/api/_worker-registry.js apps/studio/api/_worker-registry.generated.js apps/studio/api/_workflows.js apps/studio/api/_providers.js apps/studio/api/generate.js apps/studio/api/generate/result.js apps/studio/src/generation-client.js apps/studio/src/app/App.jsx apps/studio/src/features/create/CreateWorkspace.jsx apps/studio/src/features/create/VideoGenerationControls.jsx integrations/comfyui/flux2_klein_app.py integrations/comfyui/ltx23_app.py integrations/comfyui/flux2_klein_gateway.py integrations/comfyui/ltx23_gateway.py apps/studio/scripts/check-worker-registry-contract.mjs apps/studio/package.json scripts/modal_worker_fleet.py .github/workflows/modal-worker-inventory.yml
          if git diff --cached --quiet; then
            echo "No platform changes to commit"
            exit 0
          fi
          git commit -m "feat: add ecosystem-affine Modal worker fleet"
          git push origin HEAD:studio/video-gallery-ux
