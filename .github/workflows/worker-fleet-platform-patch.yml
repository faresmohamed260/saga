name: Worker Fleet Platform Patch

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/worker_fleet_platform_patch.py"
      - "scripts/worker_fleet_refine_patch.py"
      - ".github/workflows/worker-fleet-platform-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worker-fleet-platform-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply worker fleet patch
        shell: bash
        run: |
          if [ ! -f apps/studio/api/_worker-registry.js ]; then
            python scripts/worker_fleet_platform_patch.py
            rm -f .github/workflows/modal-worker-inventory.yml
          fi
          if [ -f scripts/worker_fleet_refine_patch.py ]; then
            python scripts/worker_fleet_refine_patch.py
          fi
      - name: Commit patched platform
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/comfyui/flux2_klein_gateway.py integrations/comfyui/ltx23_gateway.py integrations/comfyui/ltx23_app.py apps/studio/scripts/check-worker-registry-contract.mjs
          if git diff --cached --quiet; then
            echo "No worker fleet refinement changes to commit"
            exit 0
          fi
          git commit -m "fix: refine Modal worker lifecycle and failover"
          git push origin HEAD:studio/video-gallery-ux
