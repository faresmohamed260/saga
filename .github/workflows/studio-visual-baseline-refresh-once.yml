name: Studio Visual Baseline Refresh Once

on:
  push:
    branches:
      - studio/ui-fixes-advanced-sidebar-jobs

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !contains(github.event.head_commit.message, '[baseline-refreshed]') && !contains(github.event.head_commit.message, '[baseline-helper-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/ui-fixes-advanced-sidebar-jobs
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Studio dependencies
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Studio
        run: npm run build
      - name: Start remote runner preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1
      - name: Capture reviewed surfaces
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:capture
      - name: Refresh reviewed baselines
        env:
          UI_PREVIEW_DIR: visual-preview
          UI_BASELINE_DIR: visual-baselines
          UPDATE_VISUAL_BASELINES: "1"
        run: npm run visual:regression
      - name: Commit reviewed baselines
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/visual-baselines
          if git diff --cached --quiet; then
            echo "No baseline changes."
            exit 0
          fi
          git commit -m "test(studio): refresh reviewed UI baselines [baseline-refreshed]"
          git push origin HEAD:studio/ui-fixes-advanced-sidebar-jobs
