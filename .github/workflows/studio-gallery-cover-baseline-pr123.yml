name: Studio Gallery Cover Baseline PR123

on:
  push:
    branches:
      - studio/automatic-refresh-video-recovery
    paths:
      - .github/workflows/studio-gallery-cover-baseline-pr123.yml
      - apps/studio/**

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio

    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/automatic-refresh-video-recovery

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Studio dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Studio
        run: npm run build

      - name: Start runner preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1

      - name: Capture Gallery surfaces
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:preview

      - name: Refresh only Gallery baselines
        run: |
          set -euo pipefail
          cp visual-preview/10-gallery-grid.png visual-baselines/10-gallery-grid.png
          cp visual-preview/10b-gallery-keyboard-focus.png visual-baselines/10b-gallery-keyboard-focus.png
          cp visual-preview/14-gallery-mobile-manager.png visual-baselines/14-gallery-mobile-manager.png

      - name: Commit Gallery baseline update
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/studio/visual-baselines/10-gallery-grid.png \
            apps/studio/visual-baselines/10b-gallery-keyboard-focus.png \
            apps/studio/visual-baselines/14-gallery-mobile-manager.png
          if git diff --cached --quiet; then
            echo "No Gallery baseline changes."
            exit 0
          fi
          git commit -m "test(studio): approve gallery image cover baselines"
          git push origin HEAD:studio/automatic-refresh-video-recovery
