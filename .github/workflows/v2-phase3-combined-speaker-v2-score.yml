name: Phase 3 combined speaker v2 scorer

on:
  workflow_dispatch:
  push:
    branches:
      - v2/phase-3a-combined-speaker-v2
    paths:
      - ".github/workflows/v2-phase3-combined-speaker-v2-score.yml"
      - "services/analysis-worker/src/evaluation/combined-speaker.ts"
      - "services/analysis-worker/src/evaluation/combined-speaker-v2-litbank-cli.ts"
      - "services/analysis-worker/tests/combined-speaker*.test.ts"

permissions:
  contents: read
  actions: read

concurrency:
  group: saga-phase3-combined-speaker-v2-score
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/analysis-worker

    steps:
      - name: Checkout exact S.A.G.A. source
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank corpus
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Reuse preserved pinned BookNLP native outputs
        uses: actions/download-artifact@v4
        with:
          name: saga-phase3-booknlp-native-output-f77af8bcab488fd1069e9c6e8ed4970842c78692
          path: services/analysis-worker/evaluation-artifacts/booknlp-output
          github-token: ${{ github.token }}
          repository: faresmohamed260/saga
          run-id: 34727310506

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/analysis-worker/package.json

      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck combined speaker v2
        run: npm run typecheck

      - name: Run deterministic and model-light tests
        run: npm test

      - name: Score combined speaker v2 without rerunning BookNLP
        run: >-
          npx tsx src/evaluation/combined-speaker-v2-litbank-cli.ts
          --litbank-root ../../external/litbank
          --booknlp-root evaluation-artifacts/booknlp-output
          --out evaluation-artifacts/combined-speaker-v2-litbank.json

      - name: Publish v2 score summary
        shell: bash
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/combined-speaker-v2-litbank.json", "utf8"));
          const c = report.dialogue.combined;
          const b = report.dialogue.bookNlp;
          const d = report.dialogue.deterministicOracleIdentity;
          const db = report.dialogue.deltaVsBookNlp;
          const dd = report.dialogue.deltaVsDeterministic;
          const f = report.dialogue.fusionCounts;
          console.log("## Phase 3 combined speaker v2 scorer");
          console.log("");
          console.log(`- LitBank attempted/completed/failed: ${report.dataset.attemptedDocumentCount}/${report.dataset.completedDocumentCount}/${report.dataset.failedDocumentCount}`);
          console.log(`- Reused BookNLP inference from run: ${report.sourceEvidence.sourceRunId}`);
          console.log(`- Native artifact SHA-256: ${report.sourceEvidence.nativeArtifactSha256}`);
          console.log("");
          console.log("### Combined v2");
          console.log(`- quote P/R/F1: ${c.quoteDetection.precision.toFixed(4)} / ${c.quoteDetection.recall.toFixed(4)} / ${c.quoteDetection.f1.toFixed(4)}`);
          console.log(`- matched-known accuracy: ${c.speakerAccuracyOnMatchedQuotes.toFixed(4)}`);
          console.log(`- resolved-speaker accuracy: ${c.resolvedSpeakerAccuracy.toFixed(4)}`);
          console.log(`- end-to-end speaker recall: ${c.endToEndSpeakerRecall.toFixed(4)}`);
          console.log(`- contamination: ${c.crossCharacterContaminationRateOnMatchedQuotes.toFixed(4)}`);
          console.log(`- unresolved rate: ${c.speakerUnresolvedRateOnMatchedQuotes.toFixed(4)}`);
          console.log("");
          console.log("### Delta vs BookNLP");
          console.log(`- matched-known accuracy: ${db.matchedKnownSpeakerAccuracy >= 0 ? "+" : ""}${db.matchedKnownSpeakerAccuracy.toFixed(4)}`);
          console.log(`- end-to-end recall: ${db.endToEndSpeakerRecall >= 0 ? "+" : ""}${db.endToEndSpeakerRecall.toFixed(4)}`);
          console.log(`- contamination: ${db.crossCharacterContamination >= 0 ? "+" : ""}${db.crossCharacterContamination.toFixed(4)}`);
          console.log(`- unresolved: ${db.unresolvedRate >= 0 ? "+" : ""}${db.unresolvedRate.toFixed(4)}`);
          console.log("");
          console.log("### Delta vs deterministic floor");
          console.log(`- matched-known accuracy: ${dd.matchedKnownSpeakerAccuracy >= 0 ? "+" : ""}${dd.matchedKnownSpeakerAccuracy.toFixed(4)}`);
          console.log(`- end-to-end recall: ${dd.endToEndSpeakerRecall >= 0 ? "+" : ""}${dd.endToEndSpeakerRecall.toFixed(4)}`);
          console.log(`- contamination: ${dd.crossCharacterContamination >= 0 ? "+" : ""}${dd.crossCharacterContamination.toFixed(4)}`);
          console.log("");
          console.log(`- fusion agreement/provider fallback/deterministic only/provider-after conflict/unresolved conflict/other unresolved: ${f.agreement}/${f.providerFallback}/${f.deterministicOnly}/${f.conflictProviderAfter}/${f.conflictUnresolved}/${f.unresolved}`);
          console.log(`- report fingerprint: \`${report.reportFingerprint}\``);
          console.log(`- raw BookNLP accuracy/recall/contamination: ${b.speakerAccuracyOnMatchedQuotes.toFixed(4)} / ${b.endToEndSpeakerRecall.toFixed(4)} / ${b.crossCharacterContaminationRateOnMatchedQuotes.toFixed(4)}`);
          console.log(`- deterministic accuracy/recall/contamination: ${d.speakerAccuracyOnMatchedQuotes.toFixed(4)} / ${d.endToEndSpeakerRecall.toFixed(4)} / ${d.crossCharacterContaminationRateOnMatchedQuotes.toFixed(4)}`);
          EOF

      - name: Upload v2 score evidence
        uses: actions/upload-artifact@v4
        with:
          name: saga-phase3-combined-speaker-v2-score
          path: services/analysis-worker/evaluation-artifacts/combined-speaker-v2-litbank.json
          if-no-files-found: error
          retention-days: 90
