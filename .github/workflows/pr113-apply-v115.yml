name: Apply PR113 Create Evolution

# Temporary idempotent helper for the remote PR visual-iteration loop; final checklist validation is in progress.
on:
  pull_request:
    branches: [main]
    paths:
      - apps/studio/scripts/patch-main-create-v2.mjs
      - .github/workflows/pr113-apply-v115.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'studio/controls-cleanup-picker-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply final Create interaction patch
        working-directory: apps/studio
        run: node scripts/patch-main-create-v2.mjs
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/create-controls.jsx apps/studio/src/main.jsx apps/studio/src/create-workspace-v2.css apps/studio/scripts/capture-ui-preview.mjs
          git commit -m "Finish Create workspace layout and visual QA"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
