name: Studio Iteration 5 Poster Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/studio-iteration5-poster-patch.yml"
      - "apps/studio/scripts/iteration5_poster_patch.py"

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Apply iteration 5 product and test changes
        run: python apps/studio/scripts/iteration5_poster_patch.py

      - name: Fix generated contract source paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/studio/scripts/check-video-poster-contract.mjs')
          text = path.read_text()
          text = text.replace("readFile('../api/generate/result.js', 'utf8')", "readFile('api/generate/result.js', 'utf8')")
          text = text.replace("readFile('../api/_result-persistence.js', 'utf8')", "readFile('api/_result-persistence.js', 'utf8')")
          text = text.replace("readFile('../src/components/MediaCard.jsx', 'utf8')", "readFile('src/components/MediaCard.jsx', 'utf8')")
          path.write_text(text)
          PY

      - name: Validate patch formatting and Python syntax
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile integrations/comfyui/ltx23_app.py integrations/comfyui/ltx23_gateway.py

      - name: Install Studio dependencies
        working-directory: apps/studio
        run: npm install --no-audit --no-fund

      - name: Run deterministic poster contract
        working-directory: apps/studio
        run: npm run test:poster

      - name: Build Studio
        working-directory: apps/studio
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: Start remote runner preview
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          echo $! > /tmp/saga-studio-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1

      - name: Capture iteration 5 visual evidence
        working-directory: apps/studio
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:preview

      - name: Publish iteration 5 visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-iteration5-posters-${{ github.run_id }}
          path: |
            apps/studio/visual-preview/*.png
            apps/studio/visual-preview/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated iteration 5 product changes
        shell: bash
        run: |
          set -euo pipefail
          # Workflow files are updated separately through the GitHub connector because
          # the Actions token cannot push workflow modifications without workflow scope.
          git restore --source=HEAD -- .github/workflows/studio-ci.yml .github/workflows/test-ltx23-modal01.yml
          rm -rf apps/studio/visual-preview
          rm -f apps/studio/package-lock.json
          rm -f apps/studio/scripts/iteration5_poster_patch.py
          git add integrations/comfyui/ltx23_app.py \
                  integrations/comfyui/ltx23_gateway.py \
                  apps/studio/api/_providers.js \
                  apps/studio/api/_result-persistence.js \
                  apps/studio/api/generate/result.js \
                  apps/studio/src/components/MediaCard.jsx \
                  apps/studio/scripts/capture-gallery-preview.mjs \
                  apps/studio/scripts/check-video-poster-contract.mjs \
                  apps/studio/scripts/iteration5_poster_patch.py \
                  apps/studio/package.json
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Persist video poster thumbnails"
          git push origin HEAD:studio/video-gallery-ux
          echo "Committed product head: $(git rev-parse HEAD)"
