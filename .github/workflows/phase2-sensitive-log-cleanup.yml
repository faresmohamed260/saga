name: Phase 2 sensitive log cleanup

on:
  push:
    branches:
      - ops/phase2-hosted-proof
    paths:
      - .github/workflows/phase2-sensitive-log-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  delete-affected-run:
    runs-on: ubuntu-latest
    steps:
      - name: Delete remaining affected Actions run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "/repos/${REPO}/actions/runs/34695522009"
          echo "Deleted remaining affected workflow run."
