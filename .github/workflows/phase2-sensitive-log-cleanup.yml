name: Phase 2 sensitive log cleanup

on:
  push:
    branches:
      - ops/phase2-hosted-proof
    paths:
      - .github/workflows/phase2-sensitive-log-cleanup.yml

permissions:
  actions: write
  contents: read

jobs:
  delete-affected-runs:
    runs-on: ubuntu-latest
    steps:
      - name: Delete affected Actions runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for run_id in 34694736433 34695267378; do
            gh api --method DELETE "/repos/${REPO}/actions/runs/${run_id}"
          done
          echo "Deleted affected workflow runs containing split-out Modal API credentials."
