name: Qwen Modal Runtime Diagnostic

on:
  push:
    branches:
      - studio/qwen-image-edit-2511
    paths:
      - ".github/workflows/qwen-modal-runtime-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  primary-runtime-logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --quiet "modal==1.4.2"
      - name: Select modal-42 credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          raw = os.environ.get('SAGA_MODAL_TOKENS_JSON', '')
          payload = json.loads(raw)
          rows = payload.get('accounts') or payload.get('tokens') or payload.get('roster') or [] if isinstance(payload, dict) else payload
          for index, row in enumerate(rows or [], start=1):
              if not isinstance(row, dict):
                  continue
              label = str(row.get('label') or row.get('name') or row.get('account') or f'modal-{index:02d}').strip()
              if label != 'modal-42':
                  continue
              token_id = str(row.get('token_id') or '').strip()
              token_secret = str(row.get('token_secret') or '').strip()
              combined = str(row.get('api_key') or row.get('token') or '').strip()
              if (not token_id or not token_secret) and '.' in combined:
                  token_id, token_secret = combined.split('.', 1)
              if not token_id or not token_secret:
                  raise SystemExit('modal-42 credentials are incomplete')
              with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
                  handle.write(f'MODAL_TOKEN_ID={token_id}\n')
                  handle.write(f'MODAL_TOKEN_SECRET={token_secret}\n')
              break
          else:
              raise SystemExit('modal-42 credentials not found')
          PY
      - name: Fetch recent Qwen app logs
        run: >-
          modal app logs saga-qwen-image-edit-2511
          --since 20m
          --tail 1000
          --timestamps
          --show-function-id
          --show-container-id
