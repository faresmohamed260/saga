name: Inspect Modal ComfyUI Roster

on:
  push:
    branches:
      - studio-foundation
    paths:
      - "integrations/comfyui/inspection_app.py"
      - "integrations/comfyui/inspection_client.py"
      - "scripts/inspect_modal_roster.py"
      - ".github/workflows/inspect-modal-roster.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      SAGA_MODAL_INSPECTION_OUTPUT: modal-roster-inspection.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal client
        run: python -m pip install --upgrade "modal==1.4.2"

      - name: Inspect live Modal roster
        run: python scripts/inspect_modal_roster.py

      - name: Upload inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modal-roster-inspection
          path: modal-roster-inspection.json
          if-no-files-found: warn
          retention-days: 7
