name: Cleanup LTX 2.5 naming

on:
  push:
    branches:
      - studio/fix-video-workflow-id
    paths:
      - .github/workflows/cleanup-ltx25-naming.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy LTX 2.3 naming
        shell: bash
        run: |
          set -euo pipefail

          git mv integrations/comfyui/ltx23_app.py integrations/comfyui/ltx25_redgraft_app.py
          git mv integrations/comfyui/ltx23_gateway.py integrations/comfyui/ltx25_redgraft_gateway.py
          git mv .github/workflows/test-ltx23-modal01.yml .github/workflows/test-ltx25-redgraft-modal01.yml

          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/test-ltx25-redgraft-modal01.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'integrations/comfyui/ltx23_app.py': 'integrations/comfyui/ltx25_redgraft_app.py',
              'integrations/comfyui/ltx23_gateway.py': 'integrations/comfyui/ltx25_redgraft_gateway.py',
              '.github/workflows/test-ltx23-modal01.yml': '.github/workflows/test-ltx25-redgraft-modal01.yml',
              'studio/ltx23-video-backend': 'studio/ltx25-redgraft-video-backend',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/cleanup-ltx25-naming.yml

          if grep -R -n -i 'ltx23' apps/studio/src apps/studio/api integrations/comfyui .github/workflows --exclude-dir=node_modules; then
            echo 'Legacy ltx23 naming remains in active Studio/runtime files.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove legacy LTX 2.3 naming'
          git push
