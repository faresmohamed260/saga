name: Bootstrap Resend SMTP for hosted S.A.G.A. Auth

on:
  push:
    branches:
      - "ops/supabase-auth-config-2026-09-11"
    paths:
      - ".github/workflows/ops-resend-smtp-bootstrap.yml"

permissions:
  contents: read

jobs:
  bootstrap-resend-smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      RESEND_DOMAIN: mail.saga.faresuniform.uk
      RESEND_REGION: eu-west-1
      SUPABASE_PROJECT_REF: scmeqnpmhomzcwecjdtu
      SMTP_KEY_NAME: S.A.G.A. Supabase SMTP
      SMTP_SENDER_EMAIL: noreply@mail.saga.faresuniform.uk
      SMTP_SENDER_NAME: S.A.G.A.

    steps:
      - name: Verify management credentials are available
        env:
          RESEND_API_KEY: ${{ secrets.SAGA_RESEND_MANAGEMENT_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SAGA_SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RESEND_API_KEY:-}" ]] || { echo "::error title=Missing Resend token::SAGA_RESEND_MANAGEMENT_TOKEN is unavailable."; exit 1; }
          [[ -n "${SUPABASE_ACCESS_TOKEN:-}" ]] || { echo "::error title=Missing Supabase token::SAGA_SUPABASE_ACCESS_TOKEN is unavailable."; exit 1; }

      - name: Create or reuse dedicated Resend sending domain
        env:
          RESEND_API_KEY: ${{ secrets.SAGA_RESEND_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            "https://api.resend.com/domains?limit=100" > domains.json

          domain_id="$(jq -r --arg name "${RESEND_DOMAIN}" '.data[]? | select(.name == $name) | .id' domains.json | head -n1)"

          if [[ -z "${domain_id}" ]]; then
            jq -n --arg name "${RESEND_DOMAIN}" --arg region "${RESEND_REGION}" '{name:$name, region:$region}' > create-domain.json
            status="$(curl --silent --show-error \
              --request POST \
              --output create-domain-response.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${RESEND_API_KEY}" \
              --header 'Content-Type: application/json' \
              --data @create-domain.json \
              'https://api.resend.com/domains')"
            if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
              message="$(jq -r '.message // .error // "Resend domain creation failed"' create-domain-response.json 2>/dev/null || true)"
              echo "::error title=Unable to create Resend domain::HTTP ${status}: ${message}"
              exit 1
            fi
            domain_id="$(jq -r '.id' create-domain-response.json)"
          fi

          echo "RESEND_DOMAIN_ID=${domain_id}" >> "${GITHUB_ENV}"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            "https://api.resend.com/domains/${domain_id}" > resend-domain.json

          echo 'Resend domain state and required DNS records:'
          jq '{id,name,status,region,records:[.records[]? | {record,name,type,ttl,status,value,priority}]}' resend-domain.json

      - name: Rotate domain-scoped SMTP key and configure Supabase custom SMTP
        env:
          RESEND_API_KEY: ${{ secrets.SAGA_RESEND_MANAGEMENT_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SAGA_SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Remove older setup-created SMTP keys with this exact name before rotating.
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            'https://api.resend.com/api-keys?limit=100' > api-keys.json

          while IFS= read -r old_key_id; do
            [[ -n "${old_key_id}" ]] || continue
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${RESEND_API_KEY}" \
              "https://api.resend.com/api-keys/${old_key_id}" >/dev/null
          done < <(jq -r --arg name "${SMTP_KEY_NAME}" '.data[]? | select(.name == $name) | .id' api-keys.json)

          jq -n \
            --arg name "${SMTP_KEY_NAME}" \
            --arg domain_id "${RESEND_DOMAIN_ID}" \
            '{name:$name, permission:"sending_access", domain_id:$domain_id}' > create-smtp-key.json

          status="$(curl --silent --show-error \
            --request POST \
            --output create-smtp-key-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data @create-smtp-key.json \
            'https://api.resend.com/api-keys')"
          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            message="$(jq -r '.message // .error // "Resend API key creation failed"' create-smtp-key-response.json 2>/dev/null || true)"
            echo "::error title=Unable to create Resend SMTP key::HTTP ${status}: ${message}"
            exit 1
          fi

          smtp_pass="$(jq -r '.token' create-smtp-key-response.json)"
          [[ -n "${smtp_pass}" && "${smtp_pass}" != "null" ]] || { echo '::error title=Missing SMTP credential::Resend did not return a key token.'; exit 1; }
          echo "::add-mask::${smtp_pass}"

          supabase_api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"

          jq -n \
            --arg sender "${SMTP_SENDER_EMAIL}" \
            --arg sender_name "${SMTP_SENDER_NAME}" \
            --arg smtp_pass "${smtp_pass}" \
            '{
              external_email_enabled: true,
              mailer_autoconfirm: false,
              smtp_admin_email: $sender,
              smtp_host: "smtp.resend.com",
              smtp_port: "465",
              smtp_user: "resend",
              smtp_pass: $smtp_pass,
              smtp_sender_name: $sender_name
            }' > smtp-patch.json

          status="$(curl --silent --show-error \
            --request PATCH \
            --output smtp-patch-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @smtp-patch.json \
            "${supabase_api}")"
          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            message="$(jq -r '.message // .error // "Supabase SMTP configuration failed"' smtp-patch-response.json 2>/dev/null || true)"
            echo "::error title=Unable to configure Supabase SMTP::HTTP ${status}: ${message}"
            exit 1
          fi

          read -r -d '' invite_template <<'HTML' || true
          <h2>You're invited to S.A.G.A.</h2>
          <p>You have been invited to join the private S.A.G.A. demo.</p>
          <p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=invite">Accept invitation</a></p>
          <p>If you did not expect this invitation, you can ignore this email.</p>
          HTML

          jq -n \
            --arg subject "You're invited to S.A.G.A." \
            --arg content "${invite_template}" \
            '{mailer_subjects_invite:$subject, mailer_templates_invite_content:$content}' > invite-template-patch.json

          status="$(curl --silent --show-error \
            --request PATCH \
            --output invite-template-patch-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data @invite-template-patch.json \
            "${supabase_api}")"
          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            message="$(jq -r '.message // .error // "Supabase invite template configuration failed"' invite-template-patch-response.json 2>/dev/null || true)"
            echo "::error title=Unable to configure invite template::HTTP ${status}: ${message}"
            exit 1
          fi

      - name: Verify safe Supabase SMTP and invitation settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SAGA_SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            "${api}" > auth-after.json

          jq -e \
            --arg sender "${SMTP_SENDER_EMAIL}" \
            '(.smtp_admin_email == $sender)
             and (.smtp_host == "smtp.resend.com")
             and ((.smtp_port | tostring) == "465")
             and (.smtp_user == "resend")
             and (.smtp_sender_name == "S.A.G.A.")
             and (.disable_signup == true)
             and (.mailer_subjects_invite == "You\u0027re invited to S.A.G.A.")
             and (.mailer_templates_invite_content | contains("token_hash={{ .TokenHash }}"))
             and (.mailer_templates_invite_content | contains("type=invite"))' auth-after.json >/dev/null

          jq '{site_url,uri_allow_list,disable_signup,smtp_admin_email,smtp_host,smtp_port,smtp_user,smtp_sender_name,mailer_subjects_invite}' auth-after.json
          echo 'Supabase custom SMTP and S.A.G.A. invite template verified. DNS verification remains required before mail delivery.'
