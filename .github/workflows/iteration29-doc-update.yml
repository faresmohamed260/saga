name: Iteration 29 Documentation Update

on:
  push:
    branches:
      - studio/video-gallery-ux
    paths:
      - .github/iteration29-doc-update

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux

      - name: Update canonical checklist and handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          checklist = Path('docs/studio-ui-polish-checklist.md')
          text = checklist.read_text()

          replacements = [
              ('**P1 core UX and architecture — complete**', '**P2 product polish — Item 29 complete**'),
              ('- Status: `[x]` Items **01–20** complete.', '- Status: `[x]` Items **01–29** complete.'),
              ('- P2 polish is active; next planned scope begins at **Item 29**.', '- P2 polish is active; Items **21–29** are complete and **Item 30** is next.'),
              ('- [ ] **29. Expand responsive visual coverage.** At minimum 320, 390, 768, 1024, 1440, and 1920 widths, focusing especially on the 768–1100 transition range.', '- [x] **29. Expand responsive visual coverage.** A deterministic Playwright matrix now captures Create/Video and Gallery at 320, 390, 768, 900, 1024, 1100, 1440, and 1920px, with Gallery Manage additionally covered at 768/900/1024/1100. The harness fails on horizontal overflow, viewport escape, collapsed cards, Search/Sort overlap, and unusably narrow mobile Search/Model controls. It caught and drove fixes for a real 20px Create overflow at 1024px plus a 320px Gallery control collision/intrinsic-grid squeeze. The reviewed responsive fix intentionally changed the 390px Gallery Manage baseline; the manual baseline-update path was used without loosening tolerances, then restored to manual-only. Final Studio Visual Preview `32771622937` passed the full responsive matrix and all eight approved regression surfaces with `0` changed pixels; artifact `9536443571` was downloaded and manually inspected across mobile, 768–1100 transition, Manage, and wide layouts. Validated by Studio CI `32771622957`, Studio Visual Preview `32771622937`, Backend Architecture CI `32771622891`, Modal Worker Inventory `32771622900`, Worker Fleet Live Smoke `32771622860`, and Required Check Compatibility `32771622922`. **Iteration 29 complete.**'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Checklist replacement anchor missing: {old}')
              text = text.replace(old, new, 1)

          iteration29 = '''### Iteration 29 — responsive visual coverage\n\n- [x] Added deterministic Create/Video and Gallery coverage at 320, 390, 768, 900, 1024, 1100, 1440, and 1920px, with Gallery Manage coverage at 768/900/1024/1100.\n- [x] Added hard assertions for horizontal overflow, viewport containment, card collapse, Search/Sort overlap, and minimum usable mobile Search/Model widths.\n- [x] The matrix exposed a real 20px Create overflow at 1024px; Create stage sizing was corrected to use its actual workspace instead of double-counting sidebar/workspace width.\n- [x] Artifact review then exposed a 320px Gallery Search/Sort collision and density-control intrinsic sizing squeeze; the narrow-mobile toolbar was reflowed into readable compact rows instead of weakening the assertion.\n- [x] The intentional responsive toolbar change was reviewed, the affected 390px Gallery Manage baseline was refreshed through the explicit baseline-update mechanism, and that mechanism was restored to manual-only afterward.\n- [x] Final Studio Visual Preview `32771622937` / artifact `9536443571` passed 20 responsive screenshots plus all eight approved regression surfaces with zero changed pixels. Manual review found no remaining Item-29-specific actionable issue.\n- [x] Final standard gates passed: Studio CI `32771622957`, Backend Architecture CI `32771622891`, Modal Worker Inventory `32771622900`, Worker Fleet Live Smoke `32771622860`, and Required Check Compatibility `32771622922`.\n\n'''
          anchor = '## Completed iteration log\n\n'
          if anchor not in text:
              raise SystemExit('Checklist iteration-log anchor missing')
          text = text.replace(anchor, anchor + iteration29, 1)
          checklist.write_text(text)

          brief = Path('docs/studio-ui-polish-iteration-brief.md')
          text = brief.read_text()
          replacements = [
              ('- Completed checklist items: **01–28**.', '- Completed checklist items: **01–29**.'),
              ('- Next item: **29 — expand responsive visual coverage**.', '- Next item: **30 — expand deterministic video delivery-contract tests**.'),
              ('- Do not begin Item 29 until the user says **continue**.', '- Do not begin Item 30 until the user says **continue**.'),
              ('Items 01–28 are complete, including exact video delivery, Gallery management and architecture cleanup, shared Create controls, lifecycle feedback, product-facing metadata, design tokens, accessibility polish, and a true screenshot-baseline regression gate. Remaining accepted work is responsive visual coverage across the full width matrix (Item 29) and expanded deterministic video delivery-contract testing (Item 30).', 'Items 01–29 are complete, including exact video delivery, Gallery management and architecture cleanup, shared Create controls, lifecycle feedback, product-facing metadata, design tokens, accessibility polish, a true screenshot-baseline regression gate, and responsive visual coverage across the full width matrix. Remaining accepted work is expanded deterministic video delivery-contract testing (Item 30).'),
              ('**Professional review:** Item 28 is complete with no remaining item-specific actionable comment. **Item 29 — expand responsive visual coverage — is next and remains gated on explicit user approval.**', '**Professional review:** Item 29 is complete with no remaining item-specific actionable comment. **Item 30 — expand deterministic video delivery-contract tests — is next and remains gated on explicit user approval.**'),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Brief replacement anchor missing: {old}')
              text = text.replace(old, new, 1)

          old_latest = '- Latest completed item is Iteration 28. Studio Visual Preview is now a real regression gate: eight deterministic approved surfaces are versioned under `apps/studio/visual-baselines`, `scripts/check-visual-regression.mjs` compares changed pixels with explicit per-surface tolerances and emits diff/report evidence, and a manual baseline-update workflow exists for intentional reviewed changes. Final Studio Visual Preview `32768394649` passed all eight gated surfaces with zero changed pixels; artifact `9535309218` was downloaded and inspected. Standard validation also passed: Studio CI `32768394643`, Backend Architecture CI `32768394714`, Modal Worker Inventory `32768394650`, Worker Fleet Live Smoke `32768394705`, and Required Check Compatibility `32768394739`.'
          new_latest = '- Latest completed item is Iteration 29. The GitHub-only visual harness now covers Create/Video and Gallery at 320, 390, 768, 900, 1024, 1100, 1440, and 1920px, with Manage coverage through the 768–1100 transition range and hard assertions for overflow, containment, overlap, card collapse, and minimum mobile control widths. It caught and drove fixes for a real 1024px Create overflow and 320px Gallery filter collision. Final Studio Visual Preview `32771622937` passed the responsive matrix and all eight approved visual-regression surfaces with zero changed pixels; artifact `9536443571` was downloaded and inspected. Standard validation also passed: Studio CI `32771622957`, Backend Architecture CI `32771622891`, Modal Worker Inventory `32771622900`, Worker Fleet Live Smoke `32771622860`, and Required Check Compatibility `32771622922`.'
          if old_latest not in text:
              raise SystemExit('Brief latest-item anchor missing')
          text = text.replace(old_latest, new_latest, 1)

          iteration29 = '''### Iteration 29 — responsive visual coverage\n\n**Status:** complete.\n\n**Implementation:** added `apps/studio/scripts/capture-responsive-preview.mjs` to the GitHub visual pipeline with required widths 320/390/768/1024/1440/1920 plus transition probes at 900/1100. Create/Video and Gallery are captured at every width; Gallery Manage is captured at 768/900/1024/1100. Assertions reject horizontal overflow, viewport escape, collapsed cards, overlapping Search/Sort controls, and unusably narrow mobile Search/Model controls. `visual:responsive` is available as a direct npm command as well as part of `visual:preview`.\n\n**Professional review cycle:** the first responsive run exposed 20px document overflow in Create/Video at 1024px. The product was fixed by sizing the Create stage to its actual workspace rather than subtracting the sidebar from `100vw`. Artifact inspection then exposed a 320px Gallery Search/Sort collision that overflow assertions alone did not catch, so explicit overlap/minimum-width assertions were added. Those assertions subsequently exposed intrinsic sizing pressure from the density control; the 320px toolbar was reflowed into readable compact rows rather than weakening the test. The intentional 390px toolbar change was reviewed, its approved Gallery Manage baseline was refreshed explicitly, and the temporary connector-only refresh trigger was removed with the baseline workflow restored to manual-only.\n\n**Validation:** final product/visual head before documentation `c2b95923686a338b93eb6aade3b8cfe1cf08a6ca`. Studio Visual Preview `32771622937` passed 20 responsive captures and all eight approved visual-regression surfaces with `0` changed pixels; artifact `9536443571` and `responsive-diagnostics.json` were downloaded and inspected. The final diagnostics recorded no horizontal overflow or page errors; mobile Search widths were 168px at 320 and 174px at 390, both above the 140px contract. Studio CI `32771622957`, Backend Architecture CI `32771622891`, Modal Worker Inventory `32771622900`, Worker Fleet Live Smoke `32771622860`, and Required Check Compatibility `32771622922` all passed.\n\n**Professional review:** Item 29 is complete with no remaining item-specific actionable comment. **Item 30 — expand deterministic video delivery-contract tests — is next and remains gated on explicit user approval.**\n\n'''
          anchor = '## Recent iteration log\n\n'
          if anchor not in text:
              raise SystemExit('Brief recent-log anchor missing')
          text = text.replace(anchor, anchor + iteration29, 1)
          brief.write_text(text)
          PY

      - name: Commit documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-ui-polish-checklist.md docs/studio-ui-polish-iteration-brief.md
          git diff --cached --check
          git commit -m "docs(studio): complete iteration 29"
          git push origin HEAD:studio/video-gallery-ux
