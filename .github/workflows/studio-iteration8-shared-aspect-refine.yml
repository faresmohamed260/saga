name: Studio Iteration 8 Shared AspectPicker Refinement

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  refine-and-review:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Apply shared AspectPicker refinement
        run: python apps/studio/scripts/iteration8_shared_aspect_refine.py

      - name: Install Studio dependencies
        working-directory: apps/studio
        run: npm install

      - name: Run poster and deferred-preview contract
        working-directory: apps/studio
        run: npm run test:poster

      - name: Build Studio
        working-directory: apps/studio
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: Start GitHub runner preview
        working-directory: apps/studio
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          echo $! > /tmp/saga-studio-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1

      - name: Capture refined visual and interaction evidence
        working-directory: apps/studio
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:preview

      - name: Publish Iteration 8 visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-iteration8-shared-aspect-refined-${{ github.run_id }}
          path: apps/studio/visual-preview
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated product changes
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/features/create/AspectPicker.jsx \
                  apps/studio/src/features/create/VideoGenerationControls.jsx \
                  apps/studio/src/create-controls.jsx \
                  apps/studio/src/studio-polish.css \
                  apps/studio/scripts/capture-ui-preview.mjs \
                  apps/studio/scripts/capture-video-output-preview.mjs
          git commit -m "refactor(studio): share image and video aspect picker"
          git push origin HEAD:${{ github.head_ref }}
