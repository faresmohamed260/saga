name: V3 Composite Lexer CI

on:
  push:
    branches:
      - v3/qualification-composite-lexer-ci

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Verify lockfile and install
        run: uv sync --frozen --extra dev
      - name: Run composite and upstream V3 contract tests
        run: >-
          uv run pytest -q
          tests/test_v3_composite_lexer.py
          tests/test_v3_lexer_benchmark.py
          tests/test_v3_identity_ranking.py
          tests/test_v3_ettin_adapter.py
      - name: Verify architecture boundaries
        run: uv run pytest -q tests/test_architecture_boundaries.py
