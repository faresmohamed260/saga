name: Qwen Civitai Checkpoint Probe

on:
  push:
    branches:
      - studio/qwen-image-edit-2511
    paths:
      - ".github/workflows/qwen-civitai-checkpoint-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
      CIVITAI_MODEL_ID: "2246542"
      REQUESTED_VERSION_ID: "2553500"
      REQUESTED_FILE_ID: "2443737"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependency
        run: python -m pip install --upgrade "requests>=2.32,<3"
      - name: Inspect available Qwen checkpoint versions and download routes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlsplit

          import requests

          token = os.environ.get('CIVITAI_API_TOKEN', '').strip()
          if not token:
              raise SystemExit('CIVITAI_API_TOKEN is missing')

          model_id = os.environ['CIVITAI_MODEL_ID']
          requested = int(os.environ['REQUESTED_VERSION_ID'])
          requested_file_id = int(os.environ['REQUESTED_FILE_ID'])
          session = requests.Session()
          common_headers = {
              'Accept': 'application/json',
              'User-Agent': 'saga-qwen-checkpoint-probe/2.0',
          }
          model_response = session.get(
              f'https://civitai.com/api/v1/models/{model_id}',
              headers={**common_headers, 'Authorization': f'Bearer {token}'},
              timeout=60,
          )
          model_response.raise_for_status()
          payload = model_response.json()

          version_response = session.get(
              f'https://civitai.com/api/v1/model-versions/{requested}',
              headers={**common_headers, 'Authorization': f'Bearer {token}'},
              timeout=60,
          )
          version_response.raise_for_status()
          version_payload = version_response.json()

          versions = []
          selected = None
          requested_row = None
          for version in payload.get('modelVersions') or []:
              files = []
              for item in version.get('files') or []:
                  metadata = item.get('metadata') or {}
                  row = {
                      'id': item.get('id'),
                      'name': item.get('name'),
                      'type': item.get('type'),
                      'sizeKB': item.get('sizeKB'),
                      'fp': metadata.get('fp'),
                      'size': metadata.get('size'),
                      'format': metadata.get('format'),
                      'sha256': (item.get('hashes') or {}).get('SHA256'),
                      'downloadUrl': item.get('downloadUrl'),
                      'primary': bool(item.get('primary')),
                  }
                  files.append(row)
              row = {
                  'id': version.get('id'),
                  'name': version.get('name'),
                  'baseModel': version.get('baseModel'),
                  'createdAt': version.get('createdAt'),
                  'downloadUrl': version.get('downloadUrl'),
                  'files': files,
              }
              versions.append(row)
              if row['id'] == requested:
                  requested_row = row
              if selected is None and any(str(f.get('fp') or '').lower() == 'fp16' for f in files):
                  selected = row

          current_files = []
          requested_file = None
          for item in version_payload.get('files') or []:
              metadata = item.get('metadata') or {}
              row = {
                  'id': item.get('id'),
                  'name': item.get('name'),
                  'type': item.get('type'),
                  'sizeKB': item.get('sizeKB'),
                  'fp': metadata.get('fp'),
                  'size': metadata.get('size'),
                  'format': metadata.get('format'),
                  'sha256': (item.get('hashes') or {}).get('SHA256'),
                  'downloadUrl': item.get('downloadUrl'),
                  'primary': bool(item.get('primary')),
              }
              current_files.append(row)
              if row['id'] == requested_file_id:
                  requested_file = row
          if not requested_file:
              raise SystemExit(f'Expected Civitai file id {requested_file_id} was not returned by the live version endpoint')

          def clean_location(url):
              parsed = urlsplit(str(url or ''))
              return {'host': parsed.netloc, 'path': parsed.path}

          def route_probe(name, url, headers):
              try:
                  response = requests.get(
                      url,
                      headers={**headers, 'Range': 'bytes=0-0', 'User-Agent': 'saga-qwen-checkpoint-probe/2.0'},
                      stream=True,
                      allow_redirects=True,
                      timeout=(30, 90),
                  )
                  first = response.raw.read(1)
                  history = [
                      {'status': item.status_code, **clean_location(item.url)}
                      for item in response.history
                  ]
                  result = {
                      'name': name,
                      'status': response.status_code,
                      'final': clean_location(response.url),
                      'history': history,
                      'contentLength': response.headers.get('Content-Length'),
                      'contentRange': response.headers.get('Content-Range'),
                      'contentType': response.headers.get('Content-Type'),
                      'contentDisposition': response.headers.get('Content-Disposition'),
                      'acceptRanges': response.headers.get('Accept-Ranges'),
                      'firstByteRead': len(first),
                  }
                  response.close()
                  return result
              except requests.RequestException as exc:
                  return {
                      'name': name,
                      'errorType': type(exc).__name__,
                      'status': getattr(getattr(exc, 'response', None), 'status_code', None),
                  }

          advertised = requested_file.get('downloadUrl') or version_payload.get('downloadUrl') or f'https://civitai.com/api/download/models/{requested}'
          routes = [
              route_probe('bearer-advertised-url', advertised, {'Authorization': f'Bearer {token}'}),
              route_probe('query-token-advertised-url', f'{advertised}{"&" if "?" in advertised else "?"}token={token}', {}),
          ]

          summary = {
              'modelId': payload.get('id'),
              'modelName': payload.get('name'),
              'requestedVersion': requested_row,
              'liveRequestedVersion': {
                  'id': version_payload.get('id'),
                  'name': version_payload.get('name'),
                  'downloadUrl': version_payload.get('downloadUrl'),
                  'files': current_files,
              },
              'requestedFile': requested_file,
              'firstFp16Candidate': selected,
              'routes': routes,
              'versions': versions,
          }
          print(json.dumps(summary, indent=2, sort_keys=True))
          with open('civitai-qwen-checkpoint-metadata.json', 'w', encoding='utf-8') as fh:
              json.dump(summary, fh, indent=2, sort_keys=True)
              fh.write('\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: civitai-qwen-checkpoint-metadata
          path: civitai-qwen-checkpoint-metadata.json
          if-no-files-found: error
          retention-days: 3
