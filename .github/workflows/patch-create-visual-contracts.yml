name: Apply Create Visual Contract Update

on:
  push:
    branches:
      - studio/create-advanced-presets
    paths:
      - .github/workflows/patch-create-visual-contracts.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/create-advanced-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/patch_create_visual_contracts.py
      - run: |
          rm scripts/patch_create_visual_contracts.py
          rm .github/workflows/patch-create-visual-contracts.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(studio): cover production-aware Create advanced settings"
          git push origin HEAD:studio/create-advanced-presets
