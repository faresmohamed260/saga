name: Dashboard Pro CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  dashboard-pro:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard_pro
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dashboard_pro/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Dashboard Pro
        run: npm run build
