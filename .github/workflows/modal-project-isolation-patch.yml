name: Apply Modal Project Isolation Patch

on:
  push:
    branches:
      - work/modal-project-isolation
    paths:
      - .github/workflows/modal-project-isolation-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/modal-project-isolation
          fetch-depth: 0
      - name: Apply bounded isolation patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('.')
          saga_labels = [f'modal-{n:02d}' for n in range(3, 42)]
          renderlab_labels = ['modal-01', 'modal-02'] + [f'modal-{n:02d}' for n in range(42, 48)]

          manifest = {
              'project': 'saga',
              'ownedAccountLabels': saga_labels,
              'reservedForOtherProjects': {'renderlab': renderlab_labels},
          }
          (root / 'config/modal-project-ownership.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8'
          )

          fleet_path = root / 'scripts/modal_worker_fleet.py'
          fleet = fleet_path.read_text(encoding='utf-8')
          fleet = fleet.replace(
              'ROOT = Path(__file__).resolve().parents[1]\n',
              'ROOT = Path(__file__).resolve().parents[1]\n'
              'OWNERSHIP_MANIFEST = ROOT / "config" / "modal-project-ownership.json"\n'
              'EXPECTED_SAGA_ACCOUNT_LABELS = tuple(f"modal-{number:02d}" for number in range(3, 42))\n\n'
          )
          start = fleet.index('def load_accounts() -> list[Account]:')
          end = fleet.index('\n\ndef run(', start)
          replacement = '''def saga_owned_account_labels() -> tuple[str, ...]:
              payload = json.loads(OWNERSHIP_MANIFEST.read_text(encoding="utf-8"))
              if payload.get("project") != "saga":
                  raise SystemExit("Modal ownership manifest is not owned by S.A.G.A.")
              labels = tuple(str(label) for label in payload.get("ownedAccountLabels") or [])
              if labels != EXPECTED_SAGA_ACCOUNT_LABELS:
                  raise SystemExit("S.A.G.A. Modal ownership manifest must contain exactly modal-03 through modal-41.")
              reserved = set((payload.get("reservedForOtherProjects") or {}).get("renderlab") or [])
              if reserved.intersection(labels):
                  raise SystemExit("Modal ownership manifest contains overlapping project accounts.")
              return labels


          def assert_saga_owned_account(label: str) -> None:
              if label not in saga_owned_account_labels():
                  raise SystemExit(f"Modal account {label!r} is not owned by S.A.G.A.; refusing credential export.")


          def load_accounts() -> list[Account]:
              raw = os.environ.get("SAGA_MODAL_TOKENS_JSON", "").strip()
              if not raw:
                  raise SystemExit("SAGA_MODAL_TOKENS_JSON is not configured")
              payload = json.loads(raw)
              if isinstance(payload, dict):
                  rows = payload.get("accounts") or payload.get("tokens") or payload.get("roster") or []
              else:
                  rows = payload
              if not isinstance(rows, list):
                  raise SystemExit("Modal roster must be a list")
              accounts_by_label: dict[str, Account] = {}
              for index, row in enumerate(rows, start=1):
                  if not isinstance(row, dict):
                      continue
                  label = str(row.get("label") or row.get("name") or row.get("account") or f"modal-{index:02d}").strip()
                  token_id = str(row.get("token_id") or "").strip()
                  token_secret = str(row.get("token_secret") or "").strip()
                  combined = str(row.get("api_key") or row.get("token") or "").strip()
                  if (not token_id or not token_secret) and "." in combined:
                      token_id, token_secret = combined.split(".", 1)
                  if not token_id or not token_secret:
                      continue
                  if label in accounts_by_label:
                      raise SystemExit(f"Duplicate Modal account label in roster: {label}")
                  accounts_by_label[label] = Account(label, token_id, token_secret)

              owned_labels = saga_owned_account_labels()
              missing = [label for label in owned_labels if label not in accounts_by_label]
              if missing:
                  raise SystemExit(f"S.A.G.A. Modal roster is missing owned accounts: {', '.join(missing)}")
              return [accounts_by_label[label] for label in owned_labels]


          def env_for(account: Account, extra: dict[str, str] | None = None) -> dict[str, str]:
              assert_saga_owned_account(account.label)
              env = dict(os.environ)
              env["MODAL_TOKEN_ID"] = account.token_id
              env["MODAL_TOKEN_SECRET"] = account.token_secret
              if extra:
                  env.update({key: str(value) for key, value in extra.items()})
              return env
          '''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          fleet = fleet[:start] + replacement + fleet[end:]
          fleet_path.write_text(fleet, encoding='utf-8')

          verifier = '''#!/usr/bin/env python3
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          MANIFEST = ROOT / "config" / "modal-project-ownership.json"
          EXPECTED_SAGA = [f"modal-{n:02d}" for n in range(3, 42)]
          RENDERLAB = ["modal-01", "modal-02", *[f"modal-{n:02d}" for n in range(42, 48)]]
          RETIRED_WORKFLOWS = [
              "modal-worker-maintenance.yml",
              "modal-worker-provision.yml",
              "deploy-flux2-klein-modal01.yml",
              "deploy-flux2-klein-gateway.yml",
              "qwen-fleet-routing-live.yml",
              "qwen-live-inference-smoke.yml",
              "worker-fleet-live-smoke.yml",
          ]

          payload = json.loads(MANIFEST.read_text(encoding="utf-8"))
          assert payload.get("project") == "saga", "Modal manifest project must be saga"
          assert payload.get("ownedAccountLabels") == EXPECTED_SAGA, "Saga must own exactly modal-03 through modal-41"
          reserved = (payload.get("reservedForOtherProjects") or {}).get("renderlab") or []
          assert reserved == RENDERLAB, "RenderLab reservation must be modal-01, modal-02, modal-42 through modal-47"
          assert not set(EXPECTED_SAGA).intersection(RENDERLAB), "Modal project allocations must not overlap"

          workflow_root = ROOT / ".github" / "workflows"
          for name in RETIRED_WORKFLOWS:
              assert not (workflow_root / name).exists(), f"Retired cross-project Modal workflow is active: {name}"

          inventory = (workflow_root / "modal-worker-inventory.yml").read_text(encoding="utf-8")
          assert 'EXPECTED_MODAL_ACCOUNTS: "39"' in inventory, "Saga inventory must be scoped to 39 owned accounts"
          assert "Inventory every S.A.G.A.-owned Modal account" in inventory

          fleet = (ROOT / "scripts" / "modal_worker_fleet.py").read_text(encoding="utf-8")
          assert "assert_saga_owned_account(account.label)" in fleet, "Credential export must assert Saga ownership"
          assert "OWNERSHIP_MANIFEST" in fleet, "Modal fleet loader must use checked-in ownership manifest"
          print("S.A.G.A. Modal project ownership boundary verified.")
          '''
          verifier = '\n'.join(line[10:] if line.startswith('          ') else line for line in verifier.splitlines()) + '\n'
          (root / 'scripts/verify_modal_project_ownership.py').write_text(verifier, encoding='utf-8')

          tests = '''from __future__ import annotations

          import json
          from pathlib import Path

          import pytest

          from scripts import modal_worker_fleet


          def fake_roster(labels: list[str]) -> str:
              return json.dumps({
                  "accounts": [
                      {"label": label, "token_id": f"fake-{label}", "token_secret": f"secret-{label}"}
                      for label in labels
                  ]
              })


          def test_manifest_assigns_exact_saga_accounts() -> None:
              payload = json.loads(Path("config/modal-project-ownership.json").read_text(encoding="utf-8"))
              assert payload["ownedAccountLabels"] == [f"modal-{n:02d}" for n in range(3, 42)]
              assert payload["reservedForOtherProjects"]["renderlab"] == [
                  "modal-01", "modal-02", *[f"modal-{n:02d}" for n in range(42, 48)]
              ]


          def test_omnibus_roster_is_filtered_to_saga_accounts(monkeypatch: pytest.MonkeyPatch) -> None:
              labels = [f"modal-{n:02d}" for n in range(1, 48)]
              monkeypatch.setenv("SAGA_MODAL_TOKENS_JSON", fake_roster(labels))
              accounts = modal_worker_fleet.load_accounts()
              assert [account.label for account in accounts] == [f"modal-{n:02d}" for n in range(3, 42)]


          @pytest.mark.parametrize("label", ["modal-01", "modal-02", "modal-42", "modal-47"])
          def test_credential_export_rejects_renderlab_accounts(label: str) -> None:
              account = modal_worker_fleet.Account(label, "fake-id", "fake-secret")
              with pytest.raises(SystemExit, match="not owned by S.A.G.A."):
                  modal_worker_fleet.env_for(account)


          def test_missing_owned_account_fails_closed(monkeypatch: pytest.MonkeyPatch) -> None:
              labels = [f"modal-{n:02d}" for n in range(1, 48) if n != 17]
              monkeypatch.setenv("SAGA_MODAL_TOKENS_JSON", fake_roster(labels))
              with pytest.raises(SystemExit, match="modal-17"):
                  modal_worker_fleet.load_accounts()
          '''
          (root / 'tests/test_modal_project_ownership.py').write_text(tests, encoding='utf-8')

          inventory_path = root / '.github/workflows/modal-worker-inventory.yml'
          inventory = inventory_path.read_text(encoding='utf-8')
          inventory = inventory.replace('EXPECTED_MODAL_ACCOUNTS: "47"', 'EXPECTED_MODAL_ACCOUNTS: "39"')
          inventory = inventory.replace('Inventory every configured Modal account', 'Inventory every S.A.G.A.-owned Modal account')
          inventory = inventory.replace('## S.A.G.A. Modal account inventory', '## S.A.G.A.-owned Modal account inventory')
          inventory_path.write_text(inventory, encoding='utf-8')

          backend_path = root / '.github/workflows/backend-ci.yml'
          backend = backend_path.read_text(encoding='utf-8')
          needle = '      - name: Verify architecture boundaries\n        run: uv run pytest -q tests/test_architecture_boundaries.py\n'
          replacement_ci = needle + '      - name: Verify Modal project ownership boundary\n        run: uv run python scripts/verify_modal_project_ownership.py\n'
          if needle not in backend:
              raise SystemExit('Backend CI insertion point not found')
          backend_path.write_text(backend.replace(needle, replacement_ci, 1), encoding='utf-8')

          for name in [
              'modal-worker-maintenance.yml',
              'modal-worker-provision.yml',
              'deploy-flux2-klein-modal01.yml',
              'deploy-flux2-klein-gateway.yml',
              'qwen-fleet-routing-live.yml',
              'qwen-live-inference-smoke.yml',
              'worker-fleet-live-smoke.yml',
          ]:
              path = root / '.github/workflows' / name
              if path.exists():
                  path.unlink()

          agents_path = root / 'AGENTS.md'
          agents = agents_path.read_text(encoding='utf-8')
          rule = '''

          ## Modal Project Ownership Rule

          Modal account ownership is a locked cross-project infrastructure boundary. S.A.G.A. owns only `modal-03` through `modal-41`. RenderLab owns `modal-01`, `modal-02`, and `modal-42` through `modal-47`.

          Possession of an omnibus Modal credential roster does not authorize use of every credential. S.A.G.A. scripts and workflows must pass the checked-in ownership guard before exporting `MODAL_TOKEN_ID` / `MODAL_TOKEN_SECRET`, and must fail closed for RenderLab-owned labels. Do not re-enable historical worker maintenance/provisioning or live media-smoke workflows that target or spend against RenderLab-owned workers. Changing this partition requires an explicit owner decision recorded in both repositories.

          This rule does not change D-027: Modal remains outside S.A.G.A. v2 textual analysis and is reserved for future S.A.G.A.-owned media/image workloads.
          '''
          rule = '\n'.join(line[10:] if line.startswith('          ') else line for line in rule.splitlines())
          if '## Modal Project Ownership Rule' not in agents:
              agents_path.write_text(agents.rstrip() + rule + '\n', encoding='utf-8')

          decisions_path = root / 'docs/DECISIONS.md'
          decisions = decisions_path.read_text(encoding='utf-8')
          decision = '''

          ### D-028 — Modal Accounts Are Partitioned by Project

          **Status:** Accepted — owner decision 2026-09-13

          S.A.G.A. owns `modal-03` through `modal-41`. RenderLab owns `modal-01`, `modal-02`, and `modal-42` through `modal-47`.

          Credential presence is not authorization. S.A.G.A. Modal tooling must resolve credentials only after the checked-in project-ownership guard accepts the account label, and it must fail closed for RenderLab-owned labels even while a legacy omnibus secret still contains all 47 credentials. Historical mutation and live media-smoke workflows that target or consume RenderLab-owned workers are not part of active S.A.G.A. v2 and must not remain runnable ordinary control surfaces.

          **Consequence:** Future S.A.G.A. Modal media work must use only S.A.G.A.-owned accounts. Changing the partition requires an explicit owner decision reflected in both repositories. The strongest operational end state is secret-store least privilege so each repository physically contains only its own credentials; repository guards do not falsely claim that secret rotation/splitting is already complete. D-027 remains unchanged: Modal is reserved for media/image generation, not textual analysis.
          '''
          decision = '\n'.join(line[10:] if line.startswith('          ') else line for line in decision.splitlines())
          if '### D-028 — Modal Accounts Are Partitioned by Project' not in decisions:
              decisions_path.write_text(decisions.rstrip() + decision + '\n', encoding='utf-8')

          patch_workflow = root / '.github/workflows/modal-project-isolation-patch.yml'
          patch_workflow.unlink()
          PY

          python scripts/verify_modal_project_ownership.py
          git status --short
          git diff --check
      - name: Commit bounded isolation implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Enforce S.A.G.A. Modal project isolation"
          git push origin HEAD:work/modal-project-isolation
