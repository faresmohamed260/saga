name: Fix Studio R2 browser upload CORS

on:
  push:
    branches:
      - studio/unified-resolution-reference-cleanup
    paths:
      - .github/workflows/fix-studio-r2-cors.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cors:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
    steps:
      - name: Install R2 client
        run: python -m pip install --disable-pip-version-check boto3 requests

      - name: Preserve existing CORS and allow Studio browser uploads
        shell: python
        run: |
          import os
          import uuid
          import boto3
          import requests
          from botocore.config import Config
          from botocore.exceptions import ClientError

          account = os.environ['R2_ACCOUNT_ID'].strip()
          access = os.environ['R2_ACCESS_KEY_ID'].strip()
          secret = os.environ['R2_SECRET_ACCESS_KEY'].strip()
          bucket = (os.environ.get('R2_BUCKET_NAME') or 'saga-studio-media').strip()
          endpoint = f'https://{account}.r2.cloudflarestorage.com'

          s3 = boto3.client(
              's3',
              endpoint_url=endpoint,
              aws_access_key_id=access,
              aws_secret_access_key=secret,
              region_name='auto',
              config=Config(
                  signature_version='s3v4',
                  request_checksum_calculation='when_required',
                  response_checksum_validation='when_required',
              ),
          )

          try:
              existing = s3.get_bucket_cors(Bucket=bucket).get('CORSRules', [])
          except ClientError as exc:
              code = str(exc.response.get('Error', {}).get('Code', ''))
              if code not in {'NoSuchCORSConfiguration', 'NoSuchCORS'}:
                  raise
              existing = []

          origins = [
              'https://studio.faresuniform.uk',
              'https://studio-faresmohamed260-6733s-projects.vercel.app',
              'https://studio-git-studio-unified-022121-faresmohamed260-6733s-projects.vercel.app',
              'https://studio-fh5oxgu40-faresmohamed260-6733s-projects.vercel.app',
          ]
          rule_id = 'saga-studio-presigned-browser-uploads'
          rule = {
              'ID': rule_id,
              'AllowedOrigins': origins,
              'AllowedMethods': ['PUT'],
              'AllowedHeaders': ['Content-Type'],
              'ExposeHeaders': ['ETag'],
              'MaxAgeSeconds': 3600,
          }
          rules = [item for item in existing if item.get('ID') != rule_id]
          rules.append(rule)
          s3.put_bucket_cors(Bucket=bucket, CORSConfiguration={'CORSRules': rules})

          key = f'cors-smoke/{uuid.uuid4()}.png'
          put_url = s3.generate_presigned_url(
              'put_object',
              Params={'Bucket': bucket, 'Key': key, 'ContentType': 'image/png'},
              ExpiresIn=300,
          )
          png = bytes.fromhex('89504e470d0a1a0a0000000d49484452000000010000000108060000001f15c4890000000d49444154789c6360f8cfc000000301010018dd8db10000000049454e44ae426082')

          try:
              for origin in origins:
                  preflight = requests.options(
                      put_url,
                      headers={
                          'Origin': origin,
                          'Access-Control-Request-Method': 'PUT',
                          'Access-Control-Request-Headers': 'content-type',
                      },
                      timeout=30,
                  )
                  allow_origin = preflight.headers.get('Access-Control-Allow-Origin', '')
                  allow_methods = preflight.headers.get('Access-Control-Allow-Methods', '')
                  if preflight.status_code >= 400 or allow_origin not in {origin, '*'} or 'PUT' not in allow_methods.upper():
                      raise RuntimeError(
                          f'CORS preflight failed for {origin}: status={preflight.status_code} '
                          f'allow-origin={allow_origin!r} allow-methods={allow_methods!r}'
                      )

              upload = requests.put(
                  put_url,
                  headers={'Origin': origins[2], 'Content-Type': 'image/png'},
                  data=png,
                  timeout=30,
              )
              if upload.status_code >= 400:
                  raise RuntimeError(f'Presigned PUT failed: {upload.status_code} {upload.text[:300]}')
              allow_origin = upload.headers.get('Access-Control-Allow-Origin', '')
              if allow_origin not in {origins[2], '*'}:
                  raise RuntimeError(f'PUT response missing expected CORS origin: {allow_origin!r}')
              print('R2 browser upload CORS is valid for production and the current Studio preview origins.')
          finally:
              try:
                  s3.delete_object(Bucket=bucket, Key=key)
              except Exception:
                  pass
