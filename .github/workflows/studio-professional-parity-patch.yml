name: Studio Professional Parity Patch

on:
  push:
    branches:
      - studio/advanced-ui-audit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/advanced-ui-audit
          fetch-depth: 0
      - name: Apply professional continuation-flow patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('apps/studio/src/app/App.jsx')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              "removeFromCollection, reuseSettings, editThis, downloadItem, deleteGeneration, bulkFavorite",
              "removeFromCollection, reuseSettings, editThis, animateThis, downloadItem, deleteGeneration, bulkFavorite",
              1,
          )
          text = text.replace(
              "      onEdit={editThis}\n      onDownload={downloadItem}",
              "      onEdit={editThis}\n      onAnimate={animateThis}\n      onDownload={downloadItem}",
              1,
          )
          text = text.replace(
              ": section === 'Models' ? <ModelsView />\n          : section === 'Workflows' ? <WorkflowsView />",
              ": section === 'Models' ? <ModelsView onUseModel={(createMode) => { setCreateMode(createMode); setSection('Create'); }} />\n          : section === 'Workflows' ? <WorkflowsView onUseWorkflow={(createMode) => { setCreateMode(createMode); setSection('Create'); }} />",
              1,
          )
          app.write_text(text, encoding='utf-8')

          actions = Path('apps/studio/src/hooks/useMediaActions.js')
          text = actions.read_text(encoding='utf-8')
          anchor = "  const downloadItem = (item) => {\n"
          if "const animateThis = async (item)" not in text:
              animate = '''  const animateThis = async (item) => {\n    if (item.kind === 'video') return;\n    const mediaUrl = item.originalUrl || item.url;\n    if (!mediaUrl) return;\n    try {\n      const response = await fetch(mediaUrl);\n      if (!response.ok) throw new Error(`Media request failed (${response.status})`);\n      const blob = await response.blob();\n      if (!blob.type.startsWith('image/')) throw new Error('Selected media is not an image.');\n      const extension = blob.type === 'image/jpeg' ? 'jpg' : blob.type === 'image/webp' ? 'webp' : 'png';\n      const file = new File([blob], `saga-video-reference-${item.id}.${extension}`, { type: blob.type || 'image/png' });\n      const dimensions = await imageDimensions(file);\n      references.forEach((reference) => reference.preview && URL.revokeObjectURL(reference.preview));\n      setReferences([{ id: `animate-${item.id}-${Date.now()}`, file, preview: URL.createObjectURL(blob), ...dimensions }]);\n      setPrompt('');\n      setMode('Video');\n      setSection('Create');\n      setError('');\n    } catch (err) { window.alert(err instanceof Error ? err.message : 'Could not prepare this image for video generation.'); }\n  };\n\n'''
              text = text.replace(anchor, animate + anchor, 1)
          text = text.replace(
              "reuseSettings, editThis, downloadItem, deleteGeneration, bulkFavorite",
              "reuseSettings, editThis, animateThis, downloadItem, deleteGeneration, bulkFavorite",
              1,
          )
          actions.write_text(text, encoding='utf-8')

          media = Path('apps/studio/src/components/MediaCard.jsx')
          text = media.read_text(encoding='utf-8')
          text = text.replace(
              "  onEdit,\n  onDownload,",
              "  onEdit,\n  onAnimate,\n  onDownload,",
              1,
          )
          more_anchor = "      {item.kind !== 'video' && <button type=\"button\" role=\"menuitem\" onClick={menuAction(onEdit)}><Pencil size={15}/><span>Edit</span></button>}\n"
          if "<span>Animate</span>" not in text:
              text = text.replace(
                  more_anchor,
                  more_anchor + "      {item.kind !== 'video' && <button type=\"button\" role=\"menuitem\" onClick={menuAction(onAnimate)}><Video size={15}/><span>Animate</span></button>}\n",
                  1,
              )
          standard_anchor = "      {item.kind !== 'video' && <button type=\"button\" title=\"Edit this\" aria-label=\"Edit this\" onClick={action(onEdit)}><Pencil size={16}/></button>}\n"
          if 'title="Animate this"' not in text:
              text = text.replace(
                  standard_anchor,
                  standard_anchor + "      {item.kind !== 'video' && <button type=\"button\" title=\"Animate this\" aria-label=\"Animate this\" onClick={action(onAnimate)}><Video size={16}/></button>}\n",
                  1,
              )
          media.write_text(text, encoding='utf-8')

          preview = Path('apps/studio/scripts/capture-ui-preview.mjs')
          text = preview.read_text(encoding='utf-8')
          text = text.replace(
              "  if (!mobileSubmitBox || mobileSubmitBox.width > 40 || mobileSubmitBox.height > 40 || Math.abs(mobileSubmitBox.width - mobileSubmitBox.height) > 1) throw new Error(`Mobile Generate action is not compact/circular: ${JSON.stringify(mobileSubmitBox)}`);",
              "  if (!mobileSubmitBox || mobileSubmitBox.width < 44 || mobileSubmitBox.height < 44 || mobileSubmitBox.width > 48 || mobileSubmitBox.height > 48 || Math.abs(mobileSubmitBox.width - mobileSubmitBox.height) > 1) throw new Error(`Mobile Generate action does not provide a compact 44px touch target: ${JSON.stringify(mobileSubmitBox)}`);",
              1,
          )
          shot_anchor = "  await shot(desktop, '08-output-wall-hover.png');\n"
          if "08b-output-animate.png" not in text:
              text = text.replace(
                  shot_anchor,
                  shot_anchor + "  const animateAction = cardActions.getByRole('button', { name: 'Animate this', exact: true });\n  await animateAction.waitFor({ state: 'visible' });\n  await animateAction.click();\n  await desktop.locator('.saga-composer.is-video').waitFor({ state: 'visible', timeout: 3000 });\n  await desktop.locator('.saga-reference-chip').waitFor({ state: 'visible', timeout: 3000 });\n  await shot(desktop, '08b-output-animate.png');\n",
                  1,
              )
          preview.write_text(text, encoding='utf-8')
          PY

          git rm .github/workflows/studio-professional-parity-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/app/App.jsx apps/studio/src/hooks/useMediaActions.js apps/studio/src/components/MediaCard.jsx apps/studio/scripts/capture-ui-preview.mjs
          if ! git diff --cached --quiet; then
            git commit -m "feat(studio): add professional continuation flows"
            git push origin HEAD:studio/advanced-ui-audit
          fi
