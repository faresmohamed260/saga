name: Studio Release Acceptance Observer

on:
  pull_request:
    branches: [main]
    paths:
      - .github/release-acceptance-observer

permissions:
  actions: read
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Find acceptance run for current branch
        id: find
        shell: bash
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 30); do
            run_id=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Studio Release Acceptance E2E" \
              --branch studio/video-gallery-ux \
              --event push \
              --limit 10 \
              --json databaseId,createdAt \
              --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "Could not find Studio Release Acceptance E2E run" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Acceptance run: $run_id"

      - name: Wait for acceptance completion
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ steps.find.outputs.run_id }}"
          for attempt in $(seq 1 280); do
            payload=$(gh run view "$run_id" --repo "${{ github.repository }}" --json status,conclusion)
            status=$(printf '%s' "$payload" | jq -r '.status')
            conclusion=$(printf '%s' "$payload" | jq -r '.conclusion // ""')
            echo "acceptance status=$status conclusion=${conclusion:-pending}"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                gh run view "$run_id" --repo "${{ github.repository }}" --log-failed || true
                exit 1
              fi
              exit 0
            fi
            sleep 15
          done
          echo "Acceptance run did not finish within observer timeout" >&2
          exit 1

      - name: Download and print acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          run_id="${{ steps.find.outputs.run_id }}"
          mkdir -p /tmp/acceptance
          gh run download "$run_id" --repo "${{ github.repository }}" --dir /tmp/acceptance
          summary=$(find /tmp/acceptance -name studio-release-acceptance.json -print -quit)
          probe=$(find /tmp/acceptance -name studio-e2e-ffprobe.json -print -quit)
          if [ -z "$summary" ] || [ -z "$probe" ]; then
            echo "Acceptance evidence artifact is incomplete" >&2
            find /tmp/acceptance -maxdepth 3 -type f -print
            exit 1
          fi
          echo "--- Studio acceptance summary ---"
          cat "$summary"
          echo "--- ffprobe ---"
          cat "$probe"

      - name: Publish observer evidence
        uses: actions/upload-artifact@v4
        with:
          name: studio-release-acceptance-observer-${{ github.run_id }}
          path: /tmp/acceptance
          retention-days: 1
