name: Deploy FLUX.2 Klein 9B to modal-01

on:
  push:
    branches:
      - studio/flux2-klein-9b-img2img
    paths:
      - "integrations/comfyui/flux2_klein_app.py"
      - "integrations/comfyui/workflows/flux2_klein_9b_image_edit_api.json"
      - ".github/workflows/deploy-flux2-klein-modal01.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-flux2-klein-modal01
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      MODAL_FLUX2_KLEIN_GPU: A10
      PREFETCH_READY: "false"

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: python -m pip install --upgrade "modal==1.4.2"

      - name: Select modal-01 credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, os

          raw = os.environ.get("SAGA_MODAL_TOKENS_JSON", "").strip()
          if not raw:
              raise SystemExit("SAGA_MODAL_TOKENS_JSON is not configured")
          payload = json.loads(raw)
          if isinstance(payload, dict):
              accounts = payload.get("accounts") or payload.get("tokens") or payload.get("roster") or []
          else:
              accounts = payload
          if not isinstance(accounts, list) or not accounts:
              raise SystemExit("Modal roster does not contain any accounts")

          selected = None
          for account in accounts:
              if not isinstance(account, dict):
                  continue
              label = str(account.get("label") or account.get("name") or account.get("account") or "").strip().lower()
              if label in {"modal-01", "modal01", "modal-1", "account-01", "account-1"}:
                  selected = account
                  break
          if selected is None:
              selected = accounts[0]

          token_id = str(selected.get("token_id") or "").strip()
          token_secret = str(selected.get("token_secret") or "").strip()
          combined = str(selected.get("api_key") or selected.get("token") or "").strip()
          if (not token_id or not token_secret) and "." in combined:
              token_id, token_secret = combined.split(".", 1)
          if not token_id or not token_secret:
              raise SystemExit("modal-01 entry is missing token_id/token_secret")

          print(f"::add-mask::{token_id}")
          print(f"::add-mask::{token_secret}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MODAL_TOKEN_ID={token_id}\n")
              handle.write(f"MODAL_TOKEN_SECRET={token_secret}\n")
          print("Selected modal-01 credentials from roster")
          PY

      - name: Deploy isolated FLUX.2 Klein app
        run: modal deploy integrations/comfyui/flux2_klein_app.py

      - name: Prefetch FLUX.2 Klein model bundle
        shell: bash
        run: |
          python - <<'PY'
          import modal
          fn = modal.Function.from_name("saga-flux2-klein-9b", "prefetch_klein")
          result = fn.remote(False)
          print({
              "ready": result.get("ready"),
              "model": result.get("model"),
              "elapsed_seconds": result.get("elapsed_seconds"),
          })
          if result.get("ready") is not True:
              raise SystemExit("prefetch did not report ready=true")
          PY
          echo "PREFETCH_READY=true" >> "$GITHUB_ENV"

      - name: Publish deployment status issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          TITLE="[automation] FLUX.2 Klein modal-01 deploy status"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            'Automated FLUX.2 Klein 9B deployment report.' \
            '' \
            "- Status: **${JOB_STATUS}**" \
            "- Branch: ${{ github.ref_name }}" \
            "- Commit: ${{ github.sha }}" \
            '- Modal app: saga-flux2-klein-9b' \
            '- Target account: modal-01' \
            '- GPU: A10' \
            "- Model prefetch ready: ${PREFETCH_READY}" \
            "- Run: ${RUN_URL}")
          ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search '"[automation] FLUX.2 Klein modal-01 deploy status" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
