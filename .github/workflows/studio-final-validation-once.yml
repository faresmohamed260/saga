name: Studio Final Validation Once

on:
  push:
    branches:
      - studio/mobile-gallery-create-followup

permissions:
  contents: read

jobs:
  studio:
    if: ${{ !contains(github.event.head_commit.message, '[final-validation-cleanup]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/mobile-gallery-create-followup
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Studio dependencies
        working-directory: apps/studio
        run: npm install --no-audit --no-fund
      - name: Install Playwright Chromium
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium
      - name: Build Studio and run contracts
        working-directory: apps/studio
        run: npm run build
      - name: Start preview
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1
      - name: Capture browser surfaces
        working-directory: apps/studio
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:capture
      - name: Compare approved visual baselines
        working-directory: apps/studio
        env:
          UI_PREVIEW_DIR: visual-preview
          UI_BASELINE_DIR: visual-baselines
          UI_DIFF_DIR: visual-preview/diffs
        run: npm run visual:regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-final-validation-${{ github.run_id }}
          path: |
            apps/studio/visual-preview/*.png
            apps/studio/visual-preview/*.json
            apps/studio/visual-preview/diffs/*.png
          if-no-files-found: warn
          retention-days: 7

  backend:
    if: ${{ !contains(github.event.head_commit.message, '[final-validation-cleanup]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/mobile-gallery-create-followup
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Verify lockfile and install
        run: uv sync --frozen --extra dev
      - name: Verify migration head
        run: test "$(uv run alembic heads | wc -l)" -eq 1
      - name: Scan source for credentials
        run: uv run python -m scripts.check_source_secrets
      - name: Architecture boundaries
        run: uv run pytest -q tests/test_architecture_boundaries.py
      - name: Active backend tests
        run: uv run pytest -q
