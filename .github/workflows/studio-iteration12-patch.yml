name: Studio Iteration 12 Patch

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/studio_iteration12_patch.py"
      - ".github/workflows/studio-iteration12-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-iteration12-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Iteration 12 patch
        run: python scripts/studio_iteration12_patch.py
      - name: Commit Iteration 12 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/studio/src/generation-client.js \
            apps/studio/src/app/App.jsx \
            apps/studio/src/features/create/CreateWorkspace.jsx \
            apps/studio/src/features/create/VideoGenerationControls.jsx \
            apps/studio/src/studio-polish.css \
            apps/studio/scripts/capture-video-output-preview.mjs \
            docs/studio-ui-polish-checklist.md
          if git diff --cached --quiet; then
            echo "Iteration 12 already applied"
            exit 0
          fi
          git commit -m "feat: complete generation lifecycle actions"
          git push origin HEAD:studio/video-gallery-ux
