name: Studio Advanced drawer test aligner

on:
  push:
    branches:
      - studio/ui-fixes-advanced-sidebar-jobs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/ui-fixes-advanced-sidebar-jobs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align Advanced drawer browser close checks
        run: python .github/scripts/align_advanced_drawer_close_test.py
      - name: Commit alignment
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/scripts/capture-ui-preview.mjs
          git commit -m "test(studio): close Advanced through drawer action [advanced-close-aligned]"
          git push origin HEAD:studio/ui-fixes-advanced-sidebar-jobs
