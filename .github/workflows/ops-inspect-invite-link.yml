name: Inspect S.A.G.A. invite link shape

on:
  push:
    branches:
      - "ops/first-owner-bootstrap-2026-09-11"
    paths:
      - ".github/workflows/ops-inspect-invite-link.yml"

permissions:
  contents: read

jobs:
  inspect-link:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OWNER_EMAIL: faresmohamed260@gmail.com
      EXPECTED_SUBJECT: You're invited to S.A.G.A.
    steps:
      - name: Inspect rendered link structure
        env:
          RESEND_API_KEY: ${{ secrets.SAGA_RESEND_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${RESEND_API_KEY:-}" ]] || { echo "::error title=Missing Resend token::SAGA_RESEND_MANAGEMENT_TOKEN is unavailable."; exit 1; }
          echo "::add-mask::${RESEND_API_KEY}"

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            "https://api.resend.com/emails?limit=100" > emails.json

          email_id="$(jq -r --arg email "${OWNER_EMAIL}" --arg subject "${EXPECTED_SUBJECT}" '
            [.data[]? | select((.to // []) | index($email)) | select(.subject == $subject)] | sort_by(.created_at) | last | .id // empty
          ' emails.json)"

          [[ -n "${email_id}" ]] || { echo "::error title=Invite not found::No matching Resend email found."; exit 1; }

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            "https://api.resend.com/emails/${email_id}" > email.json

          python - <<'PY'
          import json, re
          from urllib.parse import urlparse, parse_qs

          data = json.load(open('email.json', encoding='utf-8'))
          html = data.get('html') or ''
          m = re.search(r'href=["\']([^"\']+)["\']', html, flags=re.I)
          if not m:
              raise SystemExit('No href found in rendered invite email')
          raw = m.group(1).replace('&amp;', '&')
          u = urlparse(raw)
          qs = parse_qs(u.query, keep_blank_values=True)
          token_values = qs.get('token_hash', [])
          print(json.dumps({
              'scheme': u.scheme,
              'host': u.netloc,
              'path': u.path,
              'query_keys': sorted(qs.keys()),
              'type': (qs.get('type') or [None])[0],
              'token_hash_present': bool(token_values and token_values[0]),
              'token_hash_length': len(token_values[0]) if token_values else 0,
          }))
          expected = {'token_hash', 'type'}
          if u.path != '/auth/confirm' or set(qs) != expected or (qs.get('type') or [None])[0] != 'invite' or not token_values or not token_values[0]:
              raise SystemExit('Rendered invite link does not match the S.A.G.A. confirm contract')
          PY
