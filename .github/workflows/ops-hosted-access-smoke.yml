name: Hosted access suspension smoke proof

on:
  push:
    branches:
      - ops/hosted-access-smoke
    paths:
      - .github/workflows/ops-hosted-access-smoke.yml

permissions:
  contents: read

jobs:
  hosted-access-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://scmeqnpmhomzcwecjdtu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_znDKjfEiIhk296hIL1ussA_a7lCpxIo
      APP_ORIGIN: https://saga-pi-two.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund

      - name: Exercise hosted sign-in and access state
        working-directory: apps/web
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import crypto from 'node:crypto';
          import assert from 'node:assert/strict';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';

          const url = process.env.SUPABASE_URL;
          const publishableKey = process.env.SUPABASE_PUBLISHABLE_KEY;
          const secretKey = process.env.SUPABASE_SECRET_KEY;
          const appOrigin = process.env.APP_ORIGIN;
          assert.ok(url && publishableKey && secretKey && appOrigin, 'required hosted configuration missing');

          const suffix = `${Date.now()}-${crypto.randomBytes(4).toString('hex')}`;
          const email = `saga-hosted-smoke-${suffix}@example.com`;
          const password = crypto.randomBytes(32).toString('base64url');
          const privileged = createClient(url, secretKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
          let userId = null;

          async function fetchHome(cookieHeader) {
            return fetch(`${appOrigin}/home`, { headers: { cookie: cookieHeader }, redirect: 'manual' });
          }

          try {
            const { data: created, error: createError } = await privileged.auth.admin.createUser({ email, password, email_confirm: true });
            assert.ifError(createError);
            assert.ok(created.user?.id, 'Auth Admin did not return a user');
            userId = created.user.id;

            const { error: admitError } = await privileged.from('saga_account_access').insert({ user_id: userId, role: 'member', status: 'active', accepted_at: new Date().toISOString() });
            assert.ifError(admitError);

            const jar = new Map();
            const ordinary = createServerClient(url, publishableKey, { cookies: {
              getAll() { return [...jar.entries()].map(([name, record]) => ({ name, value: record.value })); },
              setAll(cookies) { for (const cookie of cookies) jar.set(cookie.name, { value: cookie.value, options: cookie.options }); },
            }});

            const { data: signedIn, error: signInError } = await ordinary.auth.signInWithPassword({ email, password });
            assert.ifError(signInError);
            assert.equal(signedIn.user?.id, userId, 'password sign-in returned unexpected user');
            assert.ok(signedIn.session?.access_token, 'password sign-in did not produce a session');

            const cookieHeader = [...jar.entries()].map(([name, record]) => `${name}=${record.value}`).join('; ');
            assert.ok(cookieHeader.length > 0, 'SSR sign-in did not produce cookies');

            const activeResponse = await fetchHome(cookieHeader);
            assert.equal(activeResponse.status, 200, `active /home expected 200, got ${activeResponse.status}`);

            const { error: suspendError } = await privileged.from('saga_account_access').update({ status: 'suspended' }).eq('user_id', userId);
            assert.ifError(suspendError);
            const suspendedResponse = await fetchHome(cookieHeader);
            assert.ok([302, 303, 307, 308].includes(suspendedResponse.status), `suspended /home expected redirect, got ${suspendedResponse.status}`);
            assert.match(suspendedResponse.headers.get('location') ?? '', /\/access\/suspended(?:$|\?)/);

            const { error: reactivateError } = await privileged.from('saga_account_access').update({ status: 'active' }).eq('user_id', userId);
            assert.ifError(reactivateError);
            const reactivatedResponse = await fetchHome(cookieHeader);
            assert.equal(reactivatedResponse.status, 200, `reactivated /home expected 200, got ${reactivatedResponse.status}`);

            const { data: verified, error: getUserError } = await privileged.auth.admin.getUserById(userId);
            assert.ifError(getUserError);
            assert.ok(verified.user?.last_sign_in_at, 'hosted password sign-in did not update last_sign_in_at');
            console.log('Hosted access proof passed: password sign-in -> /home 200 -> suspension redirect -> reactivation /home 200.');
          } finally {
            if (userId) {
              await privileged.from('saga_account_access').delete().eq('user_id', userId);
              await privileged.auth.admin.deleteUser(userId);
            }
          }
          NODE
