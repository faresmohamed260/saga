name: V3 GLiNER2.5 Per-Label Sweep

on:
  push:
    branches:
      - v3/qualification-gliner25-per-label

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/v3-gliner-qualification.txt
      - name: Install CPU Torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install GLiNER qualification environment
        run: python -m pip install -r requirements/v3-gliner-qualification.txt

      - name: Sweep character name
        run: >-
          python -m scripts.run_v3_gliner_threshold_sweep
          --root external/litbank
          --out evaluation-artifacts/character-name.json
          --limit 10
          --thresholds "0.3,0.5,0.65,0.75,0.85"
          --character-labels "character name"
          --device cpu
          --model-cache .cache/huggingface

      - name: Sweep character description
        run: >-
          python -m scripts.run_v3_gliner_threshold_sweep
          --root external/litbank
          --out evaluation-artifacts/character-description.json
          --limit 10
          --thresholds "0.3,0.5,0.65,0.75,0.85"
          --character-labels "character description"
          --device cpu
          --model-cache .cache/huggingface

      - name: Sweep character pronoun
        run: >-
          python -m scripts.run_v3_gliner_threshold_sweep
          --root external/litbank
          --out evaluation-artifacts/character-pronoun.json
          --limit 10
          --thresholds "0.3,0.5,0.65,0.75,0.85"
          --character-labels "character pronoun"
          --device cpu
          --model-cache .cache/huggingface

      - name: Publish comparison
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("## GLiNER2.5 per-label threshold sweep — 10 LitBank documents")
          for slug in ("character-name", "character-description", "character-pronoun"):
              report = json.loads((Path("evaluation-artifacts") / f"{slug}.json").read_text())
              print()
              print(f"### {slug.replace('-', ' ')}")
              print("| Threshold | Precision | Recall | F1 | Proper | Nominal | Pronoun |")
              print("|---:|---:|---:|---:|---:|---:|---:|")
              for row in report["results"]:
                  m = row["aggregate"]["metrics"]
                  print(f"| {row['threshold']:.2f} | {m['precision']:.4f} | {m['recall']:.4f} | {m['f1']:.4f} | {m['proper_name_recall']:.4f} | {m['nominal_recall']:.4f} | {m['pronoun_recall']:.4f} |")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: saga-v3-gliner25-per-label-${{ github.sha }}
          path: evaluation-artifacts/*.json
          if-no-files-found: error
          retention-days: 90
