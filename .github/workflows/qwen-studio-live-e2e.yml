name: Qwen Studio Live End-to-End

on:
  push:
    branches:
      - studio/qwen-image-edit-2511
    paths:
      - ".github/workflows/qwen-studio-live-e2e.yml"
      - "apps/studio/api/generate.js"
      - "apps/studio/api/generate/result.js"
      - "apps/studio/api/history.js"
      - "apps/studio/api/jobs.js"
      - "apps/studio/api/uploads.js"
      - "apps/studio/api/_worker-registry.generated.js"
      - "apps/studio/api/_worker-registry.js"
      - "apps/studio/api/_workflows.js"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: qwen-studio-live-e2e-2511
  cancel-in-progress: true

jobs:
  persisted-studio-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STUDIO_BASE: https://studio-git-studio-qwen-im-2fdce1-faresmohamed260-6733s-projects.vercel.app
      QWEN_MODEL_LABEL: Qwen Image Edit 2511 · Abliterated BF16 + Lightning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mint GitHub OIDC token for Vercel Trusted Sources
        id: vercel-oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken();
            core.setSecret(token);
            core.setOutput('token', token);
      - name: Install HTTP dependency
        run: python -m pip install --upgrade "requests>=2.32,<3"
      - name: Run persisted Civitai Qwen generation through Studio
        shell: bash
        env:
          VERCEL_TRUSTED_OIDC_TOKEN: ${{ steps.vercel-oidc.outputs.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import struct
          import time
          import urllib.parse
          import zlib
          from datetime import datetime, timezone

          import requests

          base = os.environ['STUDIO_BASE'].rstrip('/')
          model_label = os.environ['QWEN_MODEL_LABEL']
          oidc_token = os.environ.get('VERCEL_TRUSTED_OIDC_TOKEN', '').strip()
          if not oidc_token:
              raise SystemExit('GitHub OIDC token was not minted for Vercel Trusted Sources')
          sha = os.environ.get('GITHUB_SHA', '')[:12]
          prompt = f'SAGA Civitai Qwen deployment readiness {sha}: turn this blue reference into a clean editorial poster with a centered white circle.'
          started_at = datetime.now(timezone.utc).isoformat()
          session = requests.Session()
          session.headers.update({
              'User-Agent': 'saga-qwen-civitai-live-e2e/1.0',
              'x-vercel-trusted-oidc-idp-token': oidc_token,
          })

          response = session.get(base + '/api/generate', timeout=60)
          if response.status_code != 200:
              raise SystemExit(f'Studio workflow discovery failed: HTTP {response.status_code}: {response.text[:500]}')
          try:
              workflows = response.json().get('workflows') or []
          except ValueError as exc:
              raise SystemExit(f'Studio workflow discovery returned non-JSON content despite OIDC: {response.text[:500]}') from exc
          qwen = next((item for item in workflows if item.get('id') == 'qwen-image-edit-2511'), None)
          if not qwen or qwen.get('model') != model_label or qwen.get('ecosystem') != 'qwen-image-edit-2511':
              raise SystemExit(f'Studio preview is not serving the Civitai Qwen workflow: {qwen}')
          print(json.dumps({'event': 'studio-civitai-qwen-ready', 'workflow': qwen}), flush=True)

          width = height = 256
          rows = []
          for y in range(height):
              row = bytearray([0])
              for x in range(width):
                  row.extend((48 + x * 96 // width, 62 + y * 72 // height, 112))
              rows.append(bytes(row))

          def chunk(kind, data):
              body = kind + data
              return struct.pack('>I', len(data)) + body + struct.pack('>I', zlib.crc32(body) & 0xffffffff)

          source_png = (
              b'\x89PNG\r\n\x1a\n'
              + chunk(b'IHDR', struct.pack('>IIBBBBB', width, height, 8, 2, 0, 0, 0))
              + chunk(b'IDAT', zlib.compress(b''.join(rows), 9))
              + chunk(b'IEND', b'')
          )

          ticket = session.post(
              base + '/api/uploads',
              json={
                  'filename': f'qwen-civitai-readiness-{sha}.png',
                  'contentType': 'image/png',
                  'size': len(source_png),
                  'purpose': 'generation-source',
              },
              timeout=60,
          )
          if ticket.status_code != 201:
              raise SystemExit(f'Could not create source upload ticket: HTTP {ticket.status_code}: {ticket.text[:1000]}')
          upload = ticket.json()
          if not upload.get('uploadUrl') or not upload.get('key'):
              raise SystemExit(f'Upload ticket is incomplete: {upload}')

          put = requests.put(upload['uploadUrl'], data=source_png, headers={'Content-Type': 'image/png'}, timeout=120)
          if not put.ok:
              raise SystemExit(f'Could not upload Qwen source to R2: HTTP {put.status_code}: {put.text[:500]}')

          submit = session.post(
              base + '/api/generate',
              json={
                  'workflowId': 'qwen-image-edit-2511',
                  'sourceKeys': [upload['key']],
                  'sourceFilenames': [f'qwen-civitai-readiness-{sha}.png'],
                  'sourceContentTypes': ['image/png'],
                  'sourceKey': upload['key'],
                  'sourceFilename': f'qwen-civitai-readiness-{sha}.png',
                  'prompt': prompt,
                  'negativePrompt': ' ',
                  'seed': 42,
                  'steps': 4,
                  'cfg': 1.0,
                  'megapixels': 0.25,
              },
              timeout=120,
          )
          if submit.status_code != 202:
              raise SystemExit(f'Studio Qwen submit failed: HTTP {submit.status_code}: {submit.text[:1500]}')
          queued = submit.json()
          job = queued.get('job') or {}
          job_id = job.get('id')
          assigned = (queued.get('worker') or {}).get('workerId')
          if not job_id:
              raise SystemExit(f'Studio Qwen submit returned no job id: {queued}')
          if queued.get('ecosystem') != 'qwen-image-edit-2511':
              raise SystemExit(f'Studio routed Qwen to the wrong ecosystem: {queued}')
          if assigned not in {'qwen-primary-01', 'qwen-standby-01'}:
              raise SystemExit(f'Studio assigned Qwen to an unexpected worker: {queued}')
          print(json.dumps({'event': 'studio-qwen-submitted', 'jobId': job_id, 'workerId': assigned, 'failover': queued.get('workerFailoverHistory') or []}), flush=True)

          deadline = time.time() + 900
          result = None
          while time.time() < deadline:
              response = session.get(base + '/api/generate/result', params={'jobId': job_id}, timeout=120)
              if response.status_code == 202:
                  state = response.json()
                  print(json.dumps({'event': 'studio-qwen-running', 'jobId': job_id, 'workerState': state.get('workerState'), 'workerId': (state.get('worker') or {}).get('workerId'), 'failover': state.get('failover') or None}), flush=True)
                  time.sleep(5)
                  continue
              if response.status_code != 200:
                  raise SystemExit(f'Studio Qwen result failed: HTTP {response.status_code}: {response.text[:2000]}')
              result = response.json()
              break
          if not result:
              raise SystemExit(f'Studio Qwen generation timed out for job {job_id}')
          if result.get('status') != 'completed' or result.get('persisted') is not True:
              raise SystemExit(f'Studio Qwen result was not persisted: {result}')

          generation_id = result.get('generationId')
          media_url = result.get('mediaUrl')
          if generation_id != job_id or not media_url:
              raise SystemExit(f'Persisted Studio Qwen result is incomplete: {result}')

          media_target = urllib.parse.urljoin(base + '/', media_url)
          media = session.get(media_target, timeout=120)
          if media.status_code != 200 or 'image/' not in str(media.headers.get('content-type') or '').lower():
              raise SystemExit(f'Persisted Qwen media is unreadable: HTTP {media.status_code} {media.headers.get("content-type")}')
          if not media.content.startswith(b'\x89PNG\r\n\x1a\n') or len(media.content) < 10_000:
              raise SystemExit(f'Persisted Qwen media is not a valid PNG: bytes={len(media.content)}')

          job_response = session.get(base + '/api/jobs', params={'id': job_id}, timeout=60)
          if job_response.status_code != 200:
              raise SystemExit(f'Jobs API could not read persisted Qwen job: HTTP {job_response.status_code}: {job_response.text[:1000]}')
          persisted_job = job_response.json().get('job') or {}
          if persisted_job.get('status') != 'completed' or persisted_job.get('workflow_id') != 'qwen-image-edit-2511':
              raise SystemExit(f'Jobs API does not show completed Qwen job: {persisted_job}')
          if persisted_job.get('model') != model_label:
              raise SystemExit(f'Jobs API reports the wrong Qwen model: {persisted_job}')

          history_response = session.get(
              base + '/api/history',
              params={'limit': 100, 'kind': 'image', 'model': model_label, 'after': started_at},
              timeout=60,
          )
          if history_response.status_code != 200:
              raise SystemExit(f'Gallery API failed: HTTP {history_response.status_code}: {history_response.text[:1000]}')
          gallery_items = history_response.json().get('items') or []
          gallery_item = next((item for item in gallery_items if item.get('id') == generation_id), None)
          if not gallery_item:
              raise SystemExit(f'Persisted Qwen generation did not appear in Gallery: generationId={generation_id}; items={len(gallery_items)}')
          if gallery_item.get('status') != 'completed' or gallery_item.get('workflow_id') != 'qwen-image-edit-2511':
              raise SystemExit(f'Gallery item has wrong Qwen state/workflow: {gallery_item}')

          print(json.dumps({
              'ready': True,
              'jobId': job_id,
              'generationId': generation_id,
              'workerId': assigned,
              'persisted': True,
              'jobsVerified': True,
              'galleryVerified': True,
              'mediaBytes': len(media.content),
              'mediaContentType': media.headers.get('content-type'),
              'workflow': persisted_job.get('workflow_id'),
              'model': persisted_job.get('model'),
              'sourceKey': upload['key'],
          }), flush=True)
          PY
