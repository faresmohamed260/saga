name: Studio Visual Baseline Update

on:
  workflow_dispatch:
  push:
    branches:
      - studio/upload-plus-drag-drop
    paths:
      - ".github/workflows/studio-visual-baseline.yml"

permissions:
  contents: write

jobs:
  update-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/studio

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Studio dependencies
        run: npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Studio
        run: npm run build

      - name: Start remote runner preview
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1

      - name: Capture approved surfaces
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:capture

      - name: Update versioned baselines
        env:
          UI_PREVIEW_DIR: visual-preview
          UI_BASELINE_DIR: visual-baselines
          UPDATE_VISUAL_BASELINES: "1"
        run: npm run visual:regression

      - name: Keep only intended upload baselines
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git restore apps/studio/visual-baselines
          cp apps/studio/visual-preview/01-create-image-centered.png apps/studio/visual-baselines/01-create-image-centered.png
          cp apps/studio/visual-preview/09-mobile-create.png apps/studio/visual-baselines/09-mobile-create.png

      - name: Commit reviewed baseline candidates
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/studio-visual-baseline.yml
          git add apps/studio/visual-baselines/01-create-image-centered.png apps/studio/visual-baselines/09-mobile-create.png .github/workflows/studio-visual-baseline.yml
          git diff --cached --check
          git commit -m "test(studio): refresh upload affordance baselines"
          git push origin "HEAD:${{ github.ref_name }}"