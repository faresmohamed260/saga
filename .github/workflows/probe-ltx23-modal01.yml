name: Probe LTX 2.3 on modal-01

on:
  push:
    branches:
      - studio/ltx23-video-backend
    paths:
      - "integrations/comfyui/ltx23_probe.py"
      - ".github/workflows/probe-ltx23-modal01.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: probe-ltx23-modal01
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: python -m pip install --upgrade "modal==1.4.2"

      - name: Select modal-01 credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          raw = os.environ.get("SAGA_MODAL_TOKENS_JSON", "").strip()
          if not raw:
              raise SystemExit("SAGA_MODAL_TOKENS_JSON is not configured")
          payload = json.loads(raw)
          accounts = payload.get("accounts") or payload.get("tokens") or payload.get("roster") or [] if isinstance(payload, dict) else payload
          if not isinstance(accounts, list) or not accounts:
              raise SystemExit("Modal roster is empty")
          selected = next((a for a in accounts if isinstance(a, dict) and str(a.get("label") or a.get("name") or a.get("account") or "").strip().lower() in {"modal-01", "modal01", "modal-1", "account-01", "account-1"}), accounts[0])
          token_id = str(selected.get("token_id") or "").strip()
          token_secret = str(selected.get("token_secret") or "").strip()
          combined = str(selected.get("api_key") or selected.get("token") or "").strip()
          if (not token_id or not token_secret) and "." in combined:
              token_id, token_secret = combined.split(".", 1)
          if not token_id or not token_secret:
              raise SystemExit("modal-01 credentials are incomplete")
          print(f"::add-mask::{token_id}")
          print(f"::add-mask::{token_secret}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MODAL_TOKEN_ID={token_id}\n")
              handle.write(f"MODAL_TOKEN_SECRET={token_secret}\n")
          PY

      - name: Deploy probe
        run: modal deploy integrations/comfyui/ltx23_probe.py

      - name: Inspect cached LTX files
        shell: bash
        run: |
          python - <<'PY' | tee /tmp/ltx23-probe.json
          import json, modal
          fn = modal.Function.from_name("saga-ltx23-probe", "probe")
          result = fn.remote()
          print(json.dumps(result, indent=2))
          PY

      - name: Publish probe issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TITLE="[automation] LTX 2.3 modal-01 probe"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -f /tmp/ltx23-probe.json ]; then
            BODY=$(printf 'Status: **%s**\n\nRun: %s\n\n```json\n%s\n```\n' "${{ job.status }}" "$RUN_URL" "$(cat /tmp/ltx23-probe.json)")
          else
            BODY=$(printf 'Status: **%s**\n\nRun: %s\n' "${{ job.status }}" "$RUN_URL")
          fi
          ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search '"[automation] LTX 2.3 modal-01 probe" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
