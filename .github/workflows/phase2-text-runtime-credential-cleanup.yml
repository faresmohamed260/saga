name: Phase 2 text-runtime credential cleanup

on:
  push:
    branches:
      - ops/phase2-hosted-proof
    paths:
      - .github/workflows/phase2-text-runtime-credential-cleanup.yml

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAGA_B2_KEY_ID: ${{ secrets.SAGA_B2_KEY_ID }}
      SAGA_B2_MASTER_APPLICATION_KEY: ${{ secrets.SAGA_B2_MASTER_APPLICATION_KEY }}
      SAGA_SUPABASE_ACCESS_TOKEN: ${{ secrets.SAGA_SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Revoke only superseded Phase-2 text worker credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          B2_KEY_NAME = "saga-phase2-worker-modal"
          SUPABASE_KEY_NAME = "saga_phase2_analysis_worker"
          SUPABASE_REF = "scmeqnpmhomzcwecjdtu"

          def normalized(name: str) -> str:
              value = os.environ.get(name, "").replace("\r", "").replace("\n", "").strip()
              if not value:
                  raise SystemExit(f"missing required secret: {name}")
              return value

          def request_json(url: str, *, method="GET", headers=None, body=None):
              data = None if body is None else json.dumps(body).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers or {})
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read()
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")[:1000]
                  raise RuntimeError(f"HTTP {exc.code} from credential-cleanup endpoint: {detail}") from None
              if not raw:
                  return None
              return json.loads(raw)

          # Backblaze: use the bootstrap/master credential only to revoke the abandoned scoped key.
          b2_id = normalized("SAGA_B2_KEY_ID")
          b2_key = normalized("SAGA_B2_MASTER_APPLICATION_KEY")
          basic = base64.b64encode(f"{b2_id}:{b2_key}".encode()).decode()
          auth = request_json(
              "https://api.backblazeb2.com/b2api/v4/b2_authorize_account",
              headers={"Authorization": f"Basic {basic}"},
          )
          account_id = auth["accountId"]
          storage_api = auth["apiInfo"]["storageApi"]
          api_url = storage_api["apiUrl"].rstrip("/")
          token = auth["authorizationToken"]
          b2_headers = {"Authorization": token, "Content-Type": "application/json"}
          listed = request_json(
              f"{api_url}/b2api/v4/b2_list_keys",
              method="POST",
              headers=b2_headers,
              body={"accountId": account_id, "maxKeyCount": 1000},
          )
          matches = [
              row for row in (listed.get("keys") or [])
              if isinstance(row, dict) and row.get("keyName") == B2_KEY_NAME
          ]
          for row in matches:
              request_json(
                  f"{api_url}/b2api/v4/b2_delete_key",
                  method="POST",
                  headers=b2_headers,
                  body={"applicationKeyId": row["applicationKeyId"]},
              )
          print(f"Backblaze: revoked {len(matches)} superseded scoped key(s) named {B2_KEY_NAME}")

          # Supabase: revoke only the named Phase-2 analysis-worker key.
          supa_token = normalized("SAGA_SUPABASE_ACCESS_TOKEN")
          supa_headers = {
              "Authorization": f"Bearer {supa_token}",
              "Content-Type": "application/json",
          }
          keys = request_json(
              f"https://api.supabase.com/v1/projects/{SUPABASE_REF}/api-keys?reveal=false",
              headers=supa_headers,
          )
          rows = keys if isinstance(keys, list) else (keys.get("data") or keys.get("keys") or [])
          matches = [
              row for row in rows
              if isinstance(row, dict) and row.get("name") == SUPABASE_KEY_NAME and row.get("id")
          ]
          for row in matches:
              request_json(
                  f"https://api.supabase.com/v1/projects/{SUPABASE_REF}/api-keys/{urllib.parse.quote(str(row['id']))}",
                  method="DELETE",
                  headers=supa_headers,
              )
          print(f"Supabase: revoked {len(matches)} superseded key(s) named {SUPABASE_KEY_NAME}")
          PY
