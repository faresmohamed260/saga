name: Record manual Vercel deployment policy

on:
  push:
    branches:
      - "ops/manual-vercel-deployments"
    paths:
      - ".github/workflows/ops-document-vercel-policy.yml"

permissions:
  contents: write

jobs:
  document-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/manual-vercel-deployments
          fetch-depth: 0

      - name: Update authoritative governance
        shell: python
        run: |
          from pathlib import Path

          agents = Path("AGENTS.md")
          agents_text = agents.read_text(encoding="utf-8")
          agents_section = '''

## Vercel Deployment Authorization

S.A.G.A. Vercel deployments are **manual and owner-authorized**.

- `apps/web/vercel.json` must keep `git.deploymentEnabled` set to `false` so Git pushes, branches, pull requests, and merges do not create Vercel deployments automatically.
- Do not trigger a Vercel Preview or Production deployment unless the owner explicitly approves that specific deployment after being told why it is needed, which environment is proposed, and which exact Git ref/SHA will be deployed.
- A request to implement, continue, test, review, merge, or finish repository work is **not** deployment authorization.
- Default validation remains GitHub Actions/deterministic repository CI. Propose hosted deployment only when a major cohesive update warrants owner review, a hosted integration genuinely requires it, or the owner asks for a deployed build.
- Deployment approval is one-time and scoped to the described deployment. Ask again for any later deployment.
- The historical Vercel `studio` project is disconnected from the S.A.G.A. Git repository and must not be reconnected without a new owner decision.

Follow `docs/operations/VERCEL_DEPLOYMENT_POLICY.md`.
'''
          if "## Vercel Deployment Authorization" not in agents_text:
              agents.write_text(agents_text.rstrip() + agents_section + "\n", encoding="utf-8")

          decisions = Path("docs/DECISIONS.md")
          decisions_text = decisions.read_text(encoding="utf-8")
          decision = '''
### D-025 — Vercel Deployments Are Manual and Owner-Authorized

**Status:** Accepted — owner decision 2026-09-11

S.A.G.A. does not automatically deploy Git pushes, branches, pull requests, or merges to Vercel. The active web project keeps Git-triggered deployments disabled through `apps/web/vercel.json`.

A Vercel Preview or Production deployment requires explicit owner approval for that specific deployment after the proposed environment, exact Git ref/SHA, and reason for deployment are stated. Repository implementation/merge authorization does not imply deployment authorization.

The historical Vercel `studio` project was disconnected from `faresmohamed260/saga` on 2026-09-11 and must remain disconnected unless the owner explicitly reverses that decision.

**Consequence:** Normal validation uses GitHub Actions and repository-owned deterministic checks. Agents may propose a manual Vercel deployment for major cohesive updates, hosted-integration testing, or owner review, but must wait for explicit approval before triggering it. Approval is one-time and does not authorize later deployments. See `docs/operations/VERCEL_DEPLOYMENT_POLICY.md`.

'''
          marker = "## Still-Applicable General Principles From v1"
          if "### D-025 — Vercel Deployments Are Manual and Owner-Authorized" not in decisions_text:
              if marker not in decisions_text:
                  raise SystemExit("DECISIONS insertion marker missing")
              decisions_text = decisions_text.replace(marker, decision + marker, 1)
              decisions.write_text(decisions_text, encoding="utf-8")

          docs_index = Path("docs/README.md")
          index_text = docs_index.read_text(encoding="utf-8")
          index_line = "- `operations/VERCEL_DEPLOYMENT_POLICY.md` — owner-authorized manual-only Vercel deployment policy; Git-triggered Preview/Production deployments are disabled\n"
          anchor = "- `../config/v2-storage.json` — validated safe Backblaze B2 metadata\n"
          if "operations/VERCEL_DEPLOYMENT_POLICY.md" not in index_text:
              if anchor not in index_text:
                  raise SystemExit("docs index insertion anchor missing")
              index_text = index_text.replace(anchor, anchor + index_line, 1)
              docs_index.write_text(index_text, encoding="utf-8")

      - name: Commit governance and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ops-document-vercel-policy.yml
          git add AGENTS.md docs/DECISIONS.md docs/README.md
          git diff --cached --check
          git commit -m "Record manual-only Vercel deployment governance"
          git push origin HEAD:ops/manual-vercel-deployments
