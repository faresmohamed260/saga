name: Phase 0 External Readiness Diagnostic

on:
  push:
    branches:
      - phase-0/external-readiness-diagnostic

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto

      SAGA_SUPABASE_DB_URL: ${{ secrets.SAGA_SUPABASE_DB_URL }}
      SAGA_SUPABASE_DB_HOST: ${{ secrets.SAGA_SUPABASE_DB_HOST }}
      SAGA_SUPABASE_DB_PORT: ${{ secrets.SAGA_SUPABASE_DB_PORT }}
      SAGA_SUPABASE_DB_NAME: ${{ secrets.SAGA_SUPABASE_DB_NAME }}
      SAGA_SUPABASE_DB_USER: ${{ secrets.SAGA_SUPABASE_DB_USER }}
      SAGA_SUPABASE_DB_PASSWORD: ${{ secrets.SAGA_SUPABASE_DB_PASSWORD }}
      SAGA_SUPABASE_POOLER_TENANT_ID: ${{ secrets.SAGA_SUPABASE_POOLER_TENANT_ID }}
      SAGA_SUPABASE_API_URL: ${{ secrets.SAGA_SUPABASE_API_URL }}
      SAGA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SAGA_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      SAGA_PROVIDER_COST_RATES_JSON: ${{ vars.SAGA_PROVIDER_COST_RATES_JSON }}

      SAGA_RUNTIME_DB_MODE: supabase_postgres
      SAGA_RUNTIME_DB_PROVIDER: supabase

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen runtime
        run: uv sync --frozen --extra dev

      - name: Report configuration presence only
        shell: bash
        run: |
          set -euo pipefail
          present() { if [ -n "${!1:-}" ]; then printf 'yes'; else printf 'no'; fi; }
          supabase_api=no
          [ -n "${SAGA_SUPABASE_API_URL:-}${SUPABASE_URL:-}" ] && supabase_api=yes
          supabase_role=no
          [ -n "${SAGA_SUPABASE_SERVICE_ROLE_KEY:-}${SUPABASE_SERVICE_ROLE_KEY:-}" ] && supabase_role=yes
          r2_ready=no
          if [ -n "${R2_ACCOUNT_ID:-}" ] && [ -n "${R2_BUCKET_NAME:-}" ] && [ -n "${AWS_ACCESS_KEY_ID:-}" ] && [ -n "${AWS_SECRET_ACCESS_KEY:-}" ]; then
            r2_ready=yes
          fi
          echo "CONFIG_PRESENCE saga_db_url=$(present SAGA_SUPABASE_DB_URL) saga_db_host=$(present SAGA_SUPABASE_DB_HOST) supabase_api=$supabase_api supabase_service_role=$supabase_role ollama_api_key=$(present OLLAMA_API_KEY) mistral_api_key=$(present MISTRAL_API_KEY) cost_rates=$(present SAGA_PROVIDER_COST_RATES_JSON) r2_credentials=$r2_ready"

      - name: Inspect protected-source freshness against production persistence
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          uv run python - <<'PY'
          import json
          import os
          from pathlib import Path

          from packages.persistence_runtime import PersistenceProfile, PersistenceRuntimeConfig, create_persistence_client
          from packages.persistence_runtime.database_url import build_database_url_from_env
          from scripts.check_production_qualification_readiness import asset_freshness_error

          def first(*names: str) -> str:
              for name in names:
                  value = str(os.environ.get(name, "") or "").strip()
                  if value:
                      return value
              return ""

          manifest = json.loads(Path("docs/operations/protected_assets.manifest.json").read_text(encoding="utf-8"))
          assets = list(manifest.get("assets") or [])
          explicit_db = first("SAGA_RUNTIME_DB_URL", "SAGA_SUPABASE_DB_URL", "SUPABASE_DB_URL", "DATABASE_URL")
          host = first("SAGA_SUPABASE_DB_HOST", "SUPABASE_DB_HOST")
          user = first("SAGA_SUPABASE_DB_USER", "SUPABASE_DB_USER")
          tenant = first("SAGA_SUPABASE_POOLER_TENANT_ID", "SUPABASE_POOLER_TENANT_ID", "POOLER_TENANT_ID")
          password = first("SAGA_SUPABASE_DB_PASSWORD", "SUPABASE_DB_PASSWORD", "POSTGRES_PASSWORD")
          output = Path(os.environ["GITHUB_OUTPUT"])

          if not explicit_db and not (host and (user or tenant) and password):
              print("PRODUCTION_DB_RESULT status=not_configured")
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("db_status=not_configured\n")
                  handle.write("fresh_asset=\n")
              raise SystemExit(0)

          database_url = explicit_db or build_database_url_from_env()
          api_url = first("SAGA_SUPABASE_API_URL", "SAGA_SUPABASE_URL", "SUPABASE_API_URL", "SUPABASE_URL")
          service_role = first("SAGA_SUPABASE_SERVICE_ROLE_KEY", "SUPABASE_SERVICE_ROLE_KEY")
          profile = PersistenceProfile(
              name="phase0-external-readiness-diagnostic",
              provider="supabase",
              mode="supabase_postgres",
              database_url=database_url,
              application_name="saga-phase0-external-readiness-diagnostic",
          )
          client = create_persistence_client(
              profile=profile,
              config=PersistenceRuntimeConfig(
                  profile=profile,
                  supabase_api_url=api_url,
                  supabase_service_role_key=service_role,
              ),
          )
          try:
              client.initialize()
              books = client.library.list_books(limit=10000)
              fresh_ids = []
              for asset in assets:
                  asset_id = str(asset.get("id") or "")
                  fresh = not bool(asset_freshness_error(existing_books=books, asset=asset))
                  print(f"SOURCE_FRESHNESS asset_id={asset_id} status={'fresh' if fresh else 'already_present'}")
                  if fresh:
                      fresh_ids.append(asset_id)
          except Exception as exc:  # noqa: BLE001
              print(f"PRODUCTION_DB_RESULT status=error error_type={type(exc).__name__}")
              with output.open("a", encoding="utf-8") as handle:
                  handle.write("db_status=error\n")
                  handle.write("fresh_asset=\n")
              raise SystemExit(0)
          finally:
              client.close()

          print("PRODUCTION_DB_RESULT status=ok")
          with output.open("a", encoding="utf-8") as handle:
              handle.write("db_status=ok\n")
              handle.write(f"fresh_asset={fresh_ids[0] if fresh_ids else ''}\n")
          PY

      - name: Check full qualification readiness for first fresh asset
        if: steps.freshness.outputs.fresh_asset != ''
        shell: bash
        env:
          FRESH_ASSET: ${{ steps.freshness.outputs.fresh_asset }}
        run: |
          set +e
          output="$(uv run python -m scripts.check_production_qualification_readiness --asset-id "$FRESH_ASSET" 2>&1)"
          rc=$?
          set -e
          echo "QUALIFICATION_PREFLIGHT asset_id=$FRESH_ASSET exit_code=$rc"
          printf '%s\n' "$output"

      - name: Install AWS CLI for read-only protected-storage diagnostics
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET_NAME != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        run: python -m pip install --upgrade "awscli>=1.34,<2"

      - name: Probe R2 jurisdiction and all manifest assets
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET_NAME != '' && env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != ''
        shell: bash
        run: |
          set -u
          tmp="$RUNNER_TEMP/saga-phase0-protected"
          rm -rf "$tmp"
          mkdir -p "$tmp"

          probe_asset="once-upon-a-broken-heart"
          usable=""
          for jurisdiction in default eu us fedramp; do
            rm -rf "$tmp"/*
            set +e
            uv run python scripts/check_protected_asset_storage.py --asset-id "$probe_asset" --asset-dir "$tmp" --jurisdiction "$jurisdiction" >/dev/null 2>&1
            rc=$?
            set -e
            case "$rc" in
              0) category="object_downloaded" ;;
              20) category="access_failed" ;;
              21) category="object_missing" ;;
              22) category="download_failed" ;;
              23) category="list_parse_failed" ;;
              *) category="other_error_$rc" ;;
            esac
            echo "R2_JURISDICTION_RESULT jurisdiction=$jurisdiction category=$category"
            if [ -z "$usable" ] && { [ "$rc" -eq 0 ] || [ "$rc" -eq 21 ] || [ "$rc" -eq 22 ]; }; then
              usable="$jurisdiction"
            fi
          done

          if [ -z "$usable" ]; then
            echo "R2_PROBE_RESULT status=no_accessible_jurisdiction"
            rm -rf "$tmp"
            exit 0
          fi

          echo "R2_PROBE_RESULT status=accessible jurisdiction=$usable"
          mapfile -t asset_ids < <(uv run python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('docs/operations/protected_assets.manifest.json').read_text(encoding='utf-8'))
          for item in payload.get('assets', []):
              print(item['id'])
          PY
          )

          for asset_id in "${asset_ids[@]}"; do
            rm -rf "$tmp"/*
            set +e
            uv run python scripts/check_protected_asset_storage.py --asset-id "$asset_id" --asset-dir "$tmp" --jurisdiction "$usable" >/dev/null 2>&1
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              set +e
              uv run python scripts/verify_protected_assets.py --asset-dir "$tmp" --asset-id "$asset_id" >/dev/null 2>&1
              verify_rc=$?
              set -e
              if [ "$verify_rc" -eq 0 ]; then
                result="downloaded_hash_valid"
              else
                result="downloaded_hash_invalid"
              fi
            elif [ "$rc" -eq 20 ]; then
              result="access_failed"
            elif [ "$rc" -eq 21 ]; then
              result="object_missing"
            elif [ "$rc" -eq 22 ]; then
              result="download_failed"
            elif [ "$rc" -eq 23 ]; then
              result="list_parse_failed"
            else
              result="other_error_$rc"
            fi
            echo "R2_ASSET_RESULT asset_id=$asset_id result=$result"
          done
          rm -rf "$tmp"

      - name: Note diagnostic boundary
        if: always()
        shell: bash
        run: |
          echo "DIAGNOSTIC_BOUNDARY paid_provider_calls=no protected_artifacts_uploaded=no"
          rm -rf "$RUNNER_TEMP/saga-phase0-protected"
