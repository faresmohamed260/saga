name: Hosted invitation lifecycle proof

on:
  push:
    branches:
      - ops/hosted-invitation-e2e
    paths:
      - .github/workflows/ops-hosted-invitation-e2e.yml

permissions:
  contents: read

jobs:
  invitation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: https://scmeqnpmhomzcwecjdtu.supabase.co
      APP_ORIGIN: https://saga-pi-two.vercel.app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install application and browser dependencies
        working-directory: apps/web
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Exercise real invitation delivery and acceptance
        working-directory: apps/web
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_MANAGEMENT_TOKEN: ${{ secrets.SAGA_RESEND_MANAGEMENT_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';
          import { chromium } from 'playwright';

          const url = process.env.SUPABASE_URL;
          const secretKey = process.env.SUPABASE_SECRET_KEY;
          const resendToken = process.env.RESEND_MANAGEMENT_TOKEN;
          const origin = process.env.APP_ORIGIN;
          assert.ok(url && secretKey && resendToken && origin, 'required hosted configuration missing');

          const suffix = `${Date.now()}-${crypto.randomBytes(3).toString('hex')}`;
          const adminEmail = `saga-e2e-admin-${suffix}@example.com`;
          const inviteeEmail = `faresmohamed260+saga-e2e-${suffix}@gmail.com`;
          const adminPassword = crypto.randomBytes(32).toString('base64url');
          const inviteePassword = crypto.randomBytes(32).toString('base64url');

          const privileged = createClient(url, secretKey, {
            auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
          });

          let adminUserId = null;
          let inviteeUserId = null;
          let browser = null;

          function assertPath(page, expected, message) {
            const actual = new URL(page.url()).pathname;
            assert.equal(actual, expected, message);
          }

          async function findInviteeAuthUser() {
            for (let attempt = 0; attempt < 20; attempt += 1) {
              const { data, error } = await privileged.auth.admin.listUsers({ page: 1, perPage: 1000 });
              assert.ifError(error);
              const match = data.users.find((user) => user.email?.toLowerCase() === inviteeEmail.toLowerCase());
              if (match) return match;
              await new Promise((resolve) => setTimeout(resolve, 500));
            }
            return null;
          }

          async function getDeliveredInviteEmail() {
            for (let attempt = 0; attempt < 45; attempt += 1) {
              const response = await fetch('https://api.resend.com/emails', {
                headers: { Authorization: `Bearer ${resendToken}` },
              });
              assert.equal(response.ok, true, 'Resend sent-email listing failed');
              const list = await response.json();
              const match = (list.data ?? []).find((email) =>
                Array.isArray(email.to) &&
                email.to.some((recipient) => recipient.toLowerCase() === inviteeEmail.toLowerCase()) &&
                email.subject === "You're invited to S.A.G.A."
              );

              if (match) {
                if (['bounced', 'complained'].includes(match.last_event)) {
                  throw new Error(`invitation delivery failed with terminal event ${match.last_event}`);
                }
                if (['delivered', 'opened', 'clicked'].includes(match.last_event)) {
                  return match.id;
                }
              }
              await new Promise((resolve) => setTimeout(resolve, 2000));
            }
            throw new Error('real invitation was not confirmed delivered by Resend');
          }

          async function retrieveInviteUrl(emailId) {
            const response = await fetch(`https://api.resend.com/emails/${emailId}`, {
              headers: { Authorization: `Bearer ${resendToken}` },
            });
            assert.equal(response.ok, true, 'Resend email retrieval failed');
            const email = await response.json();
            const html = typeof email.html === 'string' ? email.html : '';
            const match = html.match(/href=["']([^"']*\/auth\/confirm\?[^"']+)["']/i);
            assert.ok(match, 'rendered invitation has no confirmation link');
            const renderedUrl = match[1].replaceAll('&amp;', '&');
            const parsed = new URL(renderedUrl);
            assert.equal(parsed.origin, origin, 'invitation confirmation origin mismatch');
            assert.equal(parsed.pathname, '/auth/confirm', 'invitation confirmation path mismatch');
            assert.ok(parsed.searchParams.get('token_hash'), 'invitation token_hash missing');
            assert.equal(parsed.searchParams.get('type'), 'invite', 'invitation type mismatch');
            return renderedUrl;
          }

          async function cleanup() {
            await privileged.from('saga_invitations').delete().eq('email_normalized', inviteeEmail.toLowerCase());
            if (inviteeUserId) {
              await privileged.from('saga_account_access').delete().eq('user_id', inviteeUserId);
              await privileged.auth.admin.deleteUser(inviteeUserId);
            } else {
              const invitee = await findInviteeAuthUser().catch(() => null);
              if (invitee?.id) {
                await privileged.from('saga_account_access').delete().eq('user_id', invitee.id);
                await privileged.auth.admin.deleteUser(invitee.id);
              }
            }
            if (adminUserId) {
              await privileged.from('saga_account_access').delete().eq('user_id', adminUserId);
              await privileged.auth.admin.deleteUser(adminUserId);
            }
          }

          try {
            const { data: adminCreated, error: adminCreateError } = await privileged.auth.admin.createUser({
              email: adminEmail,
              password: adminPassword,
              email_confirm: true,
            });
            assert.ifError(adminCreateError);
            assert.ok(adminCreated.user?.id, 'ephemeral admin creation failed');
            adminUserId = adminCreated.user.id;

            const { error: adminAccessError } = await privileged.from('saga_account_access').insert({
              user_id: adminUserId,
              role: 'admin',
              status: 'active',
              accepted_at: new Date().toISOString(),
            });
            assert.ifError(adminAccessError);

            browser = await chromium.launch({ headless: true });
            const adminContext = await browser.newContext();
            const adminPage = await adminContext.newPage();
            await adminPage.goto(`${origin}/sign-in`, { waitUntil: 'networkidle' });
            await adminPage.getByLabel('Email').fill(adminEmail);
            await adminPage.getByLabel('Password').fill(adminPassword);
            await Promise.all([
              adminPage.waitForURL('**/home'),
              adminPage.getByRole('button', { name: 'Sign in' }).click(),
            ]);
            assertPath(adminPage, '/home', 'ephemeral admin UI sign-in failed');

            const inviteResponse = await adminContext.request.post(`${origin}/api/admin/invitations`, {
              data: { email: inviteeEmail, role: 'member' },
            });
            assert.ok([200, 201].includes(inviteResponse.status()), `admin invitation API returned ${inviteResponse.status()}`);
            const inviteResult = await inviteResponse.json();
            assert.equal(inviteResult.delivery, 'sent', 'Supabase invitation delivery was not accepted');
            assert.equal(inviteResult.invitation?.status, 'pending', 'new invitation did not begin pending');

            const inviteeAuth = await findInviteeAuthUser();
            assert.ok(inviteeAuth?.id, 'Supabase invite did not create invitee Auth identity');
            inviteeUserId = inviteeAuth.id;

            const resendEmailId = await getDeliveredInviteEmail();
            const inviteUrl = await retrieveInviteUrl(resendEmailId);

            const inviteeContext = await browser.newContext();
            const inviteePage = await inviteeContext.newPage();
            await inviteePage.goto(inviteUrl, { waitUntil: 'networkidle' });
            assertPath(inviteePage, '/set-password', 'confirmation did not reach set-password');

            await inviteePage.getByLabel('New password').fill(inviteePassword);
            await inviteePage.getByLabel('Confirm password').fill(inviteePassword);
            await Promise.all([
              inviteePage.waitForURL('**/home'),
              inviteePage.getByRole('button', { name: 'Save password' }).click(),
            ]);
            assertPath(inviteePage, '/home', 'password setup did not enter private app');

            const { data: invitationState, error: invitationStateError } = await privileged
              .from('saga_invitations')
              .select('status,accepted_by,accepted_at')
              .eq('email_normalized', inviteeEmail.toLowerCase())
              .single();
            assert.ifError(invitationStateError);
            assert.equal(invitationState.status, 'accepted', 'product invitation was not accepted');
            assert.equal(invitationState.accepted_by, inviteeUserId, 'invitation accepted_by mismatch');
            assert.ok(invitationState.accepted_at, 'invitation accepted_at missing');

            const { data: accountState, error: accountStateError } = await privileged
              .from('saga_account_access')
              .select('role,status')
              .eq('user_id', inviteeUserId)
              .single();
            assert.ifError(accountStateError);
            assert.deepEqual(accountState, { role: 'member', status: 'active' }, 'claimed account state mismatch');

            await inviteeContext.close();

            const laterContext = await browser.newContext();
            const laterPage = await laterContext.newPage();
            await laterPage.goto(`${origin}/sign-in`, { waitUntil: 'networkidle' });
            await laterPage.getByLabel('Email').fill(inviteeEmail);
            await laterPage.getByLabel('Password').fill(inviteePassword);
            await Promise.all([
              laterPage.waitForURL('**/home'),
              laterPage.getByRole('button', { name: 'Sign in' }).click(),
            ]);
            assertPath(laterPage, '/home', 'later password sign-in did not reach private app');

            const { data: finalAuth, error: finalAuthError } = await privileged.auth.admin.getUserById(inviteeUserId);
            assert.ifError(finalAuthError);
            assert.ok(finalAuth.user?.email_confirmed_at, 'accepted invitee email is not confirmed');
            assert.ok(finalAuth.user?.last_sign_in_at, 'later password sign-in was not recorded');

            console.log('Hosted invitation lifecycle proof passed: admin API invite -> real Resend delivery -> /auth/confirm -> product claim -> Set password -> /home -> fresh later sign-in.');
          } finally {
            if (browser) await browser.close().catch(() => undefined);
            await cleanup();
          }
          NODE
