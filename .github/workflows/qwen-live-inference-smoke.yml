name: Qwen Live Inference Smoke

on:
  push:
    branches:
      - studio/qwen-image-edit-2511
    paths:
      - ".github/workflows/qwen-live-inference-smoke.yml"
      - "scripts/qwen_image_edit_smoke.py"
      - "integrations/qwen/qwen_image_edit_2511_app.py"
      - "integrations/qwen/qwen_image_edit_2511_gateway.py"
      - ".github/workflows/modal-worker-provision.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-live-inference-smoke-2511
  cancel-in-progress: true

jobs:
  live-inference:
    name: ${{ matrix.role }}-live-inference
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - role: primary
            gateway: https://voidtrek--saga-qwen-image-edit-2511-gateway-web.modal.run
          - role: standby
            gateway: https://nyxprotocol--saga-qwen-image-edit-2511-gateway-web.modal.run
    env:
      QWEN_GATEWAY: ${{ matrix.gateway }}
      QWEN_ROLE: ${{ matrix.role }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/qwen-image-edit-2511
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Wait for staged Civitai BF16 worker
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          health_url = os.environ['QWEN_GATEWAY'].rstrip('/') + '/health'
          role = os.environ['QWEN_ROLE']
          deadline = time.monotonic() + 5400
          attempts = 0
          last = None
          while time.monotonic() < deadline:
              attempts += 1
              try:
                  with urllib.request.urlopen(health_url, timeout=60) as response:
                      payload = json.load(response)
                  checkpoint = payload.get('checkpoint') or {}
                  acceleration = payload.get('acceleration') or {}
                  worker = payload.get('worker') or {}
                  snapshot = {
                      'role': role,
                      'precision': payload.get('precision'),
                      'checkpointVersionId': checkpoint.get('version_id'),
                      'acceleration': acceleration.get('type'),
                      'defaultSteps': acceleration.get('default_steps'),
                      'workerState': worker.get('state'),
                      'workerPrecision': worker.get('precision'),
                      'workerCheckpointVersionId': worker.get('checkpoint_version_id'),
                      'workerAcceleration': worker.get('acceleration'),
                      'workerAssetsCached': worker.get('assets_cached'),
                  }
                  if snapshot != last:
                      print(json.dumps({'event': 'qwen-deployment-wait', 'attempt': attempts, **snapshot}), flush=True)
                      last = snapshot
                  if (
                      payload.get('ready') is True
                      and payload.get('precision') == 'civitai-bfloat16'
                      and checkpoint.get('version_id') == 2553500
                      and acceleration.get('type') == 'lightning-lora'
                      and acceleration.get('default_steps') == 4
                      and worker.get('precision') == 'civitai-bfloat16'
                      and worker.get('checkpoint_version_id') == 2553500
                      and worker.get('acceleration') == 'lightning-lora-4step-bf16'
                      and worker.get('assets_cached') is True
                      and worker.get('state') in {'sleeping', 'ready'}
                  ):
                      print(json.dumps({'event': 'qwen-deployment-ready', 'attempts': attempts, **snapshot}), flush=True)
                      break
              except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                  print(json.dumps({'event': 'qwen-deployment-wait-error', 'attempt': attempts, 'role': role, 'error': str(exc)}), flush=True)
              time.sleep(15)
          else:
              raise SystemExit(f'Qwen {role} worker did not become staged and ready within 5400s; last={last}')
          PY
      - name: Run pinned Civitai BF16 Qwen edit through live worker
        run: >-
          python scripts/qwen_image_edit_smoke.py
          "$QWEN_GATEWAY"
          --timeout 4800
          --max-inference-seconds 300
