name: Qwen Live Inference Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qwen-live-inference-smoke-2511
  cancel-in-progress: false

jobs:
  live-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run pinned Qwen edit on registered primary and standby
        shell: bash
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          payload = json.loads(Path('config/modal-worker-registry.json').read_text(encoding='utf-8'))
          workers = [w for w in payload.get('workers', []) if w.get('enabled', True) and w.get('ecosystem') == 'qwen-image-edit-2511']
          workers.sort(key=lambda w: (0 if w.get('role') == 'primary' else 1, int(w.get('order') or 0)))
          if len(workers) != 2 or {w.get('role') for w in workers} != {'primary', 'standby'}:
              raise SystemExit(f'Expected Qwen primary + standby registry entries, found {workers}')
          for worker in workers:
              print(json.dumps({'event': 'qwen-live-smoke-start', 'worker': worker['id'], 'role': worker['role']}), flush=True)
              subprocess.run([
                  sys.executable,
                  'scripts/qwen_image_edit_smoke.py',
                  worker['gatewayUrl'],
                  '--timeout', '4800',
                  '--max-inference-seconds', '300',
              ], check=True)
          PY
