name: V3 Nominal Span Candidate Qualification

on:
  push:
    branches:
      - v3/qualification-nominal-span-candidates

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout S.A.G.A.
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned syntax challenger
        shell: bash
        run: |
          python -m pip install "spacy==3.8.16"
          python -m pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Profile candidate generators
        run: >-
          python -m scripts.run_v3_nominal_span_candidate_profile
          --root external/litbank
          --out evaluation-artifacts/v3-nominal-span-candidates.json
          --limit 100
          --model en_core_web_sm

      - name: Publish summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("evaluation-artifacts/v3-nominal-span-candidates.json").read_text())
          print("## V3 nominal span candidate generators")
          print()
          print("| Profile | Candidates | × noun-chunk | Exact recall | Exact matches |")
          print("|---|---:|---:|---:|---:|")
          for row in r["results"]:
              print(f"| {row['profile']} | {row['candidateCount']} | {row['candidateMultiplierVsNounChunk']:.2f} | {row['exactRecall']:.4f} | {row['exactMatches']} |")
          print()
          print(f"- Runtime: {r['runtimeSeconds']:.2f}s")
          PY

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: saga-v3-nominal-span-candidates-${{ github.sha }}
          path: evaluation-artifacts/v3-nominal-span-candidates.json
          if-no-files-found: error
          retention-days: 90
