name: Iteration 12 Visual Fix

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/iteration12_visual_fix.py"
      - ".github/workflows/iteration12-visual-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Iteration 12 finalization patch
        run: python scripts/iteration12_visual_fix.py
      - name: Commit finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/scripts/capture-video-output-preview.mjs docs/studio-ui-polish-checklist.md
          if git diff --cached --quiet; then
            echo "No Iteration 12 finalization changes to commit"
            exit 0
          fi
          git commit -m "docs: complete Iteration 12 lifecycle feedback"
          git push origin HEAD:studio/video-gallery-ux
