name: Iteration 30 Rounding Fix

on:
  push:
    branches:
      - studio/video-gallery-ux
    paths:
      - .github/iteration30-rounding-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux

      - name: Align runtime and Studio odd-pixel rounding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('integrations/comfyui/ltx23_app.py')
          text = runtime.read_text()
          old = '''def _even(value: float) -> int:\n    return max(2, int(round(float(value) / 2.0)) * 2)\n'''
          new = '''def _even(value: float) -> int:\n    # Delivery dimensions are positive. Use explicit half-up rounding so exact\n    # odd-pixel ties match JavaScript Math.round in Studio instead of Python's\n    # bankers rounding (for example 481px -> 482px, not 480px).\n    return max(2, int(math.floor(float(value) / 2.0 + 0.5)) * 2)\n'''
          if old not in text:
              raise SystemExit('runtime _even anchor missing')
          runtime.write_text(text.replace(old, new, 1))

          contract = Path('apps/studio/scripts/check-resolution-contract.mjs')
          text = contract.read_text()
          old = "const oddReferenceAspects = ['1179:2556', '2556:1179', '1001:777', '777:1001'];"
          new = "const oddReferenceAspects = ['1179:2556', '2556:1179', '1001:777', '777:1001', '481:480', '480:481'];"
          if old not in text:
              raise SystemExit('contract odd-reference anchor missing')
          contract.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add integrations/comfyui/ltx23_app.py apps/studio/scripts/check-resolution-contract.mjs
          git diff --cached --check
          git commit -m "fix(video): align odd reference delivery rounding"
          git push origin HEAD:studio/video-gallery-ux
