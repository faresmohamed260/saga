name: Modal Project Ownership Audit

on:
  push:
    branches:
      - audit/modal-project-ownership-20260913
    paths:
      - .github/workflows/modal-project-ownership-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Modal SDK
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Resolve recovered LTX gateway URLs
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          targets = {"modal-01", "modal-02"}
          raw = os.environ.get("SAGA_MODAL_TOKENS_JSON", "").strip()
          payload = json.loads(raw)
          rows = payload.get("accounts") or payload.get("tokens") or payload.get("roster") or [] if isinstance(payload, dict) else payload
          findings = []
          for index, row in enumerate(rows, start=1):
              if not isinstance(row, dict):
                  continue
              label = str(row.get("label") or row.get("name") or row.get("account") or f"modal-{index:02d}").strip()
              if label not in targets:
                  continue
              token_id = str(row.get("token_id") or "").strip()
              token_secret = str(row.get("token_secret") or "").strip()
              combined = str(row.get("api_key") or row.get("token") or "").strip()
              if (not token_id or not token_secret) and "." in combined:
                  token_id, token_secret = combined.split(".", 1)
              env = dict(os.environ)
              env["MODAL_TOKEN_ID"] = token_id
              env["MODAL_TOKEN_SECRET"] = token_secret
              code = "import modal; print(modal.Function.from_name('saga-ltx25-gateway','web').get_web_url())"
              result = subprocess.run(["python", "-c", code], env=env, text=True, capture_output=True, timeout=60)
              findings.append({
                  "label": label,
                  "tokenFingerprint": hashlib.sha256(token_id.encode()).hexdigest()[:12],
                  "gatewayUrl": (result.stdout or "").strip().splitlines()[-1] if result.returncode == 0 and (result.stdout or "").strip() else None,
                  "state": "resolved" if result.returncode == 0 else "unavailable",
              })
          Path("modal-project-ownership-audit.json").write_text(json.dumps({"ltxRecovered": findings}, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"labels": [row["label"] for row in findings], "resolved": sum(row["state"] == "resolved" for row in findings)}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: modal-project-ownership-audit
          path: modal-project-ownership-audit.json
          if-no-files-found: error
          retention-days: 1
