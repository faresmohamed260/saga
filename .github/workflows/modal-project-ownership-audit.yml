name: Modal Project Ownership Audit

on:
  push:
    branches:
      - audit/modal-project-ownership-20260913
    paths:
      - .github/workflows/modal-project-ownership-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Resolve project apps across the roster
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          raw = os.environ.get("SAGA_MODAL_TOKENS_JSON", "").strip()
          if not raw:
              raise SystemExit("SAGA_MODAL_TOKENS_JSON is not configured")
          payload = json.loads(raw)
          rows = payload.get("accounts") or payload.get("tokens") or payload.get("roster") or [] if isinstance(payload, dict) else payload
          if not isinstance(rows, list):
              raise SystemExit("Modal roster must be a list")

          findings = []
          for index, row in enumerate(rows, start=1):
              if not isinstance(row, dict):
                  continue
              label = str(row.get("label") or row.get("name") or row.get("account") or f"modal-{index:02d}").strip()
              token_id = str(row.get("token_id") or "").strip()
              token_secret = str(row.get("token_secret") or "").strip()
              combined = str(row.get("api_key") or row.get("token") or "").strip()
              if (not token_id or not token_secret) and "." in combined:
                  token_id, token_secret = combined.split(".", 1)
              if not token_id or not token_secret:
                  continue

              env = dict(os.environ)
              env["MODAL_TOKEN_ID"] = token_id
              env["MODAL_TOKEN_SECRET"] = token_secret
              result = subprocess.run(
                  ["modal", "app", "list", "--json"],
                  env=env,
                  text=True,
                  capture_output=True,
                  timeout=60,
              )
              if result.returncode != 0:
                  continue
              try:
                  apps = json.loads(result.stdout or "[]")
              except json.JSONDecodeError:
                  continue
              matched = []
              if isinstance(apps, list):
                  for app in apps:
                      if not isinstance(app, dict):
                          continue
                      description = str(app.get("Description") or app.get("description") or app.get("Name") or app.get("name") or "").strip()
                      lowered = description.lower()
                      if description and ("saga" in lowered or "renderlab" in lowered):
                          matched.append({
                              "description": description,
                              "state": app.get("State") or app.get("state"),
                              "tasks": app.get("Tasks") or app.get("tasks"),
                          })
              if matched:
                  findings.append({
                      "label": label,
                      "tokenFingerprint": hashlib.sha256(token_id.encode()).hexdigest()[:12],
                      "apps": matched,
                  })

          Path("modal-project-ownership-audit.json").write_text(
              json.dumps({"relevantAccounts": findings, "rosterEntries": len(rows)}, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({"relevantAccountLabels": [row["label"] for row in findings], "rosterEntries": len(rows)}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: modal-project-ownership-audit
          path: modal-project-ownership-audit.json
          if-no-files-found: error
          retention-days: 1
