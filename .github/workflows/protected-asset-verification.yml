name: Protected Asset Verification

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: "Protected asset id from docs/operations/protected_assets.manifest.json, or all"
        required: true
        default: "once-upon-a-broken-heart"
      r2_jurisdiction:
        description: "Cloudflare R2 bucket jurisdiction endpoint"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - eu
          - us
          - fedramp

permissions:
  contents: read

concurrency:
  group: protected-asset-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required R2 secrets are present
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
      - name: Install AWS CLI
        run: python -m pip install --upgrade "awscli>=1.34,<2"
      - name: Diagnose protected storage and download selected assets
        env:
          ASSET_ID: ${{ inputs.asset_id }}
          R2_JURISDICTION: ${{ inputs.r2_jurisdiction }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saga-protected-assets"
          python scripts/check_protected_asset_storage.py \
            --asset-id "$ASSET_ID" \
            --asset-dir "$RUNNER_TEMP/saga-protected-assets" \
            --jurisdiction "$R2_JURISDICTION"
      - name: Verify protected asset hashes
        env:
          ASSET_ID: ${{ inputs.asset_id }}
        run: |
          set -euo pipefail
          if [ "$ASSET_ID" = "all" ]; then
            python scripts/verify_protected_assets.py \
              --asset-dir "$RUNNER_TEMP/saga-protected-assets"
          else
            python scripts/verify_protected_assets.py \
              --asset-dir "$RUNNER_TEMP/saga-protected-assets" \
              --asset-id "$ASSET_ID"
          fi
      - name: Remove protected asset bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/saga-protected-assets"
