name: Protected Asset Verification

on:
  workflow_dispatch:
    inputs:
      asset_id:
        description: "Protected asset id from docs/operations/protected_assets.manifest.json, or all"
        required: true
        default: "once-upon-a-broken-heart"
      r2_jurisdiction:
        description: "Cloudflare R2 bucket jurisdiction endpoint"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - eu
          - us
          - fedramp

permissions:
  contents: read

concurrency:
  group: protected-asset-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required R2 secrets are present
        run: |
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_BUCKET_NAME"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
      - name: Install AWS CLI
        run: python -m pip install --upgrade "awscli>=1.34,<2"
      - name: Resolve R2 endpoint
        id: r2
        shell: bash
        env:
          R2_JURISDICTION: ${{ inputs.r2_jurisdiction }}
        run: |
          set -euo pipefail
          case "$R2_JURISDICTION" in
            default)
              endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              ;;
            eu|us|fedramp)
              endpoint="https://${R2_ACCOUNT_ID}.${R2_JURISDICTION}.r2.cloudflarestorage.com"
              ;;
            *)
              echo "::error title=Unsupported R2 jurisdiction::Expected default, eu, us, or fedramp."
              exit 10
              ;;
          esac
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
      - name: Check protected storage visibility and download assets
        shell: bash
        env:
          ASSET_ID: ${{ inputs.asset_id }}
          R2_ENDPOINT: ${{ steps.r2.outputs.endpoint }}
          R2_JURISDICTION: ${{ inputs.r2_jurisdiction }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saga-protected-assets"
          python - <<'PY' > "$RUNNER_TEMP/assets.tsv"
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("docs/operations/protected_assets.manifest.json").read_text(encoding="utf-8"))
          requested = os.environ["ASSET_ID"]
          for asset in manifest["assets"]:
              if requested != "all" and asset["id"] != requested:
                  continue
              print(f"{asset['object_key']}\t{asset['filename']}")
          PY
          if ! test -s "$RUNNER_TEMP/assets.tsv"; then
            echo "::error title=Unknown protected asset::No manifest entry matched asset_id=${ASSET_ID}."
            exit 11
          fi

          while IFS=$'\t' read -r object_key filename; do
            listing="$RUNNER_TEMP/r2-listing.json"
            listing_error="$RUNNER_TEMP/r2-listing.err"
            if ! aws s3api list-objects-v2 \
              --bucket "$R2_BUCKET_NAME" \
              --prefix "$object_key" \
              --max-keys 16 \
              --endpoint-url "$R2_ENDPOINT" \
              --output json > "$listing" 2> "$listing_error"; then
              echo "::error title=R2 bucket/prefix access failed::The configured credentials could not list the protected-asset prefix using jurisdiction '${R2_JURISDICTION}'. Verify the account ID, bucket name, jurisdiction, token bucket scope, and Object Read permission."
              exit 20
            fi

            OBJECT_KEY="$object_key" LISTING_PATH="$listing" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["LISTING_PATH"]).read_text(encoding="utf-8"))
          expected = os.environ["OBJECT_KEY"]
          keys = [str(item.get("Key") or "") for item in payload.get("Contents") or []]
          if expected not in keys:
              raise SystemExit(21)
          PY
            status=$?
            if [ "$status" -eq 21 ]; then
              echo "::error title=Protected asset object missing::R2 access succeeded, but the manifest object is not present at the configured key. Migrate/upload the protected asset bytes to the private bucket path recorded in docs/operations/protected_assets.manifest.json."
              exit 21
            elif [ "$status" -ne 0 ]; then
              echo "::error title=Protected asset listing parse failed::Unable to validate the R2 listing response."
              exit "$status"
            fi

            if ! aws s3 cp \
              "s3://${R2_BUCKET_NAME}/${object_key}" \
              "$RUNNER_TEMP/saga-protected-assets/${filename}" \
              --endpoint-url "$R2_ENDPOINT" \
              --no-progress; then
              echo "::error title=Protected asset download failed::The object was visible to ListObjectsV2 but could not be downloaded. Verify GetObject permission and object availability."
              exit 22
            fi
          done < "$RUNNER_TEMP/assets.tsv"

          if [ "$ASSET_ID" = "all" ]; then
            python scripts/verify_protected_assets.py --asset-dir "$RUNNER_TEMP/saga-protected-assets"
          else
            python scripts/verify_protected_assets.py --asset-dir "$RUNNER_TEMP/saga-protected-assets" --asset-id "$ASSET_ID"
          fi
      - name: Remove protected asset bytes
        if: always()
        run: rm -rf "$RUNNER_TEMP/saga-protected-assets" "$RUNNER_TEMP/r2-listing.json" "$RUNNER_TEMP/r2-listing.err" "$RUNNER_TEMP/assets.tsv"
