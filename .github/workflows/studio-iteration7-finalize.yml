name: Studio Iteration 7 Finalize

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/studio-iteration7-finalize.yml"
      - "apps/studio/scripts/iteration7_finalize.py"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0

      - name: Finalize Iteration 7 durable documentation
        run: python apps/studio/scripts/iteration7_finalize.py

      - name: Commit final documentation
        shell: bash
        run: |
          set -euo pipefail
          git add docs/studio-ui-polish-checklist.md docs/studio-ui-polish-iteration-brief.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete unified Video Aspect iteration"
          git push origin HEAD:studio/video-gallery-ux
