name: Verify Resend domain through Cloudflare DNS

on:
  push:
    branches:
      - "ops/supabase-auth-config-2026-09-11"
    paths:
      - ".github/workflows/ops-cloudflare-resend-dns.yml"

permissions:
  contents: read

jobs:
  verify-resend-domain:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_ZONE: faresuniform.uk
      RESEND_DOMAIN: mail.saga.faresuniform.uk
      RESEND_DKIM_NAME: resend._domainkey.mail.saga.faresuniform.uk
      RESEND_DKIM_VALUE: p=MIGfMA0GCSqGSIb3DQEBAQUAA4GNADCBiQKBgQC4gTe7UXkCiS6cfbcHgK5EPL878Nf7fFsHFQi6ZW74Jhe7WfAbPeEYWJ6yoZ+mCpbvvYvyYoudS8kJxQG41T8T/nk8KaadR0rVQFMA2dWALLKiwqAPB7JTvhN9r9ThyVHro4kfqlFayQPi816O3MuA+svKQpNXYWF23NgVDHDZxwIDAQAB
      RESEND_RETURN_PATH_NAME: send.mail.saga.faresuniform.uk
      RESEND_RETURN_PATH_MX: feedback-smtp.eu-west-1.amazonses.com
      RESEND_RETURN_PATH_SPF: v=spf1 include:amazonses.com ~all
      RESEND_TRACKING_NAME: rsend.mail.saga.faresuniform.uk
      RESEND_TRACKING_TARGET: send.forge.rmta.net

    steps:
      - name: Verify DNS and Resend management credentials are available
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SAGA_CLOUDFLARE_DNS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.SAGA_RESEND_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" ]] || { echo "::error title=Missing Cloudflare token::SAGA_CLOUDFLARE_DNS_TOKEN is unavailable."; exit 1; }
          [[ -n "${RESEND_API_KEY:-}" ]] || { echo "::error title=Missing Resend token::SAGA_RESEND_MANAGEMENT_TOKEN is unavailable."; exit 1; }

      - name: Resolve exactly one Cloudflare zone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SAGA_CLOUDFLARE_DNS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --get \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --data-urlencode "name=${CLOUDFLARE_ZONE}" \
            "https://api.cloudflare.com/client/v4/zones" > zones.json

          jq -e '.success == true' zones.json >/dev/null
          count="$(jq '.result | length' zones.json)"
          [[ "${count}" == "1" ]] || { echo "::error title=Unexpected Cloudflare zone scope::Expected exactly one ${CLOUDFLARE_ZONE} zone, got ${count}."; exit 1; }

          zone_id="$(jq -r '.result[0].id' zones.json)"
          [[ -n "${zone_id}" && "${zone_id}" != "null" ]] || { echo "::error title=Missing Cloudflare zone ID::Could not resolve zone ID."; exit 1; }
          echo "CLOUDFLARE_ZONE_ID=${zone_id}" >> "${GITHUB_ENV}"
          echo "Resolved Cloudflare zone ${CLOUDFLARE_ZONE}."

      - name: Upsert only the Resend DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SAGA_CLOUDFLARE_DNS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records"

          upsert_record() {
            local type="$1"
            local name="$2"
            local content="$3"
            local priority="${4:-}"
            local lookup_file="lookup-${type}-${RANDOM}.json"
            local payload_file="payload-${type}-${RANDOM}.json"
            local response_file="response-${type}-${RANDOM}.json"

            curl --fail-with-body --silent --show-error --get \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data-urlencode "type=${type}" \
              --data-urlencode "name=${name}" \
              "${api}" > "${lookup_file}"

            jq -e '.success == true' "${lookup_file}" >/dev/null
            local count
            count="$(jq '.result | length' "${lookup_file}")"
            if [[ "${count}" -gt 1 ]]; then
              echo "::error title=Ambiguous existing DNS state::Found ${count} ${type} records for ${name}; refusing to choose one."
              exit 1
            fi

            if [[ "${type}" == "MX" ]]; then
              jq -n --arg type "${type}" --arg name "${name}" --arg content "${content}" --argjson priority "${priority}" \
                '{type:$type,name:$name,content:$content,ttl:1,priority:$priority}' > "${payload_file}"
            elif [[ "${type}" == "CNAME" ]]; then
              jq -n --arg type "${type}" --arg name "${name}" --arg content "${content}" \
                '{type:$type,name:$name,content:$content,ttl:1,proxied:false}' > "${payload_file}"
            else
              jq -n --arg type "${type}" --arg name "${name}" --arg content "${content}" \
                '{type:$type,name:$name,content:$content,ttl:1}' > "${payload_file}"
            fi

            if [[ "${count}" == "1" ]]; then
              local record_id
              record_id="$(jq -r '.result[0].id' "${lookup_file}")"
              status="$(curl --silent --show-error \
                --request PUT \
                --output "${response_file}" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header 'Content-Type: application/json' \
                --data @"${payload_file}" \
                "${api}/${record_id}")"
            else
              status="$(curl --silent --show-error \
                --request POST \
                --output "${response_file}" \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                --header 'Content-Type: application/json' \
                --data @"${payload_file}" \
                "${api}")"
            fi

            if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
              message="$(jq -r '.errors[0].message // .messages[0].message // "Cloudflare DNS mutation failed"' "${response_file}" 2>/dev/null || true)"
              echo "::error title=Cloudflare DNS mutation failed::HTTP ${status}: ${message}"
              exit 1
            fi
            jq -e '.success == true' "${response_file}" >/dev/null
            echo "Upserted ${type} ${name}."
          }

          upsert_record TXT "${RESEND_DKIM_NAME}" "${RESEND_DKIM_VALUE}"
          upsert_record MX "${RESEND_RETURN_PATH_NAME}" "${RESEND_RETURN_PATH_MX}" 10
          upsert_record TXT "${RESEND_RETURN_PATH_NAME}" "${RESEND_RETURN_PATH_SPF}"
          upsert_record CNAME "${RESEND_TRACKING_NAME}" "${RESEND_TRACKING_TARGET}"

      - name: Verify the four Cloudflare records exactly
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.SAGA_CLOUDFLARE_DNS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/dns_records"

          check_record() {
            local type="$1"
            local name="$2"
            local expected="$3"
            local expected_priority="${4:-}"
            local file="check-${type}-${RANDOM}.json"
            curl --fail-with-body --silent --show-error --get \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              --data-urlencode "type=${type}" \
              --data-urlencode "name=${name}" \
              "${api}" > "${file}"
            jq -e '.success == true and (.result | length) == 1' "${file}" >/dev/null
            jq -e --arg expected "${expected}" '.result[0].content == $expected' "${file}" >/dev/null
            if [[ -n "${expected_priority}" ]]; then
              jq -e --argjson expected_priority "${expected_priority}" '.result[0].priority == $expected_priority' "${file}" >/dev/null
            fi
          }

          check_record TXT "${RESEND_DKIM_NAME}" "${RESEND_DKIM_VALUE}"
          check_record MX "${RESEND_RETURN_PATH_NAME}" "${RESEND_RETURN_PATH_MX}" 10
          check_record TXT "${RESEND_RETURN_PATH_NAME}" "${RESEND_RETURN_PATH_SPF}"
          check_record CNAME "${RESEND_TRACKING_NAME}" "${RESEND_TRACKING_TARGET}"
          echo "Cloudflare contains exactly the four required Resend DNS records."

      - name: Trigger Resend verification and wait for verified state
        env:
          RESEND_API_KEY: ${{ secrets.SAGA_RESEND_MANAGEMENT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            "https://api.resend.com/domains?limit=100" > domains.json
          domain_id="$(jq -r --arg name "${RESEND_DOMAIN}" '.data[]? | select(.name == $name) | .id' domains.json | head -n1)"
          [[ -n "${domain_id}" ]] || { echo "::error title=Missing Resend domain::${RESEND_DOMAIN} was not found."; exit 1; }

          status="$(curl --silent --show-error \
            --request POST \
            --output verify-response.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${RESEND_API_KEY}" \
            "https://api.resend.com/domains/${domain_id}/verify")"
          if [[ "${status}" -lt 200 || "${status}" -ge 300 ]]; then
            message="$(jq -r '.message // .error // "Resend verification trigger failed"' verify-response.json 2>/dev/null || true)"
            echo "::error title=Unable to trigger Resend verification::HTTP ${status}: ${message}"
            exit 1
          fi

          for attempt in $(seq 1 30); do
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${RESEND_API_KEY}" \
              "https://api.resend.com/domains/${domain_id}" > domain-status.json
            domain_status="$(jq -r '.status' domain-status.json)"
            echo "Resend verification attempt ${attempt}: ${domain_status}"
            if [[ "${domain_status}" == "verified" ]]; then
              jq '{name,status,region,records:[.records[]? | {record,type,status}]}' domain-status.json
              echo "Resend domain ${RESEND_DOMAIN} is verified."
              exit 0
            fi
            if [[ "${domain_status}" == "failed" ]]; then
              jq '{name,status,region,records:[.records[]? | {record,type,status}]}' domain-status.json
              echo "::error title=Resend domain verification failed::Resend reported failed verification."
              exit 1
            fi
            sleep 10
          done

          jq '{name,status,region,records:[.records[]? | {record,type,status}]}' domain-status.json
          echo "::error title=Resend verification timed out::DNS records are present in Cloudflare but Resend did not reach verified state within five minutes."
          exit 1
