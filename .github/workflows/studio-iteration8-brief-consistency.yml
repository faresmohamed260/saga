name: Studio Iteration 8 Handoff Consistency

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Fix durable handoff baseline
        run: python apps/studio/scripts/iteration8_brief_consistency.py

      - name: Commit handoff consistency and self-clean
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-ui-polish-iteration-brief.md
          git rm -f apps/studio/scripts/iteration8_brief_consistency.py .github/workflows/studio-iteration8-brief-consistency.yml
          git commit -m "docs(studio): keep iteration 8 handoff consistent"
          git push origin HEAD:${{ github.head_ref }}
