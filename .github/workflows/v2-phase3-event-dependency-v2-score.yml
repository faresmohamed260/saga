name: Phase 3 event dependency grounding v2 scorer

on:
  workflow_dispatch:
  push:
    branches:
      - v2/phase-3a-event-dependency-grounding
    paths:
      - ".github/workflows/v2-phase3-event-dependency-v2-score.yml"
      - "services/analysis-worker/src/evaluation/event-dependency-grounding.ts"
      - "services/analysis-worker/src/evaluation/event-dependency-litbank-v2-cli.ts"
      - "services/analysis-worker/src/evaluation/litbank-oracle-section-alignment.ts"
      - "services/analysis-worker/tests/event-dependency-grounding.test.ts"
      - "services/analysis-worker/tests/litbank-oracle-section-alignment.test.ts"

permissions:
  contents: read
  actions: read

concurrency:
  group: saga-phase3-event-dependency-v2-score
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/analysis-worker

    steps:
      - name: Checkout exact S.A.G.A. source
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank corpus
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Reuse preserved pinned BookNLP native outputs
        uses: actions/download-artifact@v4
        with:
          name: saga-phase3-booknlp-native-output-f77af8bcab488fd1069e9c6e8ed4970842c78692
          path: services/analysis-worker/evaluation-artifacts/booknlp-output
          github-token: ${{ github.token }}
          repository: faresmohamed260/saga
          run-id: 34727310506

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/analysis-worker/package.json

      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck corrected dependency grounding
        run: npm run typecheck

      - name: Run deterministic and model-light tests
        run: npm test

      - name: Score corrected dependency grounding without rerunning BookNLP
        run: >-
          npx tsx src/evaluation/event-dependency-litbank-v2-cli.ts
          --litbank-root ../../external/litbank
          --booknlp-root evaluation-artifacts/booknlp-output
          --out evaluation-artifacts/event-dependency-litbank-v2.json

      - name: Publish corrected grounding diagnostic summary
        shell: bash
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/event-dependency-litbank-v2.json", "utf8"));
          const t = report.triggerEvaluation.triggerDetection;
          const g = report.groundingCoverage;
          console.log("## Phase 3 event dependency grounding v2 diagnostic");
          console.log("");
          console.log(`- LitBank attempted/completed/failed: ${report.dataset.attemptedDocumentCount}/${report.dataset.completedDocumentCount}/${report.dataset.failedDocumentCount}`);
          console.log(`- Reused BookNLP inference from run: ${report.sourceEvidence.sourceRunId}`);
          console.log(`- Native artifact SHA-256: ${report.sourceEvidence.nativeArtifactSha256}`);
          console.log(`- event trigger P/R/F1: ${t.precision.toFixed(4)} / ${t.recall.toFixed(4)} / ${t.f1.toFixed(4)}`);
          console.log(`- events with any grounded participant: ${g.eventWithAnyParticipant} (${g.eventWithAnyParticipantRate.toFixed(4)})`);
          console.log(`- events with actor: ${g.eventWithActor} (${g.eventWithActorRate.toFixed(4)})`);
          console.log(`- events with patient: ${g.eventWithPatient} (${g.eventWithPatientRate.toFixed(4)})`);
          console.log(`- events with both: ${g.eventWithActorAndPatient} (${g.eventWithActorAndPatientRate.toFixed(4)})`);
          console.log(`- actor assignments / patient assignments: ${g.actorAssignments} / ${g.patientAssignments}`);
          console.log(`- actor syntax opportunity events: ${g.actorSyntaxOpportunityEvents}`);
          console.log(`- patient syntax opportunity events: ${g.patientSyntaxOpportunityEvents}`);
          console.log(`- actor opportunity grounding yield: ${g.actorOpportunityGroundingYield.toFixed(4)}`);
          console.log(`- patient opportunity grounding yield: ${g.patientOpportunityGroundingYield.toFixed(4)}`);
          console.log("");
          console.log(`- corrected failure: ${report.correctedDiagnostic.failureMode}`);
          console.log(`- correction: ${report.correctedDiagnostic.correction}`);
          console.log("");
          console.log(`> ${report.caveat}`);
          console.log("");
          console.log(`- report fingerprint: \`${report.reportFingerprint}\``);
          EOF

      - name: Upload corrected grounding diagnostic evidence
        uses: actions/upload-artifact@v4
        with:
          name: saga-phase3-event-dependency-v2-score
          path: services/analysis-worker/evaluation-artifacts/event-dependency-litbank-v2.json
          if-no-files-found: error
          retention-days: 90
