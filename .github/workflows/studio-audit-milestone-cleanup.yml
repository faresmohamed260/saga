name: Studio Audit Milestone Cleanup

on:
  push:
    branches: [studio/advanced-ui-audit]
    paths:
      - .github/workflows/studio-audit-milestone-cleanup.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/advanced-ui-audit
          fetch-depth: 0
      - name: Apply remaining audit cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path); text = p.read_text()
              if old not in text:
                  raise SystemExit(f'missing anchor in {path}: {old[:80]!r}')
              p.write_text(text.replace(old, new, count))

          app='apps/studio/src/app/App.jsx'
          replace(app, "  const [outputs, setOutputs] = useState(4);\n", "")
          replace(app, "  const [workflowId, setWorkflowId] = useState('flux2-klein-image-edit');\n  const [modelId, setModelId] = useState('flux2-klein-9b');\n", "")
          replace(app, "    return [...sessionItems, ...favoriteFallback].slice(0, mode === 'Edit' ? 4 : outputs);\n  }, [items, favoriteItems, mode, outputs]);",
                       "    return [...sessionItems, ...favoriteFallback].slice(0, mode === 'Edit' ? 4 : 8);\n  }, [items, favoriteItems, mode]);")
          replace(app, "      setWorkflowId(preset.workflowId);\n      setModelId(preset.modelId);\n", "")
          replace(app, "    section, setSection, setMode, setPrompt, setSeed, setSteps, setCfg, setWorkflowId, setModelId,\n",
                       "    section, setSection, setMode, setPrompt, setSeed, setSteps, setCfg,\n")
          replace(app, "      setWorkflowId('flux2-klein-image-edit');\n      setModelId('flux2-klein-9b');\n", "")
          replace(app, "aspect={aspect} setAspect={setAspect} imageResolution={imageResolution} setImageResolution={setImageResolution} outputs={outputs} setOutputs={setOutputs}",
                       "aspect={aspect} setAspect={setAspect} imageResolution={imageResolution} setImageResolution={setImageResolution}")
          replace(app, "workflowId={workflowId} setWorkflowId={setWorkflowId} modelId={modelId} setModelId={setModelId} ", "")

          media='apps/studio/src/hooks/useMediaActions.js'
          replace(media, "  section, setSection, setMode, setPrompt, setSeed, setSteps, setCfg, setWorkflowId, setModelId,\n",
                         "  section, setSection, setMode, setPrompt, setSeed, setSteps, setCfg,\n")
          replace(media, "    if (item.kind === 'video') { setMode('Video'); setSteps(11); setCfg(1); setWorkflowId('ltx25-redgraft-video'); setModelId('ltx25-redgraft'); }\n    else if (item.mode === 'edit') { setMode('Edit'); setSteps(4); setCfg(1); setWorkflowId('flux2-klein-image-edit'); setModelId('flux2-klein-9b'); }",
                         "    if (item.kind === 'video') { setMode('Video'); setSteps(11); setCfg(1); }\n    else if (item.mode === 'edit') { setMode('Edit'); setSteps(4); setCfg(1); }")
          replace(media, "      setSteps(4); setCfg(1); setWorkflowId('flux2-klein-image-edit'); setModelId('flux2-klein-9b');\n",
                         "      setSteps(4); setCfg(1);\n")

          controls='apps/studio/src/create-controls.jsx'
          replace(controls, "  open, onClose, anchorRef, mode, outputs, setOutputs, seed, setSeed, steps, setSteps,\n  cfg, setCfg, negativePrompt, setNegativePrompt, workflowId, setWorkflowId, modelId, setModelId,\n",
                           "  open, onClose, anchorRef, mode, seed, setSeed, steps, setSteps,\n  cfg, setCfg, negativePrompt, setNegativePrompt,\n")
          replace(controls, "                setWorkflowId(preset.workflowId);\n                setModelId(preset.modelId);\n", "")
          replace(controls, "  aspect, setAspect, imageResolution, setImageResolution, outputs, setOutputs,\n",
                           "  aspect, setAspect, imageResolution, setImageResolution,\n")
          replace(controls, "  workflowId, setWorkflowId, modelId, setModelId, settingsOpen, setSettingsOpen, autoEditInfo,\n",
                           "  settingsOpen, setSettingsOpen, autoEditInfo,\n")
          replace(controls, "      if ([1, 2, 4].includes(Number(saved.outputs))) setOutputs(Number(saved.outputs));\n", "")
          replace(controls, "      if (typeof saved.workflowId === 'string') setWorkflowId(saved.workflowId);\n      if (typeof saved.modelId === 'string') setModelId(saved.modelId);\n", "")
          replace(controls, "      outputs: Number(outputs),\n", "")
          replace(controls, "      workflowId: isEdit ? 'default-image' : workflowId,\n      modelId: isEdit ? 'saga-image-auto' : modelId,\n", "")
          replace(controls, "    preferencesReady, mode, isEdit, aspect, imageResolution, outputs, seed, steps, cfg, negativePrompt,\n    workflowId, modelId, editAuto, videoResolution, videoDuration, videoAudio,\n",
                           "    preferencesReady, mode, isEdit, aspect, imageResolution, seed, steps, cfg, negativePrompt,\n    editAuto, videoResolution, videoDuration, videoAudio,\n")
          replace(controls, "          outputs={outputs}\n          setOutputs={setOutputs}\n", "")
          replace(controls, "          workflowId={workflowId}\n          setWorkflowId={setWorkflowId}\n          modelId={modelId}\n          setModelId={setModelId}\n", "")
          replace(controls, "function OutputWall({ items, renderCard }) {\n  return (\n    <section className=\"saga-output-wall\" aria-label=\"Generation outputs\">",
                           "function OutputWall({ items, renderCard }) {\n  if (!items.length) return null;\n  return (\n    <section aria-label=\"Recent work\">\n      <div className=\"saga-stage-heading saga-results-heading\">\n        <span>RECENT WORK</span>\n        <h2>Your latest creations</h2>\n        <p>Current-session results appear first, followed by relevant Favorites for quick reuse.</p>\n      </div>\n      <div className=\"saga-output-wall\">")
          replace(controls, "      {items.map((item, index) => (\n        <div className={`saga-output-slot saga-output-slot-${index % 6}`} key={item.id}>\n          {renderCard(item, false)}\n        </div>\n      ))}\n    </section>",
                           "        {items.map((item, index) => (\n          <div className={`saga-output-slot saga-output-slot-${index % 6}`} key={item.id}>\n            {renderCard(item, false)}\n          </div>\n        ))}\n      </div>\n    </section>")

          jobs='apps/studio/src/features/jobs/JobsView.jsx'
          replace(jobs, "            <span>{job.kind || 'image'} · {job.mode || 'generation'}</span><span>{job.model || 'Unknown model'}</span><span>{job.provider || 'provider n/a'}</span>{job.seed != null && <span>Seed {job.seed}</span>}{job.resolution && <span>{job.resolution}</span>",
                        "            <span>{job.kind || 'image'} · {job.mode || 'generation'}</span><span>{job.model || 'Unknown model'}</span>{job.seed != null && <span>Seed {job.seed}</span>}{job.resolution && <span>{job.resolution}</span>")
          replace(jobs, "          <div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', fontSize: 11, color: '#687284' }}><span>Queued {formatJobTime(job.created_at)}</span><span>Started {formatJobTime(job.started_at)}</span><span>Finished {formatJobTime(job.completed_at)}</span></div>",
                        "          <details style={{ fontSize: 11, color: '#687284' }}><summary style={{ cursor: 'pointer' }}>Technical details</summary><div style={{ display: 'flex', gap: 16, flexWrap: 'wrap', paddingTop: 8 }}><span>Provider {job.provider || 'n/a'}</span><span>Queued {formatJobTime(job.created_at)}</span><span>Started {formatJobTime(job.started_at)}</span><span>Finished {formatJobTime(job.completed_at)}</span></div></details>")

          contract='apps/studio/scripts/check-create-advanced-contract.mjs'
          replace(contract, "expect(!controls.includes('if (isEdit) setOutputs(1)'), 'FLUX preset reset must not silently change output count');\n", "")
          replace(contract, "expect(/item\\.kind === 'video'[\\s\\S]*?setSteps\\(11\\)[\\s\\S]*?setCfg\\(1\\)[\\s\\S]*?ltx25-redgraft-video/.test(await readFile(new URL('src/hooks/useMediaActions.js', root), 'utf8')), 'Reusing a video must restore the LTX production preset');",
                           "expect(/item\\.kind === 'video'[\\s\\S]*?setSteps\\(11\\)[\\s\\S]*?setCfg\\(1\\)/.test(await readFile(new URL('src/hooks/useMediaActions.js', root), 'utf8')), 'Reusing a video must restore the LTX production sampling preset');")
          replace(contract, "console.log('Create Advanced contract passed: production presets, live LTX CFG transport, fixed 11-step recipe, moved video controls, single audio button, and Favorites-backed Create wall are wired.');",
                           "expect(!app.includes('setWorkflowId') && !app.includes('setModelId') && !controls.includes('saved.workflowId') && !controls.includes('saved.modelId'), 'Dead workflow/model presentation state must stay removed from Create');\nexpect(!app.includes('setOutputs') && !controls.includes('saved.outputs'), 'Dead output-count presentation state must stay removed from Create');\nconsole.log('Create Advanced contract passed: production presets, live LTX CFG transport, fixed 11-step recipe, dead presentation plumbing removed, and Recent work is wired.');")

          # Update audit evidence conservatively: record only what this milestone proves plus run #19.
          doc=Path('docs/studio-ui-ux-benchmark-audit.md')
          text=doc.read_text()
          text=text.replace('Status: **ACTIVE**', 'Status: **ACTIVE — final audit phase**', 1)
          marker='## Progress log\n\n'
          entry='- 2026-08-25: Studio Browser UX Review #19 passed build/contracts plus Chromium interaction, desktop/mobile screenshots, Create/Edit/Video/Advanced, Gallery/manager, Uploads, Jobs, keyboard, responsive, reduced-motion and touch coverage. Branch cleanup advanced the head to `43dcfa19139b20a22a2ff3acd0e22f5df9cf602c`.\n- 2026-08-25: Removed dead Create `outputs`, `workflowId`, and `modelId` presentation/persistence plumbing that did not control worker execution; Recent work now clearly prioritizes current-session results and then Favorites; Jobs provider/timestamps moved behind Technical details so model/status/progress lead the scan.\n'
          if entry not in text:
              text=text.replace(marker, marker+entry, 1)
          doc.write_text(text)

          # Remove this helper from the final tree.
          Path('.github/workflows/studio-audit-milestone-cleanup.yml').unlink()
          PY
      - name: Install and validate Studio
        working-directory: apps/studio
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm run build
          npm run visual:preview
          npm run visual:regression
      - name: Commit milestone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(studio): clarify Create results and Jobs hierarchy'
          git push origin HEAD:studio/advanced-ui-audit
