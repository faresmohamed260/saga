name: Studio build diagnostic

on:
  push:
    branches:
      - studio/ui-fixes-advanced-sidebar-jobs

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/ui-fixes-advanced-sidebar-jobs
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/studio/package-lock.json
      - name: Capture build output
        shell: bash
        run: |
          cd apps/studio
          npm install --no-audit --no-fund
          set +e
          npm run build > build-diagnostic.txt 2>&1
          code=$?
          cat build-diagnostic.txt
          exit 0
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/build-diagnostic.txt
          git commit -m "chore(studio): capture build diagnostic [skip ci]" || exit 0
          git push origin HEAD:studio/ui-fixes-advanced-sidebar-jobs
