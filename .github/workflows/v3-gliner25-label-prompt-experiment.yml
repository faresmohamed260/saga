name: V3 GLiNER2.5 Character Label Prompt Experiment

on:
  push:
    branches:
      - v3/qualification-gliner25-label-prompts

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/v3-gliner-qualification.txt
      - name: Install CPU Torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install GLiNER qualification environment
        run: python -m pip install -r requirements/v3-gliner-qualification.txt
      - name: Baseline person label
        run: >-
          python -m scripts.run_v3_gliner_threshold_sweep
          --root external/litbank
          --out evaluation-artifacts/person.json
          --limit 5
          --thresholds 0.5
          --character-labels "person"
          --device cpu
          --model-cache .cache/huggingface
      - name: Person reference labels
        run: >-
          python -m scripts.run_v3_gliner_threshold_sweep
          --root external/litbank
          --out evaluation-artifacts/person-references.json
          --limit 5
          --thresholds 0.5
          --character-labels "person name,person description,person pronoun"
          --device cpu
          --model-cache .cache/huggingface
      - name: Character reference labels
        run: >-
          python -m scripts.run_v3_gliner_threshold_sweep
          --root external/litbank
          --out evaluation-artifacts/character-references.json
          --limit 5
          --thresholds 0.5
          --character-labels "character name,character description,character pronoun"
          --device cpu
          --model-cache .cache/huggingface
      - name: Publish comparison
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          print("## GLiNER2.5 character label prompt comparison — 5 LitBank documents")
          print()
          print("| Variant | Labels | Precision | Recall | F1 | Proper | Nominal | Pronoun |")
          print("|---|---|---:|---:|---:|---:|---:|---:|")
          for name, path in [
              ("person", "person.json"),
              ("person refs", "person-references.json"),
              ("character refs", "character-references.json"),
          ]:
              report = json.loads((Path("evaluation-artifacts") / path).read_text())
              m = report["results"][0]["aggregate"]["metrics"]
              labels = ", ".join(report["characterLabels"])
              print(f"| {name} | {labels} | {m['precision']:.4f} | {m['recall']:.4f} | {m['f1']:.4f} | {m['proper_name_recall']:.4f} | {m['nominal_recall']:.4f} | {m['pronoun_recall']:.4f} |")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: saga-v3-gliner25-label-prompts-${{ github.sha }}
          path: evaluation-artifacts/*.json
          if-no-files-found: error
          retention-days: 90
