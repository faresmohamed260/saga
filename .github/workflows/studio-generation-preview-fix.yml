name: Studio generation preview fixer

on:
  push:
    branches:
      - studio/ui-fixes-advanced-sidebar-jobs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/ui-fixes-advanced-sidebar-jobs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply generation preview fixes
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[generation-preview-fixed\]'; then
            echo "Already applied."
            exit 0
          fi
          python .github/scripts/fix_generation_preview_contracts.py
      - name: Commit generation preview fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/scripts
          git commit -m "test(studio): align generation previews with Advanced model dropdown [generation-preview-fixed]"
          git push origin HEAD:studio/ui-fixes-advanced-sidebar-jobs
