name: Studio Iteration 19 Finalize

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/studio_iteration19_finalize.py"
      - ".github/workflows/studio-iteration19-finalize.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-iteration19-finalize
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Finalize Iteration 19
        run: python scripts/studio_iteration19_finalize.py
      - name: Commit Iteration 19 finalization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs scripts .github/workflows
          if git diff --cached --quiet; then
            echo "Iteration 19 already finalized"
            exit 0
          fi
          git commit -m "docs: complete Iteration 19"
          git push origin HEAD:studio/video-gallery-ux
