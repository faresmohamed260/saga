name: Studio CI

on:
  pull_request:
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"
      - "scripts/worker_fleet_platform_patch.py"
      - "scripts/worker_fleet_refine.py"
      - "scripts/modal_worker_fleet.py"
      - "config/modal-worker-ecosystems.json"
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"

permissions:
  contents: write

jobs:
  worker-fleet-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'studio/video-gallery-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch once
        shell: bash
        run: |
          if [ -f scripts/worker_fleet_refine.py ]; then
            python scripts/worker_fleet_refine.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm scripts/worker_fleet_refine.py
            git add apps/studio/api/_worker-registry.js integrations/comfyui/flux2_klein_app.py apps/studio/scripts/check-worker-registry-contract.mjs scripts/modal_worker_fleet.py
            git commit -m "fix: harden worker fleet failover and model secrets"
            git push origin HEAD:studio/video-gallery-ux
            exit 0
          fi
          if [ -f apps/studio/api/_worker-registry.js ]; then
            echo "Worker fleet platform already patched"
            exit 0
          fi
          python scripts/worker_fleet_platform_patch.py
          rm -f .github/workflows/modal-worker-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-ui-polish-checklist.md config/modal-worker-ecosystems.json apps/studio/api/_worker-registry.js apps/studio/api/_worker-registry.generated.js apps/studio/api/_workflows.js apps/studio/api/_providers.js apps/studio/api/generate.js apps/studio/api/generate/result.js apps/studio/src/generation-client.js apps/studio/src/app/App.jsx apps/studio/src/features/create/CreateWorkspace.jsx apps/studio/src/features/create/VideoGenerationControls.jsx integrations/comfyui/flux2_klein_app.py integrations/comfyui/ltx23_app.py integrations/comfyui/flux2_klein_gateway.py integrations/comfyui/ltx23_gateway.py apps/studio/scripts/check-worker-registry-contract.mjs apps/studio/package.json scripts/modal_worker_fleet.py
          git commit -m "feat: add ecosystem-affine Modal worker fleet"
          git push origin HEAD:studio/video-gallery-ux

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:poster
      - name: Guard Vercel Hobby function count
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t routes < <(find api -type f -name '*.js' ! -name '_*.js' | sort)
          printf 'Vercel API routes (%s):\n' "${#routes[@]}"
          printf '  %s\n' "${routes[@]}"
          if [ "${#routes[@]}" -gt 12 ]; then
            echo "Studio exceeds Vercel Hobby's 12 Serverless Function limit." >&2
            exit 1
          fi
      - name: Guard browser execution boundary
        run: |
          if grep -R "saga-flux2-klein-gateway-web.modal.run" src index.html; then
            echo "Direct Modal gateway URL must not be shipped in the Studio browser source." >&2
            exit 1
          fi
          if grep -R "async-provider-fetch" src index.html; then
            echo "Temporary async fetch shim must not return." >&2
            exit 1
          fi

  modal-worker-inventory:
    if: github.event_name == 'pull_request' && github.head_ref == 'studio/video-gallery-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      EXPECTED_MODAL_ACCOUNTS: "47"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Inventory all Modal accounts
        run: python scripts/modal_worker_fleet.py inventory --out modal-worker-inventory.json
      - name: Validate 47-account roster
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path('modal-worker-inventory.json').read_text(encoding='utf-8'))
          rows = payload.get('accounts') or []
          expected = int(os.environ['EXPECTED_MODAL_ACCOUNTS'])
          if len(rows) != expected:
              raise SystemExit(f'Expected {expected} Modal accounts, inventoried {len(rows)}')
          counts = {}
          for row in rows:
              state = str(row.get('state') or 'unknown')
              counts[state] = counts.get(state, 0) + 1
          print(json.dumps({'count': len(rows), 'states': counts}, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: modal-worker-inventory
          path: modal-worker-inventory.json
          if-no-files-found: error
          retention-days: 7
