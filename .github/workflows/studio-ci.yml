name: Studio CI

on:
  pull_request:
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"
      - "scripts/worker_fleet_platform_patch.py"
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"

permissions:
  contents: write

jobs:
  worker-fleet-patch:
    if: github.event_name == 'pull_request' && github.head_ref == 'studio/video-gallery-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply patch once
        shell: bash
        run: |
          if [ -f apps/studio/api/_worker-registry.js ]; then
            echo "Worker fleet platform already patched"
            exit 0
          fi
          python scripts/worker_fleet_platform_patch.py
          # Workflow-file writes require GitHub Apps with workflows permission. The
          # platform patch is safe to land without the optional inventory workflow;
          # that workflow is added separately through the connected GitHub app.
          rm -f .github/workflows/modal-worker-inventory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-ui-polish-checklist.md config/modal-worker-ecosystems.json apps/studio/api/_worker-registry.js apps/studio/api/_worker-registry.generated.js apps/studio/api/_workflows.js apps/studio/api/_providers.js apps/studio/api/generate.js apps/studio/api/generate/result.js apps/studio/src/generation-client.js apps/studio/src/app/App.jsx apps/studio/src/features/create/CreateWorkspace.jsx apps/studio/src/features/create/VideoGenerationControls.jsx integrations/comfyui/flux2_klein_app.py integrations/comfyui/ltx23_app.py integrations/comfyui/flux2_klein_gateway.py integrations/comfyui/ltx23_gateway.py apps/studio/scripts/check-worker-registry-contract.mjs apps/studio/package.json scripts/modal_worker_fleet.py
          git commit -m "feat: add ecosystem-affine Modal worker fleet"
          git push origin HEAD:studio/video-gallery-ux

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:poster
      - name: Guard Vercel Hobby function count
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t routes < <(find api -type f -name '*.js' ! -name '_*.js' | sort)
          printf 'Vercel API routes (%s):\n' "${#routes[@]}"
          printf '  %s\n' "${routes[@]}"
          if [ "${#routes[@]}" -gt 12 ]; then
            echo "Studio exceeds Vercel Hobby's 12 Serverless Function limit." >&2
            exit 1
          fi
      - name: Guard browser execution boundary
        run: |
          if grep -R "saga-flux2-klein-gateway-web.modal.run" src index.html; then
            echo "Direct Modal gateway URL must not be shipped in the Studio browser source." >&2
            exit 1
          fi
          if grep -R "async-provider-fetch" src index.html; then
            echo "Temporary async fetch shim must not return." >&2
            exit 1
          fi
