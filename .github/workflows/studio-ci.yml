name: Studio CI

on:
  pull_request:
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0
      - name: Complete Item 09 documentation and restore temporary workflows
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'studio/video-gallery-ux'
        working-directory: .
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          checklist_path = Path('docs/studio-ui-polish-checklist.md')
          checklist = checklist_path.read_text()
          in_progress = '''**Iteration 9 — resolution terminology and delivery dimensions**

- Status: `[~]` in progress
- Working item: **09**
- Rule: standardize user-facing resolution terminology and show aspect-aware delivery dimensions without exposing internal alignment dimensions; validate deterministic contracts, GitHub CI/visual preview, and professional review before completion.
'''
          complete = '''**Iteration 9 — resolution terminology and delivery dimensions**

- Status: `[x]` complete
- Completed item: **09**
- Next item: **10 — strengthen the Generate primary action**
- Rule: do not start Item 10 until the user explicitly says continue. Each future iteration must follow implement → deterministic test → GitHub CI/visual preview → inspect screenshots → professional critique → record improvements → update this file → stop for user approval.
'''
          if in_progress in checklist:
              checklist = checklist.replace(in_progress, complete, 1)
              old_item = '- [~] **09. Standardize resolution terminology and expose actual delivery dimensions.** Prefer `1080p` over `Full HD`; show context such as `1920×1080 at 16:9` or `1080×1920 at 9:16`. **Iteration 9 in progress.**\n'
              new_item = '- [x] **09. Standardize resolution terminology and expose actual delivery dimensions.** Video uses explicit `480p`/`720p`/`1080p`/`2K` terminology with aspect-aware delivery dimensions; Image uses explicit pixel terminology and computed output dimensions. Unsupported Video 4K is no longer advertised. **Iteration 9 complete.**\n'
              if old_item not in checklist:
                  raise SystemExit('Could not locate Item 09 checklist row')
              checklist = checklist.replace(old_item, new_item, 1)
              if '### Iteration 9 — resolution terminology and delivery dimensions' not in checklist:
                  checklist += '''

### Iteration 9 — resolution terminology and delivery dimensions

- [x] Replaced Video `Full HD` wording with explicit `1080p` terminology; Video presets now read `480p`, `720p`, `1080p`, and `2K`.
- [x] Added shared `ResolutionPresets.js` helpers so Create UI and deterministic contracts derive dimensions from the same preset data rather than duplicated literals.
- [x] Video resolution rows, preview copy, trigger title, and accessible label expose actual aspect-aware delivery dimensions, including `1920×1080 at 16:9`, `1080×1920 at 9:16`, and `1440×1080 at 4:3` for 1080p.
- [x] Video resolution follows the effective shared Aspect state, including Auto/reference-derived ratios, so the displayed delivery dimensions update when the effective aspect changes.
- [x] Image resolution terminology is explicit pixel language (`480 px` through `3840 px`) and the picker shows the computed output dimensions for the active aspect.
- [x] Removed Video 4K from the UI because the production workflow/runtime currently enables only `480p`, `720p`, `1080p`, and `2K`; professional source review rejected advertising a disabled capability.
- [x] Added `check-resolution-contract.mjs` to the normal Studio build. It verifies canonical 1080p landscape/portrait/reference dimensions, enabled runtime/workflow resolution parity, and rejects reintroduction of `Full HD` or disabled Video 4K.
- [x] First Item 09 validation run `32678010842` passed source/build contracts and then exposed a stale visual-test text expectation after terminology changed. The test was corrected without weakening keyboard End/Home/focus coverage.
- [x] Dedicated refinement run `32678135023` passed the complete deterministic and Playwright visual suite; artifact `9503328418` was inspected before final standard validation.
- [x] Temporary validation-generated screenshots and `package-lock.json` were removed from the product branch before final validation.
- [x] Final standard Studio CI `32678441763`, Studio Visual Preview `32678441802`, Backend Architecture CI `32678441772`, and Required Check Compatibility `32678441777` all passed on reviewed product head `26fc3501aaaef91fd2e831ec30d5bb41c2caf0da`.
- [x] Final visual artifact `9503419570` was downloaded and all 31 screenshots were inspected across Image, Video, Edit, desktop/mobile Create, Gallery hover/focus/Manage, reduced-motion, and poster states. No Item-09-specific visual or responsive regression remained.
- [x] Accepted evidence includes `02-image-resolution-picker.png`, `04-video-resolution-picker.png`, and `05h-video-resolution-portrait.png`; 1080p correctly reads `1920×1080` at 16:9 and `1080×1920` at 9:16.
- [x] REDGraft Modal smoke `32678441765` deployed the runtime successfully, then failed at prefetch because Modal returned `ConflictError: workspace ... is disabled`; this is the existing external account blocker, not an Item 09 regression.
- [x] Professional review result for Item 09: complete. No new checklist item required. **Item 10 is next and remains gated on explicit user approval.**
'''
              checklist_path.write_text(checklist)
          elif '- [x] **09. Standardize resolution terminology' not in checklist:
              raise SystemExit('Iteration 9 is neither in-progress nor complete')

          brief_path = Path('docs/studio-ui-polish-iteration-brief.md')
          brief = brief_path.read_text()
          if '- Completed checklist items: **01–08**.\n' in brief:
              replacements = {
                  '- Completed checklist items: **01–08**.\n': '- Completed checklist items: **01–09**.\n',
                  '- Next item: **09 — standardize resolution terminology and expose actual delivery dimensions**.\n': '- Next item: **10 — strengthen the Generate primary action**.\n',
                  '- Do not begin Item 09 until the user says **continue**.\n': '- Do not begin Item 10 until the user says **continue**.\n',
                  '- Latest completed item is Iteration 8. Final standard Studio Visual Preview run `32676390654` passed on reviewed product head `333e32236b116be9a48234abada56582cbfd6ff2`; artifact `9502799506` was professionally reviewed across Image, Video, Edit, mobile Create, and Gallery. Studio CI, Backend Architecture CI, and Required Check Compatibility also passed. The REDGraft Modal smoke remains externally blocked because the configured Modal workspace is disabled.\n': '- Latest completed item is Iteration 9. Final standard Studio CI `32678441763`, Studio Visual Preview `32678441802`, Backend Architecture CI `32678441772`, and Required Check Compatibility `32678441777` passed on reviewed product head `26fc3501aaaef91fd2e831ec30d5bb41c2caf0da`; visual artifact `9503419570` was downloaded and all 31 screenshots were professionally reviewed. Video now uses explicit `1080p` terminology with aspect-aware delivery dimensions, and disabled Video 4K is no longer advertised. The REDGraft Modal smoke remains externally blocked because the configured Modal workspace is disabled.\n',
                  'Remaining high-value work includes consistent resolution terminology and delivery dimensions, stronger Generate/audio affordances, richer real lifecycle feedback, bulk-management improvements, Create composition refactoring, Gallery naming/internal cleanup, App.jsx responsibility reduction, card metadata simplification, search/sort, design-token consolidation, broader accessibility, and true screenshot-baseline regression testing.\n': 'Remaining high-value work includes stronger Generate/audio affordances, richer real lifecycle feedback, bulk-management improvements, Create composition refactoring, Gallery naming/internal cleanup, App.jsx responsibility reduction, card metadata simplification, search/sort, design-token consolidation, broader accessibility, and true screenshot-baseline regression testing.\n',
              }
              for old, new in replacements.items():
                  if old not in brief:
                      raise SystemExit(f'Could not locate brief text: {old[:80]!r}')
                  brief = brief.replace(old, new, 1)
              if '### Iteration 9 — resolution terminology and delivery dimensions' not in brief:
                  brief += '''

### Iteration 9 — resolution terminology and delivery dimensions

**Status:** complete.

**Implementation:** standardized resolution language and separated friendly preset names from exact delivery geometry. Video exposes `480p`, `720p`, `1080p`, and `2K`; picker rows, preview, title, and accessible label show aspect-aware delivered dimensions. The shared effective Aspect state drives those dimensions, including reference-derived Auto ratios. Image uses explicit pixel terminology with computed aspect-aware dimensions. Video 4K was removed because the production workflow/runtime does not currently enable it.

**Deterministic coverage:** `ResolutionPresets.js` is the shared preset/dimension source and `check-resolution-contract.mjs` runs in the normal Studio build. It verifies canonical 1080p `1920×1080` landscape, `1080×1920` portrait, and `1440×1080` 4:3 delivery, enabled runtime/workflow parity, and guards against `Full HD`/disabled 4K regressions. Poster/deferred-preview coverage remains green.

**Professional review cycle:** first validation run `32678010842` exposed a stale visual-test text expectation after terminology changed; the assertion was corrected while retaining keyboard End/Home/focus behavior. Refinement run `32678135023` then passed the full visual suite. A branch-hygiene review caught validation-generated screenshots and `package-lock.json`; those were removed before standard final validation.

**Visual review:** final artifact `9503419570` from standard Studio Visual Preview `32678441802` was downloaded and all 31 screenshots were inspected. Video clearly pairs `1080p` with `1920×1080` at 16:9 and `1080×1920` at 9:16; picker geometry, keyboard focus, shared Aspect behavior, mobile Create, Edit, and Gallery states remained stable. No Item 09 visual or responsive defect remained.

**Validation:** reviewed product head `26fc3501aaaef91fd2e831ec30d5bb41c2caf0da`. Studio CI `32678441763`, Studio Visual Preview `32678441802`, Backend Architecture CI `32678441772`, and Required Check Compatibility `32678441777` passed. REDGraft `32678441765` successfully deployed the runtime but Modal rejected prefetch with `ConflictError: workspace ... is disabled`; this remains an external infrastructure blocker unrelated to Item 09.

**Professional review:** Item 09 is complete with no remaining actionable comments. Item 10 — strengthen the Generate primary action — is next and remains gated on explicit user approval.
'''
              brief_path.write_text(brief)
          elif '- Completed checklist items: **01–09**.\n' not in brief:
              raise SystemExit('Brief is neither Iteration 8 nor Iteration 9 handoff state')
          PY
          git checkout HEAD^ -- .github/workflows/studio-ci.yml
          git checkout 26fc3501aaaef91fd2e831ec30d5bb41c2caf0da -- .github/workflows/required-check-compat.yml
          rm -f .github/workflows/studio-iteration9-closeout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A docs/studio-ui-polish-checklist.md docs/studio-ui-polish-iteration-brief.md .github/workflows/studio-ci.yml .github/workflows/required-check-compat.yml .github/workflows/studio-iteration9-closeout.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Iteration 9 closeout already applied.'
          else
            git commit -m 'docs(studio): complete iteration 9'
            git push origin HEAD:studio/video-gallery-ux
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:poster
      - name: Guard Vercel Hobby function count
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t routes < <(find api -type f -name '*.js' ! -name '_*.js' | sort)
          printf 'Vercel API routes (%s):\n' "${#routes[@]}"
          printf '  %s\n' "${routes[@]}"
          if [ "${#routes[@]}" -gt 12 ]; then
            echo "Studio exceeds Vercel Hobby's 12 Serverless Function limit." >&2
            exit 1
          fi
      - name: Guard browser execution boundary
        run: |
          if grep -R "saga-flux2-klein-gateway-web.modal.run" src index.html; then
            echo "Direct Modal gateway URL must not be shipped in the Studio browser source." >&2
            exit 1
          fi
          if grep -R "async-provider-fetch" src index.html; then
            echo "Temporary async fetch shim must not return." >&2
            exit 1
          fi