name: Studio CI

on:
  pull_request:
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/studio/**"
      - ".github/workflows/studio-ci.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0
      - name: Mark Iteration 11 in progress and restore workflow
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'studio/video-gallery-ux'
        working-directory: .
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/studio-ui-polish-checklist.md')
          text = path.read_text()
          old = '''**Iteration 10 — strengthen the Generate primary action**

- Status: `[x]` complete
- Completed item: **10**
- Next item: **11 — make Audio state explicit and non-color-dependent**
- Rule: do not start Item 11 until the user explicitly says continue. Each future iteration must follow implement → deterministic test → GitHub CI/visual preview → inspect screenshots → professional critique → record improvements → update this file → stop for user approval.
'''
          new = '''**Iteration 11 — explicit Audio state**

- Status: `[~]` in progress
- Working item: **11**
- Rule: make Video Audio state explicit and non-color-dependent with visible On/Off wording, accessible pressed state, and concise explanatory copy; validate deterministic contracts, GitHub CI/visual preview, and professional review before completion.
'''
          if old in text:
              text = text.replace(old, new, 1)
              old_item = '- [ ] **11. Make Audio state explicit and non-color-dependent.** Clear On/Off state, tooltip/popover copy, accessible pressed state.\n'
              new_item = '- [~] **11. Make Audio state explicit and non-color-dependent.** Clear On/Off state, tooltip/popover copy, accessible pressed state. **Iteration 11 in progress.**\n'
              if old_item not in text:
                  raise SystemExit('Could not locate Item 11 checklist row')
              path.write_text(text.replace(old_item, new_item, 1))
          elif '- [~] **11. Make Audio state explicit and non-color-dependent.' not in text:
              raise SystemExit('Iteration 11 state was not found')
          PY
          git checkout HEAD^ -- .github/workflows/studio-ci.yml
          rm -f .github/workflows/studio-iteration11-start.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/studio-ui-polish-checklist.md .github/workflows/studio-ci.yml .github/workflows/studio-iteration11-start.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Iteration 11 already marked in progress.'
          else
            git commit -m 'docs(studio): start iteration 11'
            git push origin HEAD:studio/video-gallery-ux
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run test:poster
      - name: Guard Vercel Hobby function count
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t routes < <(find api -type f -name '*.js' ! -name '_*.js' | sort)
          printf 'Vercel API routes (%s):\n' "${#routes[@]}"
          printf '  %s\n' "${routes[@]}"
          if [ "${#routes[@]}" -gt 12 ]; then
            echo "Studio exceeds Vercel Hobby's 12 Serverless Function limit." >&2
            exit 1
          fi
      - name: Guard browser execution boundary
        run: |
          if grep -R "saga-flux2-klein-gateway-web.modal.run" src index.html; then
            echo "Direct Modal gateway URL must not be shipped in the Studio browser source." >&2
            exit 1
          fi
          if grep -R "async-provider-fetch" src index.html; then
            echo "Temporary async fetch shim must not return." >&2
            exit 1
          fi