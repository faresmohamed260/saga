name: Qwen modal-01 Reference Inspection

on:
  push:
    branches:
      - studio/qwen-image-edit-2511
    paths:
      - ".github/workflows/qwen-modal01-reference-inspection.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Select modal-01 credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          raw = os.environ.get("SAGA_MODAL_TOKENS_JSON", "").strip()
          if not raw:
              raise SystemExit("SAGA_MODAL_TOKENS_JSON is not configured")
          payload = json.loads(raw)
          accounts = payload.get("accounts") or payload.get("tokens") or payload.get("roster") or [] if isinstance(payload, dict) else payload
          selected = None
          for account in accounts:
              if not isinstance(account, dict):
                  continue
              label = str(account.get("label") or account.get("name") or account.get("account") or "").strip().lower()
              if label in {"modal-01", "modal01", "modal-1", "account-01", "account-1"}:
                  selected = account
                  break
          if selected is None:
              raise SystemExit("modal-01 was not found in roster")
          token_id = str(selected.get("token_id") or "").strip()
          token_secret = str(selected.get("token_secret") or "").strip()
          combined = str(selected.get("api_key") or selected.get("token") or "").strip()
          if (not token_id or not token_secret) and "." in combined:
              token_id, token_secret = combined.split(".", 1)
          if not token_id or not token_secret:
              raise SystemExit("modal-01 credentials are incomplete")
          print(f"::add-mask::{token_id}")
          print(f"::add-mask::{token_secret}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MODAL_TOKEN_ID={token_id}\n")
              handle.write(f"MODAL_TOKEN_SECRET={token_secret}\n")
          PY
      - name: Inspect modal-01 Qwen implementation
        shell: bash
        run: |
          python - <<'PY'
          import json
          import modal

          volume = modal.Volume.from_name("graduation-comfyui-cache")
          entries = list(volume.listdir("/", recursive=True))
          rows = []
          for entry in entries:
              path = str(getattr(entry, "path", ""))
              if not path:
                  continue
              rows.append({
                  "path": path,
                  "size": int(getattr(entry, "size", 0) or 0),
                  "type": str(getattr(entry, "type", "") or ""),
              })

          model_rows = [row for row in rows if row["path"].startswith("studio-models/") and row["type"] == "1"]
          print(json.dumps({"event": "modal01-studio-model-files", "files": model_rows}, indent=2), flush=True)

          try:
              manifest = b"".join(volume.read_file("studio-models/manifest.json")).decode("utf-8", errors="replace")
              print(json.dumps({"event": "modal01-studio-model-manifest", "manifest": json.loads(manifest)}, indent=2, ensure_ascii=False), flush=True)
          except Exception as exc:
              print(json.dumps({"event": "modal01-studio-model-manifest-error", "error": f"{type(exc).__name__}: {exc}"}), flush=True)

          workflow_rows = [row for row in rows if row["path"].startswith("workflows/") and row["path"].endswith(".json") and row["size"] < 2_000_000]
          workflows = []
          for row in workflow_rows:
              path = row["path"]
              data = b"".join(volume.read_file(path)).decode("utf-8", errors="replace")
              try:
                  obj = json.loads(data)
              except Exception as exc:
                  workflows.append({"path": path, "error": f"{type(exc).__name__}: {exc}"})
                  continue
              nodes = []
              if isinstance(obj, dict):
                  for node_id, node in obj.items():
                      if not isinstance(node, dict):
                          continue
                      nodes.append({"node": str(node_id), "class_type": node.get("class_type"), "inputs": node.get("inputs")})
              workflows.append({"path": path, "nodes": nodes})
          print(json.dumps({"event": "modal01-workflow-graphs", "workflows": workflows}, indent=2, ensure_ascii=False), flush=True)
          PY
      - name: Show modal-01 deployment history and Qwen logs
        shell: bash
        run: |
          echo '=== APPS ==='
          modal app list --json || true
          echo '=== SAGA IMAGE RUNTIME HISTORY ==='
          modal app history saga-image-runtime --json || true
          echo '=== QWEN LOG HITS ==='
          modal app logs saga-image-runtime --tail 1000 --search Qwen --timestamps || true
