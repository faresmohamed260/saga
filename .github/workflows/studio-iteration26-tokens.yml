name: Studio Iteration 26 Tokens

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/studio_iteration26_tokens.py"
      - ".github/workflows/studio-iteration26-tokens.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/studio_iteration26_tokens.py
      - name: Commit Iteration 26 token migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/styles.css apps/studio/src/create-controls.css apps/studio/src/create-workspace-v2.css apps/studio/src/gallery-controls.css apps/studio/src/studio-polish.css apps/studio/scripts/capture-ui-preview.mjs docs/studio-ui-polish-checklist.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: consolidate Studio CSS design tokens"
          git push origin HEAD:studio/video-gallery-ux
