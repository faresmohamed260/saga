name: V3 Nominal Pair Ranking CV Qualification

on:
  push:
    branches:
      - v3/qualification-nominal-token-boundary-cv
    paths:
      - scripts/run_v3_nominal_pair_rank_cv.py
      - .github/workflows/v3-nominal-pair-rank-cv.yml

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout S.A.G.A.
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned boundary challengers
        run: |
          python -m pip install "spacy==3.8.16" "scikit-learn==1.7.2"
          python -m pip install "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"

      - name: Run held-out pair ranking
        run: >-
          python -m scripts.run_v3_nominal_pair_rank_cv
          --root external/litbank
          --out evaluation-artifacts/v3-nominal-pair-rank-cv.json
          --limit 100
          --folds 5
          --model en_core_web_sm
          --max-span-length 16

      - name: Publish summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path("evaluation-artifacts/v3-nominal-pair-rank-cv.json").read_text())
          print("## V3 nominal pair ranking")
          print()
          print(f"- Documents: {r['dataset']['documentCount']}")
          print(f"- Gold person nominals: {r['dataset']['goldPersonNominals']}")
          for scorer, rows in r['aggregateBudgets'].items():
              print()
              print(f"### {scorer} boundary-logit score")
              print("| Budget vs gold | Predicted | TP | Precision | Recall | F1 |")
              print("|---:|---:|---:|---:|---:|---:|")
              for row in rows:
                  print(f"| {row['budgetMultiplierVsGold']:.1f}× | {row['predicted']} | {row['truePositive']} | {row['precision']:.4f} | {row['recall']:.4f} | {row['f1']:.4f} |")
          print()
          print("### Fold candidate pools")
          for fold in r['folds']:
              sum_row = fold['scorers']['sum']
              print(f"- fold {fold['fold']}: gate ceiling {fold['boundaryGateRecallCeiling']:.4f}; candidates {sum_row['candidatePairs']}; candidate recall {sum_row['candidateRecall']:.4f}; sum AP {sum_row['averagePrecisionWithinCandidatePool']:.4f}; min AP {fold['scorers']['min']['averagePrecisionWithinCandidatePool']:.4f}")
          print()
          print(f"- Runtime: {r['resources']['runtimeSeconds']:.2f}s")
          print(f"- Peak RSS: {r['resources']['peakRssMb']:.1f} MB")
          PY

      - name: Upload benchmark
        uses: actions/upload-artifact@v4
        with:
          name: saga-v3-nominal-pair-rank-cv-${{ github.sha }}
          path: evaluation-artifacts/v3-nominal-pair-rank-cv.json
          if-no-files-found: error
          retention-days: 90
