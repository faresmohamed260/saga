name: Studio Iteration 5 Compatibility Refinement

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/studio-iteration5-compat-refinement.yml"
      - "apps/studio/scripts/iteration5_compat_patch.py"

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply professional-review compatibility refinement
        run: python apps/studio/scripts/iteration5_compat_patch.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m py_compile integrations/comfyui/ltx23_app.py integrations/comfyui/ltx23_gateway.py
      - name: Install Studio dependencies
        working-directory: apps/studio
        run: npm install --no-audit --no-fund
      - name: Run poster contract
        working-directory: apps/studio
        run: npm run test:poster
      - name: Build Studio
        working-directory: apps/studio
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium
      - name: Start preview
        working-directory: apps/studio
        shell: bash
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/studio-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio-preview.log
          exit 1
      - name: Capture visual evidence
        working-directory: apps/studio
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:preview
      - name: Publish visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: studio-iteration5-compat-${{ github.run_id }}
          path: |
            apps/studio/visual-preview/*.png
            apps/studio/visual-preview/*.json
          retention-days: 7
      - name: Commit refined product files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/studio/visual-preview
          rm -f apps/studio/package-lock.json
          rm -f apps/studio/scripts/iteration5_compat_patch.py
          git add integrations/comfyui/ltx23_app.py integrations/comfyui/ltx23_gateway.py apps/studio/scripts/check-video-poster-contract.mjs apps/studio/scripts/iteration5_compat_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Preserve LTX video result contract for posters"
          git push origin HEAD:studio/video-gallery-ux
