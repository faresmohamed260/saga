name: Saturn Probe Resource Inventory

on:
  push:
    branches:
      - experiment/saturn-worker
    paths:
      - .github/saturn-resource-inventory-trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SATURN_BASE_URL: https://app.community.saturnenterprise.io
      SATURN_TOKEN: ${{ secrets.SATURN_TOKEN }}
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: experiment/saturn-worker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install current Saturn client
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SATURN_TOKEN:-}" || { echo "::error::SATURN_TOKEN is missing"; exit 1; }
          python -m pip install --disable-pip-version-check --no-input \
            'git+https://github.com/saturncloud/saturn-client.git@main'

      - name: Read probe resource inventory
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from saturn_client import SaturnConnection

          resources = SaturnConnection().list_resources()
          matches = []
          for item in resources:
              if not isinstance(item, dict):
                  continue
              spec = item.get('spec') or {}
              state = item.get('state') or {}
              name = str(spec.get('name') or item.get('name') or '')
              if 'saga-worker-probe' not in name:
                  continue
              matches.append({
                  'name': name,
                  'type': item.get('type') or item.get('resource_type') or state.get('type'),
                  'status': state.get('status') or spec.get('status'),
                  'id': state.get('id'),
              })

          result = {
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'probe_resource_count': len(matches),
              'probe_resources': matches,
          }
          Path('.github/saturn-resource-inventory.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Commit inventory evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/saturn-resource-inventory.json
          if git diff --cached --quiet; then
            echo "No inventory change to commit"
          else
            git commit -m "ci: record Saturn probe resource inventory"
            git push origin HEAD:experiment/saturn-worker
          fi
