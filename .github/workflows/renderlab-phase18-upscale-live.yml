name: RenderLab Phase 18 Upscale Live Proof

on:
  push:
    branches:
      - ops/renderlab-phase18-upscale-live
    paths:
      - .github/workflows/renderlab-phase18-upscale-live.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renderlab-phase18-upscale-live
  cancel-in-progress: false

jobs:
  deploy-and-prove:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      RENDERLAB_SOURCE_SHA: b5366b8487c194ace2ac84016ffbcdcf3ba0470d
      MODAL_ACCOUNT_LABEL: modal-45
      RENDERLAB_UPSCALE_WORKER_ID: renderlab-upscale-01
      RENDERLAB_UPSCALE_STATE_DICT: renderlab-image-upscale-worker-state-v1
      RENDERLAB_UPSCALE_GPU: A10
    steps:
      - name: Checkout ops repository
        uses: actions/checkout@v4

      - name: Checkout exact RenderLab worker source
        uses: actions/checkout@v4
        with:
          repository: faresmohamed260/renderlab
          ref: ${{ env.RENDERLAB_SOURCE_SHA }}
          path: renderlab-source

      - name: Guard exact source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C renderlab-source rev-parse HEAD)" = "$RENDERLAB_SOURCE_SHA"
          python renderlab-source/workers/image-upscale/verify_worker.py
          python -m py_compile renderlab-source/workers/image-upscale/modal_app.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deployment and proof tools
        run: python -m pip install --upgrade "modal==1.4.2" "requests==2.32.5" "Pillow==11.2.1"

      - name: Select verified-healthy Modal workspace credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          label = os.environ['MODAL_ACCOUNT_LABEL'].strip().lower()
          raw = os.environ.get('SAGA_MODAL_TOKENS_JSON', '').strip()
          if not raw:
              raise SystemExit('SAGA_MODAL_TOKENS_JSON is not configured')
          payload = json.loads(raw)
          accounts = payload.get('accounts') if isinstance(payload, dict) else payload
          if not isinstance(accounts, list):
              raise SystemExit('Modal roster is invalid')
          selected = None
          for account in accounts:
              if not isinstance(account, dict):
                  continue
              candidate = str(account.get('label') or account.get('name') or account.get('account') or '').strip().lower()
              if candidate == label:
                  selected = account
                  break
          if selected is None:
              raise SystemExit(f'Modal account {label} was not found')
          token_id = str(selected.get('token_id') or '').strip()
          token_secret = str(selected.get('token_secret') or '').strip()
          combined = str(selected.get('api_key') or selected.get('token') or '').strip()
          if (not token_id or not token_secret) and '.' in combined:
              token_id, token_secret = combined.split('.', 1)
          if not token_id or not token_secret:
              raise SystemExit(f'Modal account {label} credentials are incomplete')
          print(f'::add-mask::{token_id}')
          print(f'::add-mask::{token_secret}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'MODAL_TOKEN_ID={token_id}\n')
              handle.write(f'MODAL_TOKEN_SECRET={token_secret}\n')
          print(json.dumps({'modalAccount': label, 'credentialsResolved': True}))
          PY

      - name: Deploy RenderLab Upscale worker
        shell: bash
        run: |
          set -euo pipefail
          modal deploy renderlab-source/workers/image-upscale/modal_app.py | tee modal-deploy.log

      - name: Resolve deployed gateway URL
        shell: bash
        run: |
          set -euo pipefail
          URL=$(python - <<'PY'
          import modal
          fn = modal.Function.from_name('renderlab-image-upscale', 'web')
          print(fn.get_web_url())
          PY
          )
          test -n "$URL"
          echo "::add-mask::$URL"
          echo "UPSCALE_GATEWAY_URL=$URL" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          print(json.dumps({'gatewayResolved': True, 'app': 'renderlab-image-upscale', 'workerId': os.environ['RENDERLAB_UPSCALE_WORKER_ID']}))
          PY

      - name: Prove live worker contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/phase18-upscale-live
          python - <<'PY'
          import io
          import json
          import os
          import time
          from pathlib import Path

          import requests
          from PIL import Image

          base = os.environ['UPSCALE_GATEWAY_URL'].rstrip('/')
          evidence = {
              'sourceSha': os.environ['RENDERLAB_SOURCE_SHA'],
              'modalAccount': os.environ['MODAL_ACCOUNT_LABEL'],
              'workerId': os.environ['RENDERLAB_UPSCALE_WORKER_ID'],
              'app': 'renderlab-image-upscale',
              'tests': [],
          }
          call_ids = []

          def record(name, **fields):
              evidence['tests'].append({'name': name, **fields})
              print(json.dumps({'test': name, **fields}, sort_keys=True), flush=True)

          def png_bytes(size, mode='RGB', alpha=None):
              width, height = size
              if mode == 'RGBA':
                  image = Image.new('RGBA', size, (25, 80, 140, 255))
                  if alpha is not None:
                      for y in range(height):
                          for x in range(width):
                              image.putpixel((x, y), (25 + x % 100, 80 + y % 100, 140, alpha(x, y)))
              else:
                  image = Image.new('RGB', size)
                  pixels = image.load()
                  for y in range(height):
                      for x in range(width):
                          pixels[x, y] = ((x * 7 + y * 3) % 256, (x * 5 + 40) % 256, (y * 11 + 80) % 256)
              buffer = io.BytesIO()
              image.save(buffer, format='PNG')
              return buffer.getvalue()

          def jpeg_with_orientation(size, orientation):
              image = Image.new('RGB', size, (60, 120, 180))
              exif = Image.Exif()
              exif[274] = orientation
              buffer = io.BytesIO()
              image.save(buffer, format='JPEG', quality=90, exif=exif)
              return buffer.getvalue()

          def submit(payload, filename, content_type, scale=2):
              response = requests.post(
                  base + '/jobs/upscale',
                  files={'image_file': (filename, payload, content_type)},
                  data={'scale': str(scale)},
                  timeout=120,
              )
              body = None
              try:
                  body = response.json()
              except Exception:
                  body = response.text[:500]
              return response, body

          def poll_image(call_id, timeout_seconds=1800):
              deadline = time.time() + timeout_seconds
              last_state = None
              while time.time() < deadline:
                  response = requests.get(base + '/jobs/' + call_id, timeout=120)
                  if response.status_code == 200 and response.headers.get('content-type', '').startswith('image/png'):
                      return response.content
                  if response.status_code == 202:
                      state = response.json().get('worker_state')
                      if state != last_state:
                          print(json.dumps({'callId': call_id, 'workerState': state}), flush=True)
                          last_state = state
                      time.sleep(4)
                      continue
                  raise RuntimeError(f'poll failed status={response.status_code} body={response.text[:1000]}')
              raise TimeoutError(f'call {call_id} did not complete')

          health = requests.get(base + '/health', timeout=120)
          health.raise_for_status()
          health_payload = health.json()
          assert health_payload['ready'] is True
          assert health_payload['async_jobs'] is True
          assert health_payload['cancel_jobs'] is True
          assert health_payload['upscale_scales'] == [2]
          assert health_payload['output_content_types'] == ['image/png']
          assert health_payload['worker_id'] == os.environ['RENDERLAB_UPSCALE_WORKER_ID']
          assert health_payload['ecosystem'] == 'image-upscale-v1'
          assert health_payload['source']['commit'] == '33f616625268d08ba600f8db89388eec0328edb1'
          assert health_payload['source']['license'] == 'Apache-2.0'
          assert health_payload['model']['sha256'] == '2032ebf8f401dd3ce2fae5f3852117cb72101ec6ed8358faa64c2a3fa09ed4ac'
          assert health_payload['model']['bytes'] == 67277475
          assert health_payload['limits']['max_input_edge'] == 4096
          assert health_payload['limits']['max_input_pixels'] == 4194304
          assert health_payload['limits']['max_output_edge'] == 8192
          assert health_payload['limits']['max_output_pixels'] == 16777216
          evidence['health'] = health_payload
          record('health-provenance', ready=True)

          bad_scale, bad_scale_body = submit(png_bytes((8, 8)), 'bad-scale.png', 'image/png', scale=4)
          assert bad_scale.status_code == 400, (bad_scale.status_code, bad_scale_body)
          record('fixed-scale-rejection', status=bad_scale.status_code)

          oversize = png_bytes((4097, 1))
          oversized, oversized_body = submit(oversize, 'oversized.png', 'image/png')
          assert oversized.status_code == 400, (oversized.status_code, oversized_body)
          assert '4096' in json.dumps(oversized_body)
          record('geometry-ceiling-rejection', status=oversized.status_code)

          rgb_payload = png_bytes((48, 32))
          rgb_submit, rgb_body = submit(rgb_payload, 'rgb.png', 'image/png')
          assert rgb_submit.status_code == 200, (rgb_submit.status_code, rgb_body)
          assert rgb_body['status'] == 'queued'
          assert (rgb_body['source_width'], rgb_body['source_height']) == (48, 32)
          assert (rgb_body['output_width'], rgb_body['output_height']) == (96, 64)
          assert rgb_body['alpha'] is False
          rgb_call = rgb_body['call_id']
          call_ids.append(rgb_call)
          rgb_result = poll_image(rgb_call)
          with Image.open(io.BytesIO(rgb_result)) as output:
              assert output.format == 'PNG'
              assert output.size == (96, 64)
              assert output.mode == 'RGB'
          Path('artifacts/phase18-upscale-live/rgb-output.png').write_bytes(rgb_result)
          record('rgb-2x-result', source=[48, 32], output=[96, 64], bytes=len(rgb_result))

          alpha_payload = png_bytes((31, 19), mode='RGBA', alpha=lambda x, y: (x * 17 + y * 13) % 256)
          alpha_submit, alpha_body = submit(alpha_payload, 'alpha.png', 'image/png')
          assert alpha_submit.status_code == 200, (alpha_submit.status_code, alpha_body)
          assert alpha_body['alpha'] is True
          alpha_call = alpha_body['call_id']
          call_ids.append(alpha_call)
          alpha_result = poll_image(alpha_call)
          with Image.open(io.BytesIO(alpha_result)) as output:
              assert output.format == 'PNG'
              assert output.size == (62, 38)
              assert output.mode == 'RGBA'
              extrema = output.getchannel('A').getextrema()
              assert extrema[0] < 255 and extrema[1] > 0
          Path('artifacts/phase18-upscale-live/alpha-output.png').write_bytes(alpha_result)
          record('alpha-2x-result', source=[31, 19], output=[62, 38], bytes=len(alpha_result))

          exif_payload = jpeg_with_orientation((30, 20), 6)
          exif_submit, exif_body = submit(exif_payload, 'orientation-6.jpg', 'image/jpeg')
          assert exif_submit.status_code == 200, (exif_submit.status_code, exif_body)
          assert (exif_body['source_width'], exif_body['source_height']) == (20, 30)
          assert (exif_body['output_width'], exif_body['output_height']) == (40, 60)
          exif_call = exif_body['call_id']
          call_ids.append(exif_call)
          exif_result = poll_image(exif_call)
          with Image.open(io.BytesIO(exif_result)) as output:
              assert output.format == 'PNG'
              assert output.size == (40, 60)
          Path('artifacts/phase18-upscale-live/exif-output.png').write_bytes(exif_result)
          record('exif-orientation-2x-result', normalizedSource=[20, 30], output=[40, 60], bytes=len(exif_result))

          frames = [Image.new('RGBA', (12, 10), (255, 0, 0, 255)), Image.new('RGBA', (12, 10), (0, 0, 255, 255))]
          animated_buffer = io.BytesIO()
          frames[0].save(animated_buffer, format='WEBP', save_all=True, append_images=frames[1:], duration=100, loop=0)
          animated, animated_body = submit(animated_buffer.getvalue(), 'animated.webp', 'image/webp')
          assert animated.status_code == 400, (animated.status_code, animated_body)
          assert 'animated or multi-frame' in json.dumps(animated_body)
          record('animated-source-rejection', status=animated.status_code)

          cancel_payload = png_bytes((2048, 2048))
          cancel_submit, cancel_body = submit(cancel_payload, 'cancel.png', 'image/png')
          assert cancel_submit.status_code == 200, (cancel_submit.status_code, cancel_body)
          cancel_call = cancel_body['call_id']
          call_ids.append(cancel_call)
          cancel_response = requests.delete(base + '/jobs/' + cancel_call, timeout=120)
          assert cancel_response.status_code == 200, (cancel_response.status_code, cancel_response.text[:500])
          cancel_json = cancel_response.json()
          assert cancel_json['status'] == 'cancelled'
          cancelled_terminal = False
          for _ in range(30):
              follow = requests.get(base + '/jobs/' + cancel_call, timeout=120)
              if follow.status_code == 202:
                  time.sleep(2)
                  continue
              if follow.status_code == 200 and follow.headers.get('content-type', '').startswith('image/png'):
                  raise AssertionError('cancelled job unexpectedly produced an image result')
              cancelled_terminal = True
              break
          assert cancelled_terminal, 'cancelled call did not leave running state'
          record('async-cancellation', deleteStatus=cancel_response.status_code, terminalWithoutImage=True)

          boundary_payload = png_bytes((4096, 1024))
          boundary_submit, boundary_body = submit(boundary_payload, 'boundary.png', 'image/png')
          assert boundary_submit.status_code == 200, (boundary_submit.status_code, boundary_body)
          assert (boundary_body['output_width'], boundary_body['output_height']) == (8192, 2048)
          boundary_call = boundary_body['call_id']
          call_ids.append(boundary_call)
          boundary_result = poll_image(boundary_call)
          with Image.open(io.BytesIO(boundary_result)) as output:
              assert output.format == 'PNG'
              assert output.size == (8192, 2048)
          Path('artifacts/phase18-upscale-live/boundary-output.png').write_bytes(boundary_result)
          record('accepted-boundary-result-transport', source=[4096, 1024], output=[8192, 2048], bytes=len(boundary_result))

          final_health = requests.get(base + '/health', timeout=120)
          final_health.raise_for_status()
          final_payload = final_health.json()
          worker = final_payload.get('worker') or {}
          assert worker.get('ready') is True
          assert worker.get('source_commit') == '33f616625268d08ba600f8db89388eec0328edb1'
          assert worker.get('weight_sha256') == '2032ebf8f401dd3ce2fae5f3852117cb72101ec6ed8358faa64c2a3fa09ed4ac'
          evidence['finalHealth'] = final_payload
          evidence['callIds'] = call_ids
          evidence['persistentFixtures'] = {'supabase': 0, 'r2': 0}
          evidence['result'] = 'passed'
          Path('artifacts/phase18-upscale-live/evidence.json').write_text(json.dumps(evidence, indent=2, sort_keys=True), encoding='utf-8')
          print(json.dumps({'phase18A': 'live-proof-passed', 'tests': len(evidence['tests']), 'persistentFixtures': evidence['persistentFixtures']}, sort_keys=True))
          PY

      - name: Hash live-proof evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f artifacts/phase18-upscale-live/evidence.json ]; then
            sha256sum artifacts/phase18-upscale-live/evidence.json | tee artifacts/phase18-upscale-live/evidence.sha256
          fi

      - name: Upload live-proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderlab-phase18-upscale-live-proof
          path: artifacts/phase18-upscale-live
          if-no-files-found: warn
          retention-days: 30
