name: Smoke Test FLUX.2 Klein 9B modal-01

on:
  push:
    branches:
      - studio/flux2-klein-smoke
    paths:
      - ".github/workflows/smoke-flux2-klein-modal01.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      MODAL_FLUX2_KLEIN_GPU: A10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Modal
        run: python -m pip install --upgrade "modal==1.4.2"

      - name: Select and mask modal-01 credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          payload = json.loads(os.environ["SAGA_MODAL_TOKENS_JSON"])
          accounts = payload if isinstance(payload, list) else payload.get("accounts") or payload.get("tokens") or payload.get("roster") or []
          selected = None
          for account in accounts:
              if not isinstance(account, dict):
                  continue
              label = str(account.get("label") or account.get("name") or account.get("account") or "").strip().lower()
              if label in {"modal-01", "modal01", "modal-1", "account-01", "account-1"}:
                  selected = account
                  break
          selected = selected or accounts[0]
          token_id = str(selected.get("token_id") or "").strip()
          token_secret = str(selected.get("token_secret") or "").strip()
          combined = str(selected.get("api_key") or selected.get("token") or "").strip()
          if (not token_id or not token_secret) and "." in combined:
              token_id, token_secret = combined.split(".", 1)
          if not token_id or not token_secret:
              raise SystemExit("modal-01 credentials are incomplete")
          print(f"::add-mask::{token_id}")
          print(f"::add-mask::{token_secret}")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"MODAL_TOKEN_ID={token_id}\n")
              handle.write(f"MODAL_TOKEN_SECRET={token_secret}\n")
          PY

      - name: Patch diagnostic HTTP error handling and redeploy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("integrations/comfyui/flux2_klein_app.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace("import urllib.parse\nimport urllib.request\n", "import urllib.error\nimport urllib.parse\nimport urllib.request\n")
          old = '''def _request_json(url: str, data: bytes | None = None) -> Any:\n    request = urllib.request.Request(url, data=data)\n    with urllib.request.urlopen(request, timeout=120) as response:\n        return json.loads(response.read().decode("utf-8"))\n'''
          new = '''def _request_json(url: str, data: bytes | None = None) -> Any:\n    request = urllib.request.Request(url, data=data)\n    try:\n        with urllib.request.urlopen(request, timeout=120) as response:\n            return json.loads(response.read().decode("utf-8"))\n    except urllib.error.HTTPError as exc:\n        body = exc.read().decode("utf-8", errors="replace")\n        raise RuntimeError(f"HTTP {exc.code} from {url}: {body or exc.reason}") from None\n'''
          if old not in text:
              raise SystemExit("request helper pattern not found")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          modal deploy integrations/comfyui/flux2_klein_app.py

      - name: Run real image-edit smoke test
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, modal, time
          png = base64.b64decode("")
          cls = modal.Cls.from_name("saga-flux2-klein-9b", "Flux2KleinWorker")
          started = time.perf_counter()
          result = cls().edit.remote(
              image_bytes=png,
              filename="smoke.png",
              prompt="Turn the blue square into a glossy red cube while keeping the orange circle visible.",
              seed=42,
              steps=4,
              cfg=1.0,
              megapixels=0.25,
          )
          payload = {"success": bool(result), "bytes": len(result or b""), "elapsed_seconds": round(time.perf_counter() - started, 3)}
          print(json.dumps(payload))
          if len(result or b"") < 1000:
              raise SystemExit("Smoke test returned no usable image")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"SMOKE_BYTES={len(result)}\n")
          PY

      - name: Publish smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          SMOKE_BYTES: ${{ env.SMOKE_BYTES }}
        run: |
          TITLE="[automation] FLUX.2 Klein modal-01 smoke status"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            'Real FLUX.2 Klein 9B image-edit smoke test.' \
            '' \
            "- Status: **${JOB_STATUS}**" \
            '- Target: modal-01 / A10' \
            '- Steps: 4' \
            "- Output bytes: ${SMOKE_BYTES:-0}" \
            "- Run: ${RUN_URL}")
          ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search '"[automation] FLUX.2 Klein modal-01 smoke status" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
