name: Phase 3 BookNLP real benchmark experiment

on:
  workflow_dispatch:
  push:
    branches:
      - v2/phase-3a-booknlp-real-benchmark
    paths:
      - ".github/workflows/v2-phase3-booknlp-experiment.yml"
      - "services/analysis-worker/benchmarks/run_booknlp_litbank.py"
      - "services/analysis-worker/benchmarks/litbank-novel-diversity.v1.json"
      - "services/analysis-worker/src/evaluation/booknlp-litbank-cli.ts"
      - "services/analysis-worker/src/evaluation/stratified-identity-*.ts"
      - "services/analysis-worker/src/local-analysis/**"
      - "services/analysis-worker/tests/stratified-identity-benchmark.test.ts"
      - "services/analysis-worker/package.json"

permissions:
  contents: read

concurrency:
  group: saga-phase3-booknlp-real-benchmark
  cancel-in-progress: true

jobs:
  booknlp-small-full-litbank:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: services/analysis-worker

    steps:
      - name: Checkout exact S.A.G.A. source
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank corpus
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned BookNLP compatibility candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.3.1"
          python -m pip install "click==8.1.7" "spacy==3.7.5" "transformers==4.43.4"
          python -m pip install --no-deps "git+https://github.com/Plazmius/booknlp.git@8875a1b616d764b7d13d1e30e9949cc21ca303c1"
          python -m spacy download en_core_web_sm
          python - <<'PY'
          import importlib.metadata
          for package in ["booknlp", "click", "spacy", "torch", "tensorflow", "transformers"]:
              try:
                  print(f"{package}={importlib.metadata.version(package)}")
              except importlib.metadata.PackageNotFoundError:
                  print(f"{package}=missing")
          PY

      - name: Run BookNLP small on all pinned LitBank documents
        run: >-
          python benchmarks/run_booknlp_litbank.py
          --litbank-root ../../external/litbank
          --output-root evaluation-artifacts/booknlp-output
          --metadata-out evaluation-artifacts/booknlp-run-metadata.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/analysis-worker/package.json

      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck evaluator
        run: npm run typecheck

      - name: Run evaluator tests
        run: npm test

      - name: Evaluate real BookNLP output through S.A.G.A.
        run: >-
          npm run benchmark:booknlp-litbank --
          --litbank-root ../../external/litbank
          --booknlp-root evaluation-artifacts/booknlp-output
          --out evaluation-artifacts/booknlp-litbank-full.json

      - name: Slice quality by novel diversity strata
        run: >-
          npm run benchmark:identity-strata --
          --report evaluation-artifacts/booknlp-litbank-full.json
          --manifest benchmarks/litbank-novel-diversity.v1.json
          --out evaluation-artifacts/booknlp-litbank-diversity.json

      - name: Publish experiment summary
        shell: bash
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/booknlp-litbank-full.json", "utf8"));
          const runtime = JSON.parse(fs.readFileSync("evaluation-artifacts/booknlp-run-metadata.json", "utf8"));
          const diversity = JSON.parse(fs.readFileSync("evaluation-artifacts/booknlp-litbank-diversity.json", "utf8"));
          const m = report.aggregate.metrics;
          const byPrecision = [...diversity.strata].sort((a, b) => a.aggregate.metrics.canonicalPrecision - b.aggregate.metrics.canonicalPrecision);
          const byMerge = [...diversity.strata].sort((a, b) => b.aggregate.metrics.incorrectMergeRate - a.aggregate.metrics.incorrectMergeRate);
          const byRecall = [...diversity.strata].sort((a, b) => a.aggregate.metrics.canonicalRecall - b.aggregate.metrics.canonicalRecall);
          console.log("## Phase 3 BookNLP-small full LitBank + diversity experiment");
          console.log("");
          console.log(`- LitBank commit: \`${report.dataset.commit}\``);
          console.log(`- BookNLP revision: \`${report.provider.revision}\``);
          console.log(`- Attempted/completed/failed: ${report.dataset.attemptedDocumentCount}/${report.dataset.completedDocumentCount}/${report.dataset.failedDocumentCount}`);
          console.log(`- Canonical precision: ${m.canonicalPrecision.toFixed(4)}`);
          console.log(`- Canonical recall: ${m.canonicalRecall.toFixed(4)}`);
          console.log(`- Incorrect merge rate: ${m.incorrectMergeRate.toFixed(4)}`);
          console.log(`- Contaminated canonical rate: ${m.contaminatedCanonicalRate.toFixed(4)}`);
          console.log(`- Fragmentation rate: ${m.fragmentationRate.toFixed(4)}`);
          console.log(`- Linked mention precision: ${m.linkedMentionPrecision.toFixed(4)}`);
          console.log(`- Linked mention recall: ${m.linkedMentionRecall.toFixed(4)}`);
          console.log(`- Non-person quarantine rate: ${m.nonPersonQuarantineRate.toFixed(4)}`);
          console.log(`- Runtime: ${runtime.wallClockSeconds.toFixed(2)} s`);
          console.log(`- Peak RSS: ${runtime.peakResidentMemoryMb.toFixed(1)} MiB`);
          console.log(`- Model artifacts: ${(runtime.modelArtifactBytes / 1024 / 1024).toFixed(1)} MiB`);
          console.log(`- Aggregate output fingerprint: \`${report.aggregateOutputFingerprint}\``);
          console.log(`- Diversity report fingerprint: \`${diversity.reportFingerprint}\``);
          console.log(`- Diversity strata/dimensions/docs: ${diversity.coverage.stratumCount}/${diversity.coverage.dimensionCount}/${diversity.coverage.uniqueDocumentCount}`);
          console.log(`- Lowest precision stratum: ${byPrecision[0].label} (${byPrecision[0].aggregate.metrics.canonicalPrecision.toFixed(4)})`);
          console.log(`- Lowest recall stratum: ${byRecall[0].label} (${byRecall[0].aggregate.metrics.canonicalRecall.toFixed(4)})`);
          console.log(`- Highest merge stratum: ${byMerge[0].label} (${byMerge[0].aggregate.metrics.incorrectMergeRate.toFixed(4)})`);
          console.log(`- TensorFlow installed: ${runtime.packages.tensorflow !== null}`);
          console.log(`- Code license: ${report.providerCodeLicense}`);
          console.log(`- Model-weight license: ${report.providerModelWeightsLicense}`);
          EOF

      - name: Upload experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: saga-phase3-booknlp-small-full-litbank
          path: |
            services/analysis-worker/evaluation-artifacts/booknlp-litbank-full.json
            services/analysis-worker/evaluation-artifacts/booknlp-litbank-diversity.json
            services/analysis-worker/evaluation-artifacts/booknlp-run-metadata.json
          if-no-files-found: error
          retention-days: 90
