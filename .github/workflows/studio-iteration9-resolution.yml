name: Studio Iteration 9 Resolution Terminology

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

# Temporary remote implementation/review workflow. It self-removes after green validation.
jobs:
  implement-and-review:
    if: github.event.pull_request.head.ref == 'studio/video-gallery-ux'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Apply Item 09 product patch
        run: python apps/studio/scripts/iteration9_resolution_refine.py
      - name: Check product diff
        run: git diff --check
      - name: Install Studio dependencies
        working-directory: apps/studio
        run: npm install --no-audit --no-fund
      - name: Build and run resolution contract
        working-directory: apps/studio
        run: npm run build
      - name: Run poster and deferred-preview contract
        working-directory: apps/studio
        run: npm run test:poster
      - name: Install Playwright Chromium
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium
      - name: Start GitHub runner preview
        working-directory: apps/studio
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          echo $! > /tmp/saga-studio-preview.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1
      - name: Capture Item 09 visual and interaction evidence
        working-directory: apps/studio
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:preview
      - name: Publish Item 09 visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-iteration9-resolution-${{ github.run_id }}
          path: apps/studio/visual-preview
          if-no-files-found: warn
          retention-days: 7
      - name: Commit validated product changes
        if: success()
        run: |
          set -euo pipefail
          rm apps/studio/scripts/iteration9_resolution_patch.py
          rm apps/studio/scripts/iteration9_resolution_refine.py
          rm .github/workflows/studio-iteration9-resolution.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A apps/studio .github/workflows/studio-iteration9-resolution.yml
          git diff --cached --check
          git commit -m 'feat(studio): clarify resolution delivery dimensions'
          git push origin HEAD:studio/video-gallery-ux
