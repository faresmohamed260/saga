name: Studio Fancy Select Focus Fix

on:
  push:
    branches:
      - studio/advanced-ui-audit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/advanced-ui-audit
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Apply FancySelect focus patch
        run: python scripts/apply_studio_fancy_select_focus_fix.py

      - name: Verify Studio build
        working-directory: apps/studio
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit product fix and remove patch helpers
        shell: bash
        run: |
          rm .github/workflows/studio-fancy-select-focus-fix.yml scripts/apply_studio_fancy_select_focus_fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(studio): focus portaled select options after render"
          git push origin HEAD:studio/advanced-ui-audit
