name: Reconcile Phase 1 completion state

on:
  push:
    branches:
      - docs/phase-1-hosted-completion
    paths:
      - .github/workflows/ops-reconcile-phase-1-completion.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/phase-1-hosted-completion
          fetch-depth: 0

      - name: Reconcile authoritative docs
        run: python3 .github/scripts/reconcile_phase1_completion.py

      - name: Commit reconciliation and remove temporary helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/ops-reconcile-phase-1-completion.yml
          git rm .github/scripts/reconcile_phase1_completion.py
          git add PROJECT.md docs/README.md docs/phases/PHASE_V2_1_CLOSED_DEMO_APP.md
          git diff --cached --check
          git commit -m "Reconcile Phase 1 hosted completion"
          git push origin HEAD:docs/phase-1-hosted-completion
