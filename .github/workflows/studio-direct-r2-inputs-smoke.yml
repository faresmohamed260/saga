name: Studio Direct R2 Inputs Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/studio-direct-r2-inputs-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORIGIN: https://studio.faresuniform.uk
    steps:
      - name: Verify direct R2 upload and keyed generation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import struct, zlib
          w = h = 128
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w): raw.extend((x % 256, y % 256, 128))
          def chunk(k,d): return struct.pack('>I',len(d))+k+d+struct.pack('>I',zlib.crc32(k+d)&0xffffffff)
          png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(bytes(raw),9))+chunk(b'IEND',b'')
          open('/tmp/input.png','wb').write(png)
          PY

          ticket_status=$(curl -sS -o /tmp/ticket.json -w '%{http_code}' \
            -X POST "$ORIGIN/api/uploads" -H 'Content-Type: application/json' \
            --data "{\"filename\":\"input.png\",\"contentType\":\"image/png\",\"size\":$(stat -c%s /tmp/input.png)}")
          echo "ticket_status=$ticket_status"; cat /tmp/ticket.json
          test "$ticket_status" = "201"
          upload_url=$(jq -r '.uploadUrl // empty' /tmp/ticket.json)
          source_key=$(jq -r '.key // empty' /tmp/ticket.json)
          test -n "$upload_url"; test -n "$source_key"

          preflight=$(curl -sS -o /tmp/preflight.txt -D /tmp/preflight.headers -w '%{http_code}' -X OPTIONS "$upload_url" \
            -H 'Origin: https://studio.faresuniform.uk' \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: content-type')
          echo "preflight_status=$preflight"
          grep -qi '^access-control-allow-origin: https://studio.faresuniform.uk' /tmp/preflight.headers
          grep -qi '^access-control-allow-methods:.*PUT' /tmp/preflight.headers

          put_status=$(curl -sS -o /tmp/put.txt -w '%{http_code}' -X PUT "$upload_url" -H 'Content-Type: image/png' --data-binary @/tmp/input.png)
          echo "put_status=$put_status"; test "$put_status" = "200"

          submit_status=$(curl -sS -o /tmp/submit.json -w '%{http_code}' \
            -X POST "$ORIGIN/api/generate" -H 'Content-Type: application/json' \
            --data "{\"workflowId\":\"flux2-klein-image-edit\",\"sourceKey\":\"$source_key\",\"sourceFilename\":\"input.png\",\"prompt\":\"Preserve the simple gradient composition.\",\"negativePrompt\":\"\",\"resolution\":\"0.25 MP\",\"seed\":42,\"steps\":4,\"cfg\":1.0,\"megapixels\":0.25}")
          echo "submit_status=$submit_status"; cat /tmp/submit.json
          test "$submit_status" = "202"
          jq -e '.inputTransport == "r2"' /tmp/submit.json >/dev/null
          job_id=$(jq -r '.job.id // empty' /tmp/submit.json); test -n "$job_id"

          cleanup() { curl -sS -X DELETE "$ORIGIN/api/generations?id=$job_id" >/dev/null || true; }
          trap cleanup EXIT

          completed=0
          for attempt in $(seq 1 90); do
            status=$(curl -sS -o /tmp/result.json -w '%{http_code}' "$ORIGIN/api/generate/result?jobId=$job_id")
            echo "poll=$attempt status=$status"
            if [ "$status" = "202" ]; then sleep 10; continue; fi
            test "$status" = "200"
            jq -e '.status == "completed" and .persisted == true and (.mediaUrl|length>0) and (.thumbnailUrl|length>0)' /tmp/result.json >/dev/null
            completed=1
            break
          done
          test "$completed" = "1"

          job_status=$(curl -sS -o /tmp/job.json -w '%{http_code}' "$ORIGIN/api/jobs?id=$job_id")
          test "$job_status" = "200"
          jq -e --arg key "$source_key" '.job.metadata.inputTransport == "r2" and .job.metadata.sourceR2Key == $key and .job.status == "completed"' /tmp/job.json >/dev/null
          echo 'Direct R2 input smoke passed'
