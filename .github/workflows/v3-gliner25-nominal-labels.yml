name: V3 GLiNER2.5 Nominal Label Probe

on:
  push:
    branches:
      - v3/qualification-gliner25-nominal-labels

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/v3-gliner-qualification.txt
      - name: Install CPU Torch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install GLiNER qualification environment
        run: python -m pip install -r requirements/v3-gliner-qualification.txt

      - name: Probe nominal-oriented labels
        shell: bash
        run: |
          set -euo pipefail
          labels=(
            "character description"
            "character role"
            "character title"
            "character reference"
            "person description"
            "person role"
            "person reference"
          )
          slugs=(
            "character-description"
            "character-role"
            "character-title"
            "character-reference"
            "person-description"
            "person-role"
            "person-reference"
          )
          for i in "${!labels[@]}"; do
            python -m scripts.run_v3_gliner_threshold_sweep \
              --root external/litbank \
              --out "evaluation-artifacts/${slugs[$i]}.json" \
              --limit 5 \
              --thresholds "0.3,0.5" \
              --character-labels "${labels[$i]}" \
              --device cpu \
              --model-cache .cache/huggingface
          done

      - name: Publish nominal comparison
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path("evaluation-artifacts").glob("*.json")):
              report = json.loads(path.read_text())
              label = report["characterLabels"][0]
              for result in report["results"]:
                  metrics = result["aggregate"]["metrics"]
                  rows.append((label, result["threshold"], metrics))
          rows.sort(key=lambda row: (-row[2]["nominal_recall"], -row[2]["precision"], row[0], row[1]))
          print("## GLiNER2.5 nominal-oriented label probe — 5 LitBank documents")
          print()
          print("| Label | Threshold | Precision | Recall | F1 | Proper | Nominal | Pronoun |")
          print("|---|---:|---:|---:|---:|---:|---:|---:|")
          for label, threshold, m in rows:
              print(f"| {label} | {threshold:.2f} | {m['precision']:.4f} | {m['recall']:.4f} | {m['f1']:.4f} | {m['proper_name_recall']:.4f} | {m['nominal_recall']:.4f} | {m['pronoun_recall']:.4f} |")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: saga-v3-gliner25-nominal-labels-${{ github.sha }}
          path: evaluation-artifacts/*.json
          if-no-files-found: error
          retention-days: 90
