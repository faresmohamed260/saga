name: Iteration 14 Checklist

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/iteration14_checklist.py"
      - ".github/workflows/iteration14-checklist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Mark Iteration 14 complete
        run: python scripts/iteration14_checklist.py
      - name: Commit checklist closure
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-ui-polish-checklist.md
          if git diff --cached --quiet; then
            echo "No checklist changes to commit"
            exit 0
          fi
          git commit -m "docs: complete Iteration 14"
          git push origin HEAD:studio/video-gallery-ux
