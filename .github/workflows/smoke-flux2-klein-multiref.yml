name: Smoke FLUX.2 Klein multi-reference edit

on:
  push:
    branches:
      - studio/edit-reference-ux
    paths:
      - ".github/workflows/smoke-flux2-klein-multiref.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pillow requests
      - name: Generate two synthetic references and run a real provider job
        env:
          GATEWAY: https://faresmohamed260--saga-flux2-klein-gateway-web.modal.run
        shell: bash
        run: |
          python - <<'PY'
          import io, os, time
          import requests
          from PIL import Image, ImageDraw

          def image_one():
              im = Image.new('RGB', (320, 256), (238, 228, 207))
              d = ImageDraw.Draw(im)
              d.rectangle((30, 50, 145, 220), fill=(55, 95, 170))
              d.ellipse((170, 55, 285, 205), fill=(215, 95, 70))
              return im

          def image_two():
              im = Image.new('RGB', (256, 320), (35, 39, 47))
              d = ImageDraw.Draw(im)
              d.rectangle((45, 50, 210, 130), fill=(70, 185, 125))
              d.polygon([(55, 260), (128, 150), (205, 260)], fill=(230, 190, 65))
              return im

          buffers=[]
          for image in (image_one(), image_two()):
              buf=io.BytesIO(); image.save(buf, format='PNG'); buffers.append(buf.getvalue())

          gateway=os.environ['GATEWAY'].rstrip('/')
          health=requests.get(gateway+'/health', timeout=30)
          health.raise_for_status()
          payload=health.json()
          assert payload.get('multiple_references') is True, payload

          files=[
              ('image_files', ('image-1.png', buffers[0], 'image/png')),
              ('image_files', ('image-2.png', buffers[1], 'image/png')),
          ]
          data={
              'prompt': 'Using @Image 1 as the primary canvas, keep its composition and incorporate the green rectangular motif from @Image 2 as a subtle design element.',
              'negative_prompt': '',
              'seed': '42',
              'steps': '4',
              'cfg': '1.0',
              'megapixels': '0.25',
          }
          submit=requests.post(gateway+'/jobs/edit', files=files, data=data, timeout=60)
          print('submit', submit.status_code, submit.text[:400])
          submit.raise_for_status()
          body=submit.json()
          assert body.get('reference_count') == 2, body
          call_id=body['call_id']

          deadline=time.time()+30*60
          while time.time()<deadline:
              result=requests.get(gateway+'/jobs/'+call_id, headers={'Accept':'image/*, application/json'}, timeout=60)
              if result.status_code == 202:
                  time.sleep(3); continue
              print('result', result.status_code, result.headers.get('content-type'), len(result.content))
              result.raise_for_status()
              assert result.headers.get('content-type','').startswith('image/'), result.headers
              assert len(result.content) > 10_000, len(result.content)
              with open('/tmp/multiref-output.png','wb') as handle: handle.write(result.content)
              print({'multi_reference_smoke': 'passed', 'call_id': call_id, 'bytes': len(result.content)})
              break
          else:
              raise SystemExit('multi-reference provider job timed out')
          PY
      - name: Publish smoke status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          TITLE="[automation] FLUX.2 Klein multi-reference smoke"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf 'Status: **%s**\n\nBranch: %s\n\nReal provider test with two synthetic references at 0.25 MP.\n\nRun: %s\n' "$JOB_STATUS" "${{ github.ref_name }}" "$RUN_URL")
          ISSUE=$(gh issue list --repo "${{ github.repository }}" --state open --search '"[automation] FLUX.2 Klein multi-reference smoke" in:title' --json number --jq '.[0].number // empty')
          if [ -n "$ISSUE" ]; then gh issue edit "$ISSUE" --repo "${{ github.repository }}" --body "$BODY"; else gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"; fi
