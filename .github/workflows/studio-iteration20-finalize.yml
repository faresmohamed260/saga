name: Studio Iteration 20 Finalize

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/studio_iteration20_finalize.py"
      - ".github/workflows/studio-iteration20-finalize.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/studio_iteration20_finalize.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/studio-ui-polish-checklist.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: complete Iteration 20"
          git push origin HEAD:studio/video-gallery-ux
