name: Studio Range Sync Fix Once

on:
  push:
    branches:
      - studio/mobile-gallery-create-followup
    paths:
      - .github/workflows/studio-range-sync-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/mobile-gallery-create-followup
      - name: Sync numeric drafts before paint
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/studio/src/create-controls.jsx')
          text = path.read_text()
          old_import = "  forwardRef, useEffect, useImperativeHandle, useMemo, useRef, useState,\n"
          new_import = "  forwardRef, useEffect, useImperativeHandle, useLayoutEffect, useMemo, useRef, useState,\n"
          if old_import not in text:
              raise SystemExit('React import anchor not found')
          text = text.replace(old_import, new_import, 1)
          old = """  useEffect(() => {\n    if (!focusedRef.current) setDraft(String(Number.isFinite(Number(value)) ? Number(value) : min));\n  });\n"""
          new = """  useLayoutEffect(() => {\n    if (!focusedRef.current) setDraft(String(Number.isFinite(Number(value)) ? Number(value) : min));\n  }, [value, min]);\n"""
          if old not in text:
              raise SystemExit('RangeField sync anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/create-controls.jsx
          git commit -m "fix(studio): sync range drafts before reset assertions [range-sync-layout]"
          git push origin HEAD:studio/mobile-gallery-create-followup

# one-shot trigger
