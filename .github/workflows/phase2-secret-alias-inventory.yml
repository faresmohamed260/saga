name: Phase 2 hosted proof secret alias inventory

on:
  push:
    branches:
      - ops/phase2-hosted-proof
    paths:
      - .github/workflows/phase2-secret-alias-inventory.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SAGA_B2_KEY_ID: ${{ secrets.SAGA_B2_KEY_ID }}
      SAGA_B2_APP_KEY: ${{ secrets.SAGA_B2_APP_KEY }}
      SAGA_B2_MASTER_KEY_ID: ${{ secrets.SAGA_B2_MASTER_KEY_ID }}
      SAGA_B2_MASTER_APPLICATION_KEY: ${{ secrets.SAGA_B2_MASTER_APPLICATION_KEY }}
      SAGA_B2_MASTER_KEY: ${{ secrets.SAGA_B2_MASTER_KEY }}
      SAGA_B2_APPLICATION_KEY_ID: ${{ secrets.SAGA_B2_APPLICATION_KEY_ID }}
      SAGA_B2_APPLICATION_KEY: ${{ secrets.SAGA_B2_APPLICATION_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      BACKBLAZE_KEY_ID: ${{ secrets.BACKBLAZE_KEY_ID }}
      BACKBLAZE_APPLICATION_KEY: ${{ secrets.BACKBLAZE_APPLICATION_KEY }}
      BACKBLAZE_B2_KEY_ID: ${{ secrets.BACKBLAZE_B2_KEY_ID }}
      BACKBLAZE_B2_APPLICATION_KEY: ${{ secrets.BACKBLAZE_B2_APPLICATION_KEY }}
      SAGA_SUPABASE_ACCESS_TOKEN: ${{ secrets.SAGA_SUPABASE_ACCESS_TOKEN }}
      SAGA_SUPABASE_SECRET_KEY: ${{ secrets.SAGA_SUPABASE_SECRET_KEY }}
      SAGA_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SAGA_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ACCESS_TOKEN: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
      SAGA_VERCEL_TOKEN: ${{ secrets.SAGA_VERCEL_TOKEN }}
      SAGA_VERCEL_ACCESS_TOKEN: ${{ secrets.SAGA_VERCEL_ACCESS_TOKEN }}
    steps:
      - name: Report populated aliases without values
        shell: bash
        run: |
          set -euo pipefail
          report_group() {
            label="$1"; shift
            found=0
            echo "${label}:"
            for name in "$@"; do
              if [ -n "${!name:-}" ]; then
                echo "  ${name}=present"
                found=1
              fi
            done
            if [ "$found" -eq 0 ]; then
              echo "  none"
            fi
          }

          report_group "Backblaze credential aliases" \
            SAGA_B2_KEY_ID SAGA_B2_APP_KEY SAGA_B2_MASTER_KEY_ID \
            SAGA_B2_MASTER_APPLICATION_KEY SAGA_B2_MASTER_KEY \
            SAGA_B2_APPLICATION_KEY_ID SAGA_B2_APPLICATION_KEY \
            B2_KEY_ID B2_APP_KEY B2_APPLICATION_KEY_ID B2_APPLICATION_KEY \
            BACKBLAZE_KEY_ID BACKBLAZE_APPLICATION_KEY \
            BACKBLAZE_B2_KEY_ID BACKBLAZE_B2_APPLICATION_KEY

          report_group "Supabase privileged/management aliases" \
            SAGA_SUPABASE_ACCESS_TOKEN SAGA_SUPABASE_SECRET_KEY \
            SAGA_SUPABASE_SERVICE_ROLE_KEY SUPABASE_SECRET_KEY \
            SUPABASE_SERVICE_ROLE_KEY

          report_group "Vercel token aliases" \
            VERCEL_TOKEN VERCEL_ACCESS_TOKEN VERCEL_API_TOKEN \
            SAGA_VERCEL_TOKEN SAGA_VERCEL_ACCESS_TOKEN

          echo "Only secret presence was inspected; no secret value was printed."
