name: Provision Modal Worker Fleet

on:
  push:
    branches:
      - studio/qwen-image-edit-2511
    paths:
      - ".github/workflows/modal-worker-provision.yml"
      - "integrations/qwen/qwen_image_edit_2511_app.py"
      - "integrations/qwen/qwen_image_edit_2511_gateway.py"
      - "integrations/qwen/qwen_civitai_prefetch.py"
      - "scripts/qwen_civitai_prefetch.py"
      - "scripts/modal_worker_fleet.py"
      - "config/modal-worker-ecosystems.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modal-worker-provision-qwen-2511
  cancel-in-progress: false

jobs:
  provision:
    name: ${{ matrix.worker_id }} on ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - account: modal-42
            ecosystem: qwen-image-edit-2511
            worker_id: qwen-primary-01
            role: primary
            order: 0
            display_name: Qwen Image Edit 2511 · Primary
          - account: modal-43
            ecosystem: qwen-image-edit-2511
            worker_id: qwen-standby-01
            role: standby
            order: 1
            display_name: Qwen Image Edit 2511 · Standby
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
      SAGA_MODAL_WORKER_VOLUME: saga-qwen-image-edit-2511-cache
      MODAL_QWEN_IMAGE_EDIT_GPU: A10:4
      MODAL_QWEN_IMAGE_EDIT_MEMORY_MB: "98304"
      MODAL_QWEN_IMAGE_EDIT_MAX_CONTAINERS: "1"
      ACCOUNT: ${{ matrix.account }}
      ECOSYSTEM: ${{ matrix.ecosystem }}
      WORKER_ID: ${{ matrix.worker_id }}
      WORKER_ROLE: ${{ matrix.role }}
      WORKER_ORDER: ${{ matrix.order }}
      WORKER_DISPLAY_NAME: ${{ matrix.display_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/qwen-image-edit-2511
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal runtime CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Stage pinned Civitai checkpoint into Modal volume
        shell: bash
        run: python scripts/qwen_civitai_prefetch.py "$ACCOUNT"
      - name: Deploy and prefetch Qwen worker
        shell: bash
        run: |
          python scripts/modal_worker_fleet.py deploy "$ACCOUNT" "$ECOSYSTEM" "$WORKER_ID" > worker-base.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads(Path('worker-base.json').read_text(encoding='utf-8'))
          row.update({
              'role': os.environ['WORKER_ROLE'],
              'order': int(os.environ['WORKER_ORDER']),
              'displayName': os.environ['WORKER_DISPLAY_NAME'],
              'accountLabel': os.environ['ACCOUNT'],
              'enabled': True,
              'version': 'qwen-2511-civitai-bf16-v1',
          })
          Path('worker.json').write_text(json.dumps(row, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({k: row[k] for k in ('workerId', 'ecosystem', 'accountLabel', 'role', 'gatewayUrl')}))
          PY
      - name: Verify Qwen gateway health without waking GPU compute
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          row = json.loads(Path('worker.json').read_text(encoding='utf-8'))
          with urllib.request.urlopen(row['gatewayUrl'].rstrip('/') + '/health', timeout=90) as response:
              payload = json.loads(response.read().decode('utf-8'))
          if payload.get('ready') is not True:
              raise SystemExit(f"Gateway did not report ready: {payload}")
          if payload.get('model') != 'Qwen/Qwen-Image-Edit-2511':
              raise SystemExit(f"Wrong model reported by Qwen gateway: {payload}")
          if payload.get('precision') != 'civitai-bfloat16':
              raise SystemExit(f"Wrong Qwen precision: {payload}")
          checkpoint = payload.get('checkpoint') or {}
          if checkpoint.get('source') != 'civitai' or int(checkpoint.get('version_id') or 0) != 2553500:
              raise SystemExit(f"Wrong Qwen fallback checkpoint: {payload}")
          acceleration = payload.get('acceleration') or {}
          if acceleration.get('type') != 'lightning-lora' or int(acceleration.get('default_steps') or 0) != 4:
              raise SystemExit(f"Wrong Qwen acceleration profile: {payload}")
          worker = payload.get('worker') or {}
          if worker.get('worker_id') != row['workerId']:
              raise SystemExit(f"Wrong worker identity: {payload}")
          state = str(worker.get('state') or 'unknown')
          if state in {'generating', 'finalizing'}:
              raise SystemExit(f"Health check unexpectedly found active GPU state: {state}")
          print(json.dumps({
              'workerId': row['workerId'],
              'gatewayReady': True,
              'workerState': state,
              'model': payload.get('model'),
              'precision': payload.get('precision'),
              'checkpointVersionId': checkpoint.get('version_id'),
              'defaultSteps': acceleration.get('default_steps'),
          }))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker_id }}
          path: worker.json
          if-no-files-found: error
          retention-days: 7

  publish-registry:
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/qwen-image-edit-2511
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-qwen-*
          path: worker-artifacts
      - name: Merge Qwen workers into public registry
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          target = Path('apps/studio/api/_worker-registry.generated.js')
          text = target.read_text(encoding='utf-8')
          match = re.search(r'GENERATED_MODAL_WORKERS\s*=\s*(\[[\s\S]*\])\s*;', text)
          if not match:
              raise SystemExit('Could not parse existing worker registry')
          rows = json.loads(match.group(1))
          rows = [row for row in rows if row.get('ecosystem') != 'qwen-image-edit-2511']
          qwen = []
          for path in sorted(Path('worker-artifacts').rglob('worker.json')):
              row = json.loads(path.read_text(encoding='utf-8'))
              qwen.append({
                  'id': row['workerId'],
                  'ecosystem': row['ecosystem'],
                  'gatewayUrl': row['gatewayUrl'],
                  'displayName': row['displayName'],
                  'accountLabel': row['accountLabel'],
                  'role': row['role'],
                  'enabled': True,
                  'order': int(row['order']),
                  'version': row.get('version') or 'qwen-2511-civitai-bf16-v1',
              })
          if len(qwen) != 2 or {row['role'] for row in qwen} != {'primary', 'standby'}:
              raise SystemExit(f'Expected Qwen primary + standby, found {qwen}')
          rows.extend(qwen)
          rows.sort(key=lambda row: (row['ecosystem'], 0 if row['role'] == 'primary' else 1, int(row.get('order') or 0), row['id']))
          target.write_text(
              '// Generated by the Modal worker provisioning workflow. Public routing metadata only; no credentials.\n'
              + 'export const GENERATED_MODAL_WORKERS = '
              + json.dumps(rows, indent=2)
              + ';\n',
              encoding='utf-8',
          )
          print(json.dumps({'workers': len(rows), 'qwenWorkers': len(qwen)}, sort_keys=True))
          PY
      - name: Commit Qwen routing metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin studio/qwen-image-edit-2511
          git add apps/studio/api/_worker-registry.generated.js
          git commit -m "ops(qwen): register Qwen Image Edit workers" || exit 0
          git push origin HEAD:studio/qwen-image-edit-2511
