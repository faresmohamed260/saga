name: Provision Modal Worker Fleet

# Full provisioning is intentionally manual. It resets dedicated accounts and
# rebuilds model caches; routine runtime/gateway fixes use modal-worker-maintenance.yml.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modal-worker-provision
  cancel-in-progress: false

jobs:
  provision:
    name: ${{ matrix.worker_id }} on ${{ matrix.account }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - account: modal-44
            ecosystem: flux2-klein-9b
            worker_id: flux-primary-01
            role: primary
            order: 0
            display_name: FLUX.2 Klein 9B · Primary
          - account: modal-45
            ecosystem: flux2-klein-9b
            worker_id: flux-standby-01
            role: standby
            order: 1
            display_name: FLUX.2 Klein 9B · Standby
          - account: modal-46
            ecosystem: ltx25-redgraft
            worker_id: ltx-primary-01
            role: primary
            order: 0
            display_name: REDGraft LTX 2.5 · Primary
          - account: modal-47
            ecosystem: ltx25-redgraft
            worker_id: ltx-standby-01
            role: standby
            order: 1
            display_name: REDGraft LTX 2.5 · Standby
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      CIVITAI_API_TOKEN: ${{ secrets.CIVITAI_API_TOKEN }}
      MODAL_FLUX2_KLEIN_GPU: A10
      MODAL_LTX25_GPU: A10
      ACCOUNT: ${{ matrix.account }}
      ECOSYSTEM: ${{ matrix.ecosystem }}
      WORKER_ID: ${{ matrix.worker_id }}
      WORKER_ROLE: ${{ matrix.role }}
      WORKER_ORDER: ${{ matrix.order }}
      WORKER_DISPLAY_NAME: ${{ matrix.display_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal runtime CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Clean dedicated worker account
        run: python scripts/modal_worker_fleet.py reset "$ACCOUNT"
      - name: Apply credit-workspace runtime compatibility
        shell: bash
        run: |
          if [ "$ECOSYSTEM" = "ltx25-redgraft" ]; then
            sed -i 's#HF_REPO = "Lightricks/LTX-2.5"#HF_REPO = "comfyicu/LTX-2.5"#' integrations/comfyui/ltx23_app.py
          fi
      - name: Deploy and prefetch ecosystem worker
        shell: bash
        run: |
          python scripts/modal_worker_fleet.py deploy "$ACCOUNT" "$ECOSYSTEM" "$WORKER_ID" > worker-base.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          row = json.loads(Path('worker-base.json').read_text(encoding='utf-8'))
          row.update({
              'role': os.environ['WORKER_ROLE'],
              'order': int(os.environ['WORKER_ORDER']),
              'displayName': os.environ['WORKER_DISPLAY_NAME'],
              'accountLabel': os.environ['ACCOUNT'],
              'enabled': True,
              'version': 'fleet-v1',
          })
          Path('worker.json').write_text(json.dumps(row, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({k: row[k] for k in ('workerId', 'ecosystem', 'accountLabel', 'role', 'gatewayUrl')}))
          PY
      - name: Verify gateway health without waking GPU compute
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          from pathlib import Path
          row = json.loads(Path('worker.json').read_text(encoding='utf-8'))
          with urllib.request.urlopen(row['gatewayUrl'].rstrip('/') + '/health', timeout=90) as response:
              payload = json.loads(response.read().decode('utf-8'))
          if payload.get('ready') is not True:
              raise SystemExit(f"Gateway did not report ready: {payload}")
          state = str((payload.get('worker') or {}).get('state') or 'unknown')
          if state in {'generating', 'finalizing'}:
              raise SystemExit(f"Health check unexpectedly found active GPU state: {state}")
          print(json.dumps({'workerId': row['workerId'], 'gatewayReady': True, 'workerState': state}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: worker-${{ matrix.worker_id }}
          path: worker.json
          if-no-files-found: error
          retention-days: 7

  publish-registry:
    needs: provision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/download-artifact@v4
        with:
          pattern: worker-*
          path: worker-artifacts
      - name: Build public worker registry
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for path in sorted(Path('worker-artifacts').rglob('worker.json')):
              rows.append(json.loads(path.read_text(encoding='utf-8')))
          if len(rows) != 4:
              raise SystemExit(f'Expected 4 provisioned workers, found {len(rows)}')
          normalized = []
          for row in rows:
              normalized.append({
                  'id': row['workerId'],
                  'ecosystem': row['ecosystem'],
                  'gatewayUrl': row['gatewayUrl'],
                  'displayName': row['displayName'],
                  'accountLabel': row['accountLabel'],
                  'role': row['role'],
                  'enabled': True,
                  'order': int(row['order']),
                  'version': row.get('version') or 'fleet-v1',
              })
          normalized.sort(key=lambda row: (row['ecosystem'], 0 if row['role'] == 'primary' else 1, row['order'], row['id']))
          ecosystems = {}
          for row in normalized:
              ecosystems.setdefault(row['ecosystem'], []).append(row)
          for ecosystem in ('flux2-klein-9b', 'ltx25-redgraft'):
              workers = ecosystems.get(ecosystem, [])
              if len(workers) != 2 or {worker['role'] for worker in workers} != {'primary', 'standby'}:
                  raise SystemExit(f'Invalid worker set for {ecosystem}: {workers}')
          target = Path('apps/studio/api/_worker-registry.generated.js')
          target.write_text(
              '// Generated by the Modal worker provisioning workflow. Public routing metadata only; no credentials.\n'
              + 'export const GENERATED_MODAL_WORKERS = '
              + json.dumps(normalized, indent=2)
              + ';\n',
              encoding='utf-8',
          )
          print(json.dumps({'workers': len(normalized), 'ecosystems': {key: len(value) for key, value in ecosystems.items()}}, sort_keys=True))
          PY
      - name: Commit public registry
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --ff-only origin studio/video-gallery-ux
          git add apps/studio/api/_worker-registry.generated.js
          if git diff --cached --quiet; then
            echo "Worker registry already current"
            exit 0
          fi
          git commit -m "ops: register provisioned Modal ecosystem workers"
          git push origin HEAD:studio/video-gallery-ux
