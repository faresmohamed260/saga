name: SAGA V3 LitBank Public Qualification

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "V3 public qualification mode"
        required: true
        default: "oracle-exact"
        type: choice
        options:
          - oracle-exact
          - gliner25-exact
      limit:
        description: "Number of LitBank documents (1-100)"
        required: true
        default: "100"
        type: string
      threshold:
        description: "GLiNER2.5 confidence threshold"
        required: true
        default: "0.5"
        type: string

permissions:
  contents: read

concurrency:
  group: saga-v3-litbank-public-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact S.A.G.A. source
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank corpus
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/v3-gliner-qualification.txt

      - name: Validate inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.limit }}" -ge 1
          test "${{ inputs.limit }}" -le 100
          python - <<'PY'
          value = float("${{ inputs.threshold }}")
          assert 0.0 <= value <= 1.0
          PY

      - name: Install resource sampler
        run: python -m pip install psutil==7.2.2

      - name: Install CPU Torch
        if: inputs.mode == 'gliner25-exact'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install GLiNER challenger environment
        if: inputs.mode == 'gliner25-exact'
        run: python -m pip install -r requirements/v3-gliner-qualification.txt

      - name: Run V3 public qualification
        run: >-
          python -m scripts.run_v3_litbank_identity_benchmark
          --root external/litbank
          --out evaluation-artifacts/v3-${{ inputs.mode }}.json
          --mode ${{ inputs.mode }}
          --limit ${{ inputs.limit }}
          --device cpu
          --threshold ${{ inputs.threshold }}
          --model-cache .cache/huggingface

      - name: Publish summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("evaluation-artifacts/v3-${{ inputs.mode }}.json")
          report = json.loads(path.read_text())
          m = report["aggregate"]["metrics"]
          r = report["resources"]
          print("## S.A.G.A. V3 LitBank public qualification")
          print()
          print(f"- Mode: `{report['mode']}`")
          print(f"- LitBank commit: `{report['dataset']['commit']}`")
          print(f"- Documents: {report['dataset']['documentCount']}")
          print(f"- Canonical precision: {m['canonical_precision']:.4f}")
          print(f"- Canonical recall: {m['canonical_recall']:.4f}")
          print(f"- Incorrect merge rate: {m['incorrect_merge_rate']:.4f}")
          print(f"- Fragmentation rate: {m['fragmentation_rate']:.4f}")
          print(f"- Linked mention precision: {m['linked_mention_precision']:.4f}")
          print(f"- Linked mention recall: {m['linked_mention_recall']:.4f}")
          print(f"- Cluster purity: {m['cluster_purity']:.4f}")
          print(f"- Wall time: {r['wall_seconds']:.2f}s")
          if r['peak_process_tree_rss_bytes'] is not None:
              print(f"- Peak process-tree RSS: {r['peak_process_tree_rss_bytes'] / 1024**2:.2f} MiB")
          model = report.get("model")
          if model:
              print(f"- Model revision: `{model['revision']}`")
              print(f"- Model artifact SHA-256: `{model['artifact']['aggregate_sha256']}`")
          PY

      - name: Upload qualification report
        uses: actions/upload-artifact@v4
        with:
          name: saga-v3-litbank-${{ inputs.mode }}-${{ github.sha }}
          path: evaluation-artifacts/v3-${{ inputs.mode }}.json
          if-no-files-found: error
          retention-days: 90
