name: Hosted invitation revocation proof

on:
  push:
    branches:
      - ops/hosted-revocation-smoke
    paths:
      - .github/workflows/ops-hosted-revocation-smoke.yml

permissions:
  contents: read

jobs:
  revoke-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: https://scmeqnpmhomzcwecjdtu.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_znDKjfEiIhk296hIL1ussA_a7lCpxIo
      APP_ORIGIN: https://saga-pi-two.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install --no-audit --no-fund
      - name: Exercise hosted revoke API
        working-directory: apps/web
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import crypto from 'node:crypto';
          import { createClient } from '@supabase/supabase-js';
          import { createServerClient } from '@supabase/ssr';

          const url = process.env.SUPABASE_URL;
          const publishableKey = process.env.SUPABASE_PUBLISHABLE_KEY;
          const secretKey = process.env.SUPABASE_SECRET_KEY;
          const origin = process.env.APP_ORIGIN;
          assert.ok(url && publishableKey && secretKey && origin, 'hosted config missing');

          const suffix = `${Date.now()}-${crypto.randomBytes(3).toString('hex')}`;
          const adminEmail = `saga-revoke-admin-${suffix}@example.com`;
          const pendingEmail = `saga-revoke-target-${suffix}@example.com`;
          const password = crypto.randomBytes(32).toString('base64url');
          const privileged = createClient(url, secretKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });

          let adminUserId = null;
          let invitationId = null;
          try {
            const { data: created, error: createError } = await privileged.auth.admin.createUser({ email: adminEmail, password, email_confirm: true });
            assert.ifError(createError);
            assert.ok(created.user?.id, 'ephemeral admin creation failed');
            adminUserId = created.user.id;

            const { error: accessError } = await privileged.from('saga_account_access').insert({ user_id: adminUserId, role: 'admin', status: 'active', accepted_at: new Date().toISOString() });
            assert.ifError(accessError);

            const { data: intentData, error: intentError } = await privileged.rpc('saga_admin_upsert_invitation_intent', {
              p_actor_user_id: adminUserId,
              p_email: pendingEmail,
              p_intended_role: 'member',
              p_expires_at: new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString(),
            });
            assert.ifError(intentError);
            const intent = Array.isArray(intentData) ? intentData[0] : null;
            assert.ok(intent?.id, 'pending invitation intent was not created');
            assert.equal(intent.status, 'pending');
            invitationId = intent.id;

            const jar = new Map();
            const ordinary = createServerClient(url, publishableKey, { cookies: {
              getAll() { return [...jar.entries()].map(([name, record]) => ({ name, value: record.value })); },
              setAll(cookies) { for (const cookie of cookies) jar.set(cookie.name, { value: cookie.value, options: cookie.options }); },
            }});
            const { error: signInError } = await ordinary.auth.signInWithPassword({ email: adminEmail, password });
            assert.ifError(signInError);
            const cookieHeader = [...jar.entries()].map(([name, record]) => `${name}=${record.value}`).join('; ');
            assert.ok(cookieHeader, 'admin SSR cookie missing');

            const response = await fetch(`${origin}/api/admin/invitations/${invitationId}`, {
              method: 'DELETE',
              headers: { cookie: cookieHeader },
              redirect: 'manual',
            });
            assert.equal(response.status, 200, `hosted revoke API returned ${response.status}`);
            const result = await response.json();
            assert.equal(result.status, 'revoked', 'hosted revoke API did not return revoked');

            const { data: finalInvitation, error: finalError } = await privileged.from('saga_invitations').select('status,revoked_at').eq('id', invitationId).single();
            assert.ifError(finalError);
            assert.equal(finalInvitation.status, 'revoked');
            assert.ok(finalInvitation.revoked_at, 'revoked_at was not recorded');

            console.log('Hosted invitation revocation proof passed: authenticated admin DELETE -> revoked state persisted.');
          } finally {
            if (invitationId) await privileged.from('saga_invitations').delete().eq('id', invitationId);
            if (adminUserId) {
              await privileged.from('saga_account_access').delete().eq('user_id', adminUserId);
              await privileged.auth.admin.deleteUser(adminUserId);
            }
          }
          NODE
