name: Studio Browser UX Review

on:
  push:
    branches:
      - studio/advanced-ui-audit
    paths:
      - "apps/studio/**"
      - "docs/studio-ui-ux-benchmark-audit.md"
      - ".github/workflows/studio-advanced-ui-audit-patch.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: studio-browser-ux-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/advanced-ui-audit
          fetch-depth: 0

      - name: Align browser review with current production UI
        shell: bash
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/studio/scripts/capture-ui-preview.mjs')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  "  if (await mobileSubmit.getAttribute('aria-label') !== 'Generate image') throw new Error('Compact mobile Generate action lost its accessible name');",
                  "  if (await mobileSubmit.getAttribute('aria-label') !== 'Add reference image') throw new Error('Compact mobile Image setup action lost its accessible name');",
              ),
          ]
          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          if ! git diff --quiet -- apps/studio/scripts/capture-ui-preview.mjs; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/studio/scripts/capture-ui-preview.mjs
            git commit -m "test(studio): align mobile browser CTA contract"
            git push origin HEAD:studio/advanced-ui-audit
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Studio dependencies
        run: npm install --no-audit --no-fund

      - name: Build and run contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built Studio preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Studio preview is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1

      - name: Run real-browser interaction and visual suite
        env:
          UI_PREVIEW_DIR: artifacts/browser-review
        run: npm run visual:preview

      - name: Upload browser-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-ux-review
          path: apps/studio/artifacts/browser-review/**
          if-no-files-found: warn
          retention-days: 7
