name: Studio Browser UX Review

on:
  push:
    branches:
      - studio/advanced-ui-audit
    paths:
      - "apps/studio/**"
      - "docs/studio-ui-ux-benchmark-audit.md"
      - ".github/workflows/studio-advanced-ui-audit-patch.yml"

permissions:
  contents: write
  actions: read

concurrency:
  group: studio-browser-ux-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/advanced-ui-audit
          fetch-depth: 0

      - name: Align browser review with current production UI
        shell: bash
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('apps/studio/scripts/capture-ui-preview.mjs')
          ui_text = ui.read_text(encoding='utf-8')
          ui_text = ui_text.replace(
              "  if (await mobileSubmit.getAttribute('aria-label') !== 'Generate image') throw new Error('Compact mobile Generate action lost its accessible name');",
              "  if (await mobileSubmit.getAttribute('aria-label') !== 'Add reference image') throw new Error('Compact mobile Image setup action lost its accessible name');",
          )
          ui_text = ui_text.replace(
              "  const autoToggle = desktop.locator('.saga-auto-toggle');\n  if (await autoToggle.getAttribute('aria-pressed') !== 'true') throw new Error('Edit Auto did not start enabled');\n  await autoToggle.click();\n  if (await autoToggle.getAttribute('aria-pressed') !== 'false') throw new Error('Edit Auto did not toggle off');\n  await autoToggle.click();\n  if (await autoToggle.getAttribute('aria-pressed') !== 'true') throw new Error('Edit Auto did not toggle back on');",
              "  if (await desktop.locator('.saga-auto-toggle').count()) throw new Error('Edit exposes a duplicate standalone Auto control');\n  const editAspectTrigger = desktop.locator('.saga-shared-aspect-trigger');\n  await expectText(editAspectTrigger, 'Canvas · Auto', 'Edit automatic canvas trigger');\n  if (await desktop.locator('.saga-resolution-trigger').count()) throw new Error('Edit Auto should not expose a second resolution Auto control');\n  await editAspectTrigger.click();\n  const editAspectMenu = desktop.locator('.saga-aspect-picker');\n  await editAspectMenu.waitFor({ state: 'visible' });\n  await editAspectMenu.getByRole('menuitemradio', { name: /16:9.*Widescreen/i }).click();\n  await desktop.locator('.saga-resolution-trigger').waitFor({ state: 'visible' });\n  await editAspectTrigger.click();\n  await editAspectMenu.getByRole('menuitemradio', { name: /Auto/i }).click();\n  if (await desktop.locator('.saga-resolution-trigger').count()) throw new Error('Returning to Edit Auto did not collapse manual resolution control');",
          )
          ui.write_text(ui_text, encoding='utf-8')

          gallery = Path('apps/studio/scripts/capture-gallery-preview.mjs')
          gallery_text = gallery.read_text(encoding='utf-8')
          gallery_text = gallery_text.replace(
              "  for (const label of ['Reuse settings', 'Edit', 'Add to collection', 'Delete permanently']) {\n    await desktopMore.getByRole('menuitem', { name: label, exact: true }).waitFor({ state: 'visible' });\n  }",
              "  for (const label of ['Reuse settings', 'Add to collection', 'Delete permanently']) {\n    await desktopMore.getByRole('menuitem', { name: label, exact: true }).waitFor({ state: 'visible' });\n  }\n  if (await desktopMore.getByRole('menuitem', { name: 'Edit', exact: true }).count()) throw new Error('Unsupported video Edit action is still exposed in desktop Gallery');",
          )
          gallery_text = gallery_text.replace(
              "  for (const label of ['Reuse settings', 'Edit', 'Download original', 'Add to collection', 'Delete permanently']) {\n    await mobileMore.getByRole('menuitem', { name: label, exact: true }).waitFor({ state: 'visible' });\n  }",
              "  for (const label of ['Reuse settings', 'Download original', 'Add to collection', 'Delete permanently']) {\n    await mobileMore.getByRole('menuitem', { name: label, exact: true }).waitFor({ state: 'visible' });\n  }\n  if (await mobileMore.getByRole('menuitem', { name: 'Edit', exact: true }).count()) throw new Error('Unsupported video Edit action is still exposed in mobile Gallery');",
          )
          gallery.write_text(gallery_text, encoding='utf-8')

          controls = Path('apps/studio/src/create-controls.jsx')
          controls_text = controls.read_text(encoding='utf-8')
          controls_text = controls_text.replace(
              '      aria-label={`${label} options`}',
              '      aria-label={label}',
          )
          controls_text = controls_text.replace(
              "\n\n              {isEdit && (\n                <button\n                  type=\"button\"\n                  className={`saga-auto-toggle ${editAuto ? 'active' : ''}`}\n                  aria-pressed={editAuto}\n                  onClick={() => setEditAuto((current) => !current)}\n                >\n                  <Sparkles size={15} /><span>Auto</span>\n                </button>\n              )}\n",
              "\n",
          )
          controls_text = controls_text.replace(
              "                  <button\n                    ref={resolutionButtonRef}",
              "                  {!(isEdit && editAuto) && (\n                  <button\n                    ref={resolutionButtonRef}",
              1,
          )
          controls_text = controls_text.replace(
              "                  </button>\n\n                  <AspectPicker\n                    triggerRef={aspectButtonRef}",
              "                  </button>\n                  )}\n\n                  <AspectPicker\n                    triggerRef={aspectButtonRef}",
              1,
          )
          controls_text = controls_text.replace(
              "                    ariaLabel=\"Aspect ratio\"\n                    value={aspect}",
              "                    ariaLabel=\"Aspect ratio\"\n                    triggerPrefix={isEdit ? 'Canvas' : 'Aspect'}\n                    value={aspect}",
              1,
          )
          controls_text = controls_text.replace(
              "                    autoSelected={isEdit && editAuto}\n                    effectiveRatio={primaryRatio}",
              "                    autoSelected={isEdit && editAuto}\n                    onAutoChoose={isEdit ? () => setEditAuto(true) : undefined}\n                    effectiveRatio={primaryRatio}",
              1,
          )
          controls.write_text(controls_text, encoding='utf-8')
          PY
          if ! git diff --quiet -- apps/studio/scripts/capture-ui-preview.mjs apps/studio/scripts/capture-gallery-preview.mjs apps/studio/src/create-controls.jsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/studio/scripts/capture-ui-preview.mjs apps/studio/scripts/capture-gallery-preview.mjs apps/studio/src/create-controls.jsx
            git commit -m "fix(studio): simplify reference-aware Edit sizing"
            git push origin HEAD:studio/advanced-ui-audit
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Studio dependencies
        run: npm install --no-audit --no-fund

      - name: Build and run contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start built Studio preview
        shell: bash
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/saga-studio-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              echo "Studio preview is ready"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/saga-studio-preview.log
          exit 1

      - name: Run real-browser interaction and visual suite
        env:
          UI_PREVIEW_DIR: artifacts/browser-review
        run: npm run visual:preview

      - name: Upload browser-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-ux-review
          path: apps/studio/artifacts/browser-review/**
          if-no-files-found: warn
          retention-days: 7
