name: Studio Browser UX Review

on:
  push:
    branches:
      - studio/qwen-image-edit-2511
    paths:
      - .github/workflows/studio-advanced-ui-audit-patch.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/qwen-image-edit-2511
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Qwen integration patch
        run: python scripts/qwen_integration_patch.py
      - name: Restore review workflow and commit integration
        shell: bash
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/studio-advanced-ui-audit-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/modal_worker_fleet.py config/modal-worker-ecosystems.json integrations/qwen apps/studio docs/modal-worker-fleet-design.md .github/workflows/modal-worker-inventory.yml .github/workflows/studio-advanced-ui-audit-patch.yml
          if git diff --cached --quiet; then
            echo "No integration changes"
            exit 0
          fi
          git commit -m "feat(qwen): integrate Qwen Image Edit 2511"
          git push origin HEAD:studio/qwen-image-edit-2511
