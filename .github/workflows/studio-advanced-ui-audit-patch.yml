name: Studio Browser UX Review

on:
  push:
    branches:
      - studio/advanced-ui-audit
    paths:
      - "apps/studio/**"
      - "docs/studio-ui-ux-benchmark-audit.md"
      - ".github/workflows/studio-advanced-ui-audit-patch.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: studio-browser-ux-review
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: apps/studio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/advanced-ui-audit

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install Studio dependencies
        run: npm install --no-audit --no-fund

      - name: Build and run contracts
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-browser interaction and visual suite
        run: npm run visual:preview

      - name: Upload browser-review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-ux-review
          path: |
            apps/studio/artifacts/ui-preview/**
            apps/studio/artifacts/video-output-preview/**
            apps/studio/artifacts/audio-state-preview/**
            apps/studio/artifacts/gallery-preview/**
            apps/studio/artifacts/uploads-preview/**
            apps/studio/artifacts/jobs-preview/**
            apps/studio/artifacts/gallery-thumbnail-preview/**
            apps/studio/artifacts/responsive-preview/**
          if-no-files-found: warn
          retention-days: 7
