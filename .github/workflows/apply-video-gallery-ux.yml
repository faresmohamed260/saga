name: Apply Video Gallery UX

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - ".github/scripts/apply-video-gallery-ux.py"
      - ".github/workflows/apply-video-gallery-ux.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/apply-video-gallery-ux.py"
      - ".github/workflows/apply-video-gallery-ux.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-video-gallery-ux-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Repair one-shot patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/scripts/apply-video-gallery-ux.py')
          text = p.read_text(encoding='utf-8')
          old = "text = text.replace('\\\"fps\\\": FPS', '\\\"fps\\\": frame_rate')"
          new = "text = text.replace('\\\"class_type\\\": \\\"CreateVideo\\\", \\\"inputs\\\": {\\\"images\\\": [\\\"30\\\", 0], \\\"fps\\\": FPS, \\\"bit_depth\\\": 8}', '\\\"class_type\\\": \\\"CreateVideo\\\", \\\"inputs\\\": {\\\"images\\\": [\\\"30\\\", 0], \\\"fps\\\": frame_rate, \\\"bit_depth\\\": 8}')"
          if old not in text:
              raise SystemExit('fps repair anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply reusable UX and video contract patch
        run: python .github/scripts/apply-video-gallery-ux.py

      - name: Validate Python runtime sources
        run: python -m py_compile integrations/comfyui/ltx23_app.py integrations/comfyui/ltx23_gateway.py

      - name: Install Studio dependencies
        working-directory: apps/studio
        run: npm install --no-audit --no-fund

      - name: Build Studio
        working-directory: apps/studio
        run: npm run build

      - name: Remove one-shot patch machinery
        run: rm -f .github/scripts/apply-video-gallery-ux.py .github/workflows/apply-video-gallery-ux.yml

      - name: Commit patched product files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "saga-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git commit -m "Improve video output controls and Gallery management"
          git push origin HEAD:studio/video-gallery-ux
