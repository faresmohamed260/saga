name: Phase 3 combined speaker benchmark

on:
  workflow_dispatch:
  push:
    branches:
      - v2/phase-3a-combined-speaker
    paths:
      - ".github/workflows/v2-phase3-combined-speaker-experiment.yml"
      - "services/analysis-worker/benchmarks/run_booknlp_litbank.py"
      - "services/analysis-worker/src/evaluation/combined-speaker.ts"
      - "services/analysis-worker/src/evaluation/combined-speaker-litbank-cli.ts"
      - "services/analysis-worker/src/evaluation/dialogue-*.ts"
      - "services/analysis-worker/src/evaluation/litbank-component-benchmark.ts"
      - "services/analysis-worker/src/evaluation/litbank-tsv.ts"
      - "services/analysis-worker/src/local-analysis/booknlp-*.ts"
      - "services/analysis-worker/tests/combined-speaker.test.ts"
      - "services/analysis-worker/package.json"

permissions:
  contents: read

concurrency:
  group: saga-phase3-combined-speaker
  cancel-in-progress: true

jobs:
  combined-speaker:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: services/analysis-worker

    steps:
      - name: Checkout exact S.A.G.A. source
        uses: actions/checkout@v4

      - name: Checkout pinned LitBank corpus
        uses: actions/checkout@v4
        with:
          repository: dbamman/litbank
          ref: 3e50db0ffc033d7ccbb94f4d88f6b99210328ed8
          path: external/litbank
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install pinned BookNLP compatibility candidate
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.3.1"
          python -m pip install "click==8.1.7" "spacy==3.7.5" "transformers==4.43.4"
          python -m pip install --no-deps "git+https://github.com/Plazmius/booknlp.git@8875a1b616d764b7d13d1e30e9949cc21ca303c1"
          python -m spacy download en_core_web_sm

      - name: Run BookNLP small on all pinned LitBank documents
        run: >-
          python benchmarks/run_booknlp_litbank.py
          --litbank-root ../../external/litbank
          --output-root evaluation-artifacts/booknlp-output
          --metadata-out evaluation-artifacts/combined-speaker-run-metadata.json

      - name: Preserve pinned BookNLP native outputs for scorer-only follow-up
        uses: actions/upload-artifact@v4
        with:
          name: saga-phase3-booknlp-native-output-${{ github.sha }}
          path: services/analysis-worker/evaluation-artifacts/booknlp-output
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/analysis-worker/package.json

      - name: Install worker dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck combined speaker challenger
        run: npm run typecheck

      - name: Run deterministic/model-light tests
        run: npm test

      - name: Score combined speaker challenger
        run: >-
          npx tsx src/evaluation/combined-speaker-litbank-cli.ts
          --litbank-root ../../external/litbank
          --booknlp-root evaluation-artifacts/booknlp-output
          --out evaluation-artifacts/combined-speaker-litbank.json

      - name: Publish combined speaker summary
        shell: bash
        run: |
          node <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("fs");
          const report = JSON.parse(fs.readFileSync("evaluation-artifacts/combined-speaker-litbank.json", "utf8"));
          const runtime = JSON.parse(fs.readFileSync("evaluation-artifacts/combined-speaker-run-metadata.json", "utf8"));
          const c = report.dialogue.combined;
          const b = report.dialogue.bookNlp;
          const d = report.dialogue.deterministicOracleIdentity;
          const db = report.dialogue.deltaVsBookNlp;
          const dd = report.dialogue.deltaVsDeterministic;
          const f = report.dialogue.fusionCounts;
          const a = report.dialogue.goldAudit;
          console.log("## Phase 3 combined speaker benchmark");
          console.log("");
          console.log(`- LitBank attempted/completed/failed: ${report.dataset.attemptedDocumentCount}/${report.dataset.completedDocumentCount}/${report.dataset.failedDocumentCount}`);
          console.log(`- BookNLP runtime: ${runtime.wallClockSeconds.toFixed(2)} s; peak RSS: ${runtime.peakResidentMemoryMb.toFixed(1)} MiB`);
          console.log("");
          console.log("### Combined result");
          console.log(`- quote P/R/F1: ${c.quoteDetection.precision.toFixed(4)} / ${c.quoteDetection.recall.toFixed(4)} / ${c.quoteDetection.f1.toFixed(4)}`);
          console.log(`- matched-known accuracy: ${c.speakerAccuracyOnMatchedQuotes.toFixed(4)}`);
          console.log(`- resolved-speaker accuracy: ${c.resolvedSpeakerAccuracy.toFixed(4)}`);
          console.log(`- end-to-end speaker recall: ${c.endToEndSpeakerRecall.toFixed(4)}`);
          console.log(`- contamination: ${c.crossCharacterContaminationRateOnMatchedQuotes.toFixed(4)}`);
          console.log(`- unresolved rate: ${c.speakerUnresolvedRateOnMatchedQuotes.toFixed(4)}`);
          console.log("");
          console.log("### Delta vs BookNLP speaker attribution");
          console.log(`- accuracy: ${db.matchedKnownSpeakerAccuracy >= 0 ? "+" : ""}${db.matchedKnownSpeakerAccuracy.toFixed(4)}`);
          console.log(`- end-to-end recall: ${db.endToEndSpeakerRecall >= 0 ? "+" : ""}${db.endToEndSpeakerRecall.toFixed(4)}`);
          console.log(`- contamination: ${db.crossCharacterContamination >= 0 ? "+" : ""}${db.crossCharacterContamination.toFixed(4)}`);
          console.log(`- unresolved: ${db.unresolvedRate >= 0 ? "+" : ""}${db.unresolvedRate.toFixed(4)}`);
          console.log("");
          console.log("### Conflict gold audit");
          console.log(`- known-speaker conflicts on matched deterministic quotes: ${a.conflict.count}`);
          console.log(`- BookNLP correct / deterministic wrong: ${a.conflict.bookNlpCorrectDeterministicWrong}`);
          console.log(`- deterministic correct / BookNLP wrong: ${a.conflict.deterministicCorrectBookNlpWrong}`);
          console.log(`- both wrong: ${a.conflict.bothWrong}`);
          console.log("");
          console.log("### Delta vs deterministic floor");
          console.log(`- accuracy: ${dd.matchedKnownSpeakerAccuracy >= 0 ? "+" : ""}${dd.matchedKnownSpeakerAccuracy.toFixed(4)}`);
          console.log(`- end-to-end recall: ${dd.endToEndSpeakerRecall >= 0 ? "+" : ""}${dd.endToEndSpeakerRecall.toFixed(4)}`);
          console.log(`- contamination: ${dd.crossCharacterContamination >= 0 ? "+" : ""}${dd.crossCharacterContamination.toFixed(4)}`);
          console.log("");
          console.log(`- BookNLP raw speaker accuracy/recall/contamination: ${b.speakerAccuracyOnMatchedQuotes.toFixed(4)} / ${b.endToEndSpeakerRecall.toFixed(4)} / ${b.crossCharacterContaminationRateOnMatchedQuotes.toFixed(4)}`);
          console.log(`- deterministic raw speaker accuracy/recall/contamination: ${d.speakerAccuracyOnMatchedQuotes.toFixed(4)} / ${d.endToEndSpeakerRecall.toFixed(4)} / ${d.crossCharacterContaminationRateOnMatchedQuotes.toFixed(4)}`);
          console.log(`- fusion counts agreement/provider fallback/deterministic only/conflict unresolved/other unresolved: ${f.agreement}/${f.providerFallback}/${f.deterministicOnly}/${f.conflictUnresolved}/${f.unresolved}`);
          console.log(`- report fingerprint: \`${report.reportFingerprint}\``);
          EOF

      - name: Upload combined speaker benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: saga-phase3-combined-speaker-benchmark
          path: |
            services/analysis-worker/evaluation-artifacts/combined-speaker-litbank.json
            services/analysis-worker/evaluation-artifacts/combined-speaker-run-metadata.json
          if-no-files-found: error
          retention-days: 90
