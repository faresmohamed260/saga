name: Studio Iteration 20 Patch

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/studio_iteration20_patch.py"
      - ".github/workflows/studio-iteration20-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: studio-iteration20-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply Iteration 20 patch
        run: python scripts/studio_iteration20_patch.py
      - name: Commit Iteration 20 implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/app/App.jsx apps/studio/src/api/studioApi.js apps/studio/src/hooks/useLibraryController.js apps/studio/src/hooks/useGenerationController.js apps/studio/src/hooks/useGallerySelection.js apps/studio/src/features/library/GalleryView.jsx
          if git diff --cached --quiet; then
            echo "Iteration 20 already applied"
            exit 0
          fi
          git commit -m "refactor: split Studio app controllers and API layer"
          git push origin HEAD:studio/video-gallery-ux
