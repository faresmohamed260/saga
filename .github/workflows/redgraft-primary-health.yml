name: Inspect REDGraft Recovery State

on:
  push:
    branches: [ops/redgraft-recovery-20260907]
    paths:
      - ".github/workflows/redgraft-primary-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/redgraft-recovery-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Resolve recovered REDGraft gateways and identities
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from scripts.modal_worker_fleet import ecosystem_config, load_accounts, run

          ecosystem = ecosystem_config('ltx25-redgraft')
          accounts = {account.label: account for account in load_accounts()}
          targets = ['modal-01', 'modal-02']

          def inspect(label):
              account = accounts[label]
              code = (
                  "import modal; "
                  f"fn=modal.Function.from_name({ecosystem['gatewayApp']!r}, {ecosystem['gatewayFunction']!r}); "
                  "print(fn.get_web_url())"
              )
              result = run(account, ['python', '-c', code], timeout=120)
              if result.returncode != 0:
                  return {'account': label, 'error': (result.stderr or result.stdout or '')[-1200:]}
              gateway = (result.stdout or '').strip().splitlines()[-1].rstrip('/')
              try:
                  with urllib.request.urlopen(gateway + '/health', timeout=60) as response:
                      health = json.loads(response.read().decode('utf-8'))
                  return {'account': label, 'gatewayUrl': gateway, 'health': health}
              except Exception as exc:
                  return {'account': label, 'gatewayUrl': gateway, 'error': f'{type(exc).__name__}: {exc}'}

          rows = []
          with ThreadPoolExecutor(max_workers=2) as pool:
              futures = {pool.submit(inspect, label): label for label in targets}
              for future in as_completed(futures):
                  rows.append(future.result())
          print(json.dumps({'recovered': sorted(rows, key=lambda row: row['account'])}, sort_keys=True))
          PY
