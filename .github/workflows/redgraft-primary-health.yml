name: Inspect REDGraft Recovery State

on:
  push:
    branches: [ops/redgraft-recovery-20260907]
    paths:
      - ".github/workflows/redgraft-primary-health.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SAGA_MODAL_TOKENS_JSON: ${{ secrets.SAGA_MODAL_TOKENS_JSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops/redgraft-recovery-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Modal CLI
        run: python -m pip install --upgrade "modal==1.4.2"
      - name: Inspect live LTX app/task state across configured workspaces
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request
          from scripts.modal_worker_fleet import ecosystem_config, json_command, load_accounts, run

          ecosystem = ecosystem_config('ltx25-redgraft')

          def task_count(value):
              if value is None:
                  return 0
              if isinstance(value, bool):
                  return int(value)
              if isinstance(value, (int, float)):
                  return max(0, int(value))
              if isinstance(value, (list, tuple, set, dict)):
                  return len(value)
              match = re.search(r'\d+', str(value))
              return int(match.group(0)) if match else 0

          results = []
          for account in load_accounts():
              apps, detail = json_command(account, ['modal', 'app', 'list', '--json'], timeout=45)
              if not isinstance(apps, list):
                  continue
              ltx_apps = []
              total_tasks = 0
              descriptions = set()
              for row in apps:
                  if not isinstance(row, dict):
                      continue
                  description = str(row.get('Description') or '').strip()
                  if 'saga-ltx25' not in description:
                      continue
                  count = task_count(row.get('Tasks'))
                  total_tasks += count
                  descriptions.add(description)
                  ltx_apps.append({
                      'description': description,
                      'state': str(row.get('State') or ''),
                      'tasks': count,
                  })
              if not ltx_apps:
                  continue

              gateway = None
              health = None
              health_error = None
              if ecosystem['gatewayApp'] in descriptions:
                  code = (
                      "import modal; "
                      f"fn=modal.Function.from_name({ecosystem['gatewayApp']!r}, {ecosystem['gatewayFunction']!r}); "
                      "print(fn.get_web_url())"
                  )
                  result = run(account, ['python', '-c', code], timeout=120)
                  if result.returncode == 0:
                      gateway = (result.stdout or '').strip().splitlines()[-1].rstrip('/')
                      try:
                          with urllib.request.urlopen(gateway + '/health', timeout=45) as response:
                              health = json.loads(response.read().decode('utf-8'))
                      except Exception as exc:
                          health_error = f'{type(exc).__name__}: {exc}'
                  else:
                      health_error = (result.stderr or result.stdout or '')[-1000:]

              results.append({
                  'account': account.label,
                  'ltxApps': ltx_apps,
                  'totalTasks': total_tasks,
                  'gatewayUrl': gateway,
                  'health': health,
                  'healthError': health_error,
              })

          print(json.dumps({'ltxWorkspaces': results}, sort_keys=True))
          PY
