name: Studio Advanced portal dismiss fixer

on:
  push:
    branches:
      - studio/ui-fixes-advanced-sidebar-jobs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/ui-fixes-advanced-sidebar-jobs
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix Advanced nested portal dismissal
        run: python .github/scripts/fix_advanced_portal_dismiss.py
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/create-controls.jsx
          git commit -m "fix(studio): keep Advanced open for nested dropdown choices [advanced-portal-fixed]"
          git push origin HEAD:studio/ui-fixes-advanced-sidebar-jobs
