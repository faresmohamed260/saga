name: Patch Studio LTX 2.3 video wiring

on:
  push:
    branches: [studio/ltx23-video-backend]
    paths:
      - "apps/studio/scripts/patch-ltx23-video-ui.mjs"
      - ".github/workflows/patch-ltx23-video-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/ltx23-video-backend
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Apply Studio video wiring
        working-directory: apps/studio
        run: node scripts/patch-ltx23-video-ui.mjs
      - name: Commit Studio changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/src/main.jsx apps/studio/src/create-controls.jsx apps/studio/src/create-workspace-v2.css
          git diff --cached --quiet && exit 0
          git commit -m "Wire Studio Video controls to LTX 2.3 jobs"
          git push origin HEAD:studio/ltx23-video-backend
