name: Apply Frame Rate Visual Locator Fix

on:
  push:
    branches:
      - studio/create-advanced-presets
    paths:
      - .github/workflows/patch-video-preview-fps-locator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/create-advanced-presets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/patch_video_preview_fps_locator.py
      - run: |
          rm scripts/patch_video_preview_fps_locator.py
          rm .github/workflows/patch-video-preview-fps-locator.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "test(studio): locate Advanced frame-rate control accessibly"
          git push origin HEAD:studio/create-advanced-presets
