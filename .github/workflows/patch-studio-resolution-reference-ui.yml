name: Patch Studio unified resolution UI

on:
  push:
    branches: [studio/unified-resolution-reference-cleanup]
    paths:
      - "apps/studio/scripts/patch-resolution-reference-ui.mjs"
      - ".github/workflows/patch-studio-resolution-reference-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/unified-resolution-reference-cleanup
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Apply UI patch
        run: node apps/studio/scripts/patch-resolution-reference-ui.mjs
      - name: Commit final source changes and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Unify Studio resolution pickers and reference cleanup"
          git push origin HEAD:studio/unified-resolution-reference-cleanup
