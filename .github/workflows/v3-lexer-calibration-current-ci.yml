name: V3 Lexer Calibration Current CI

on:
  push:
    branches:
      - v3/qualification-lexer-calibration-current-ci

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          enable-cache: true
      - name: Verify lockfile and install
        run: uv sync --frozen --extra dev
      - name: Run V3 lexer and identity tests
        run: uv run pytest -q tests/test_v3_lexer_benchmark.py tests/test_v3_identity_ranking.py tests/test_v3_ettin_adapter.py
      - name: Verify architecture boundaries
        run: uv run pytest -q tests/test_architecture_boundaries.py
