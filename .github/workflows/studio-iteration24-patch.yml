name: Studio Iteration 24 Patch

on:
  push:
    branches: [studio/video-gallery-ux]
    paths:
      - "scripts/studio_iteration24_patch.py"
      - ".github/workflows/studio-iteration24-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/studio_iteration24_patch.py
      - name: Commit patched visual harness
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/studio/scripts/capture-gallery-preview.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test(studio): cover Gallery density modes"
          git push origin HEAD:studio/video-gallery-ux
