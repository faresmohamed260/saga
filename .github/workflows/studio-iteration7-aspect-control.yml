name: Studio Iteration 7 Aspect Control

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/studio-iteration7-aspect-control.yml"
      - "apps/studio/scripts/iteration7_aspect_control_patch.py"

permissions:
  contents: write

jobs:
  implement-and-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: studio/video-gallery-ux
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Mark checklist Item 07 in progress
        shell: bash
        run: |
          set -euo pipefail
          python apps/studio/scripts/iteration7_aspect_control_patch.py progress
          git add docs/studio-ui-polish-checklist.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Mark unified Video Aspect control in progress"
          git push origin HEAD:studio/video-gallery-ux

      - name: Apply unified Video Aspect implementation
        run: python apps/studio/scripts/iteration7_aspect_control_patch.py product

      - name: Validate source formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: Install Studio dependencies
        working-directory: apps/studio
        run: npm install --no-audit --no-fund

      - name: Run poster and deferred-preview contract
        working-directory: apps/studio
        run: npm run test:poster

      - name: Build Studio
        working-directory: apps/studio
        run: npm run build

      - name: Install Playwright Chromium
        working-directory: apps/studio
        run: npx playwright install --with-deps chromium

      - name: Start GitHub runner preview
        working-directory: apps/studio
        shell: bash
        run: |
          set -euo pipefail
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/studio-iteration7-preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/studio-iteration7-preview.log
          exit 1

      - name: Capture deterministic visual and interaction evidence
        working-directory: apps/studio
        env:
          UI_PREVIEW_URL: http://127.0.0.1:4173/#/create
          UI_PREVIEW_DIR: visual-preview
        run: npm run visual:preview

      - name: Publish Iteration 7 visual artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-iteration7-aspect-control-${{ github.run_id }}
          path: |
            apps/studio/visual-preview/*.png
            apps/studio/visual-preview/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git add apps/studio/src/features/create/VideoGenerationControls.jsx apps/studio/scripts/capture-video-output-preview.mjs
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Unify Video aspect controls"
          git push origin HEAD:studio/video-gallery-ux
          echo "Validated product head: $(git rev-parse HEAD)"
